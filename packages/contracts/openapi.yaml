openapi: 3.1.0
info:
  title: Cineko API
  version: 0.1.0
  description: |
    Contract for the Cineko backend. This file is the source of truth: the
    TypeScript client in `src/schema.d.ts` is generated from it (`pnpm gen`).

    Authentication:
    - Browsers: `mt_session` HttpOnly cookie. State-changing requests must send
      `X-CSRF-Token` (from `GET /auth/session`) and come from an allowed Origin.
    - API tokens: `Authorization: Bearer mtp_…` with scopes.
    - TV devices: `Authorization: Bearer mtd_…`.
    - Pairing TVs: `Authorization: Pairing <poll_secret>` on pairing status/exchange.

    Errors always use the `Error` envelope. Collections use `{ "items": [...] }`.

    Language: `lang` parameters choose catalog data (en | ru; a Kazakh app
    asks for ru). The apps also send `X-Cineko-Language: en | ru | kk`, the
    language they show: server-written text (Ask AI, «Ранее в сериале»,
    «После титров», AI facts, personal reasons, rubric titles) follows it
    when it reads the requested catalog language — Kazakh for kk with lang=ru.
servers:
  - url: /api/v1
security:
  - cookieAuth: []
  - bearerAuth: []

paths:
  /auth/login:
    post:
      tags: [auth]
      security: []
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string }
                password: { type: string }
      responses:
        "200":
          description: Signed in; sets the session cookie.
          content:
            application/json:
              schema:
                type: object
                required: [user, csrf_token]
                properties:
                  user: { $ref: "#/components/schemas/User" }
                  csrf_token: { type: string }
        "401": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /auth/logout:
    post:
      tags: [auth]
      operationId: logout
      responses:
        "204": { description: Signed out. }
  /auth/session:
    get:
      tags: [auth]
      operationId: getSession
      responses:
        "200":
          description: The current principal.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
        "401": { $ref: "#/components/responses/Error" }
  /auth/logout-all:
    post:
      tags: [auth]
      operationId: logoutAll
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                include_devices: { type: boolean, description: Also unpair all TVs and revoke API tokens. }
      responses:
        "204": { description: All sessions revoked. }
  /auth/sessions:
    get:
      tags: [auth]
      operationId: listSessions
      responses:
        "200":
          description: Active browser sessions.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/SessionInfo" } }
  /auth/sessions/{id}:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    delete:
      tags: [auth]
      operationId: revokeSession
      responses:
        "204": { description: Revoked. }
        "404": { $ref: "#/components/responses/Error" }
  /auth/password:
    post:
      tags: [auth]
      operationId: changePassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password, new_password]
              properties:
                current_password: { type: string }
                new_password: { type: string, minLength: 10 }
      responses:
        "204": { description: Changed; other sessions revoked. }
        "422": { $ref: "#/components/responses/Error" }
  /auth/tokens:
    get:
      tags: [auth]
      operationId: listTokens
      responses:
        "200":
          description: Personal API tokens.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/ApiToken" } }
    post:
      tags: [auth]
      operationId: createToken
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, scopes]
              properties:
                name: { type: string, maxLength: 64 }
                scopes: { type: array, items: { $ref: "#/components/schemas/Scope" } }
                expires_in_days: { type: integer, minimum: 1, maximum: 3650 }
      responses:
        "201":
          description: Created. `secret` is shown only once.
          content:
            application/json:
              schema:
                type: object
                required: [token, secret]
                properties:
                  token: { $ref: "#/components/schemas/ApiToken" }
                  secret: { type: string }
        "422": { $ref: "#/components/responses/Error" }
  /auth/tokens/{id}:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    delete:
      tags: [auth]
      operationId: revokeToken
      responses:
        "204": { description: Revoked. }

  /profiles:
    get:
      tags: [profiles]
      operationId: listProfiles
      description: For a TV credential, returns the profiles selectable on that TV.
      responses:
        "200":
          description: Profiles.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Profile" } }
    post:
      tags: [profiles]
      operationId: createProfile
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProfileInput" }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Profile" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /profiles/{id}:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    patch:
      tags: [profiles]
      operationId: updateProfile
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProfileInput" }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Profile" }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      tags: [profiles]
      operationId: deleteProfile
      responses:
        "204": { description: Deleted. }
  /profiles/{id}/verify-pin:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    post:
      tags: [profiles]
      operationId: verifyProfilePin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pin]
              properties:
                pin: { type: string }
      responses:
        "200":
          description: PIN accepted (or profile has no PIN).
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok: { type: boolean }
        "403": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /profiles/{id}/preferences:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      tags: [profiles]
      operationId: getProfilePreferences
      description: Readable by a user with access to the profile, or by a TV (device credential) allowed to use it. Writing is user-only.
      responses:
        "200":
          description: Preferences.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Preferences" }
    put:
      tags: [profiles]
      operationId: putProfilePreferences
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Preferences" }
      responses:
        "200":
          description: Saved.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Preferences" }
    patch:
      tags: [profiles]
      operationId: patchProfilePreferences
      description: Changes only the fields sent (today `ui_language`, what the language pickers write). User-only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                ui_language: { type: string, enum: ["", en, ru, kk] }
      responses:
        "200":
          description: Saved.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Preferences" }
        "422": { $ref: "#/components/responses/Error" }

  /users/directory:
    get:
      tags: [users]
      operationId: userDirectory
      description: Enabled household accounts (for choosing whom to share a TV with). Minimal fields only.
      responses:
        "200":
          description: Users except the caller, by name.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [id, username, display_name]
                      properties:
                        id: { type: string, format: uuid }
                        username: { type: string }
                        display_name: { type: string }
  /devices:
    get:
      tags: [devices]
      operationId: listDevices
      description: |
        Devices the caller owns or was granted (owned first). `scope=all` (super_admin only, else 403
        `super_admin_required`) lists every active device: own, then shared, then everyone else's grouped by
        owner. Each item then carries `owner`; ones reached only through the role have `via: admin` and
        `access: control` (a super_admin may send commands to and read the state of any device; commands to
        such devices are audited as `admin.device_command`).
      parameters:
        - { name: scope, in: query, required: false, schema: { type: string, enum: [all] } }
      responses:
        "200":
          description: Devices the user owns or was granted (with `scope=all`, every device).
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Device" } }
  /devices/me:
    get:
      tags: [devices]
      operationId: getCurrentDevice
      description: TV credential only.
      responses:
        "200":
          description: This TV.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Device" }
  /devices/register:
    post:
      tags: [devices]
      operationId: registerDevice
      description: Manual TV setup with an API token holding the `device:register` scope.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, maxLength: 64 }
                platform: { type: string }
      responses:
        "201":
          description: Registered.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeviceCredentialResponse" }
        "403": { $ref: "#/components/responses/Error" }
  /devices/demo:
    post:
      tags: [devices]
      operationId: createDemoDevice
      description: |
        «Демо TV» (`/demo_tv`): the TV app in a browser signed in to the PWA,
        without pairing. Browser session only (cookie + `X-CSRF-Token`; API
        tokens and TVs get 403). Returns a credential for the session's own
        hidden demo device (created on first use, reused by every tab of the
        session). The credential expires after 12 hours and stops working as
        soon as the session ends; at most 5 live per device (older ones are
        revoked). The demo device acts like a TV the user owns (their own
        profiles only, never shared) but is left out of device lists, remote
        control, the admin TV list, metrics, health samples (posts are
        accepted with 204 and dropped) and realtime (its socket is refused).
      responses:
        "201":
          description: A fresh demo credential (shown once).
          headers:
            Cache-Control: { schema: { type: string }, description: no-store }
          content:
            application/json:
              schema:
                type: object
                required: [device_id, credential, expires_at]
                properties:
                  device_id: { type: string, format: uuid }
                  credential: { type: string, description: "Device credential (mtd_…), use as Bearer." }
                  expires_at: { type: string, format: date-time }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /devices/{id}:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      tags: [devices]
      operationId: getDevice
      responses:
        "200":
          description: Device.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Device" }
        "404": { $ref: "#/components/responses/Error" }
    patch:
      tags: [devices]
      operationId: updateDevice
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, maxLength: 64 }
                default_profile_id: { type: string, format: uuid }
                clear_default_profile: { type: boolean }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Device" }
        "403": { $ref: "#/components/responses/Error" }
    delete:
      tags: [devices]
      operationId: revokeDevice
      description: Unpairs the TV. Its credential stops working immediately.
      responses:
        "204": { description: Revoked. }
  /devices/{id}/state:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      tags: [devices, realtime]
      operationId: getDeviceState
      description: Last state reported by the TV (the TV is authoritative). `state` is null when offline or never reported.
      responses:
        "200":
          description: Online flag and last known state.
          content:
            application/json:
              schema:
                type: object
                required: [online, state]
                properties:
                  online: { type: boolean }
                  state: { oneOf: [{ $ref: "#/components/schemas/DeviceState" }, { type: "null" }] }
        "404": { $ref: "#/components/responses/Error" }
  /devices/{id}/commands:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    post:
      tags: [devices, realtime]
      operationId: sendDeviceCommand
      description: |
        HTTP alternative to sending a command over /ws (for API tokens and
        clients without a socket). Waits for the TV's ack (up to ~10 s). The
        same `id` may be retried safely: completed commands are answered from
        cache for 5 minutes and never executed twice.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CommandRequest" }
      responses:
        "200":
          description: The TV's (or server's) ack. `ok:false` carries an error code.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CommandAck" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /devices/{id}/permissions:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      tags: [devices]
      operationId: listDevicePermissions
      responses:
        "200":
          description: Users the device is shared with.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/DevicePermission" } }
    put:
      tags: [devices]
      operationId: shareDevice
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, permission]
              properties:
                username: { type: string }
                permission: { type: string, enum: [control, use] }
      responses:
        "200":
          description: Shared.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DevicePermission" }
        "422": { $ref: "#/components/responses/Error" }
  /devices/{id}/permissions/{userId}:
    parameters:
      - { $ref: "#/components/parameters/Id" }
      - { name: userId, in: path, required: true, schema: { type: string, format: uuid } }
    delete:
      tags: [devices]
      operationId: unshareDevice
      responses:
        "204": { description: Removed. }
  /devices/me/playback-prefs:
    get:
      tags: [devices]
      operationId: getOwnPlaybackPrefs
      description: "TV credential only: this TV's playback profile (alias of /devices/{id}/playback-prefs with its own id)."
      responses:
        "200":
          description: This TV's playback profile.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlaybackPrefs" }
    patch:
      tags: [devices]
      operationId: updateOwnPlaybackPrefs
      description: "TV credential only. The TV reports `auto` (detected codecs, screen, throughput) and may edit `manual` (its own «Это устройство» settings). Each given part replaces that part wholesale."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PlaybackPrefsPatch" }
      responses:
        "200":
          description: Updated profile.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlaybackPrefs" }
        "400": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /devices/{id}/playback-prefs:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      tags: [devices]
      operationId: getDevicePlaybackPrefs
      description: |
        Per-device playback profile (auto = detected by the TV, manual = user
        overrides, effective = merged, manual wins). Users: the owner or a user
        the TV is shared with as `use`; super_admin: any TV. `control`-only and
        strangers get 404. A TV credential may only read its own id.
      responses:
        "200":
          description: The TV's playback profile.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlaybackPrefs" }
        "404": { $ref: "#/components/responses/Error" }
    patch:
      tags: [devices]
      operationId: updateDevicePlaybackPrefs
      description: "Same access as GET. Each given part (`auto`, `manual`) replaces that part wholesale; send the full object. Unknown fields are dropped; invalid values → 422 validation_failed with per-field details; body > 8 KB → 413."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PlaybackPrefsPatch" }
      responses:
        "200":
          description: Updated profile.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlaybackPrefs" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /devices/{id}/settings:
    parameters:
      - name: id
        in: path
        required: true
        description: "Device id, or `me` for the calling TV."
        schema: { type: string }
    get:
      tags: [devices]
      operationId: getTvSettings
      description: |
        A TV's settings: its own options (`device`, every profile) and, for
        one profile, the TV's layer of the profile settings (`overrides`) and
        the merged result (`effective`). Access like playback-prefs: the TV
        itself, its owner, a `use` share (own profiles only) and any
        super_admin; `control`-only and strangers get 404.
      parameters:
        - name: profile_id
          in: query
          description: "Default: the profile the TV shows now, else its default profile, else the first one. Not editable by the caller → 404."
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: The TV's settings.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TvSettings" }
        "404": { $ref: "#/components/responses/Error" }
    patch:
      tags: [devices]
      operationId: updateTvSettings
      description: |
        Same access as GET. `device` keys replace the TV's own options,
        `reset_device` unsets them; `profile` (layered keys only) is stored in
        the TV's layer of `profile_id`, `reset` removes keys from it (back to
        the profile). Edited by anyone but the TV itself, the TV gets the
        realtime event `settings.changed` {profile_id?} and applies it at once.
        Invalid → 422 validation_failed; body > 16 KB → 413.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TvSettingsPatch" }
      responses:
        "200":
          description: The TV's settings after the change.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TvSettings" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /devices/{id}/health:
    parameters:
      - name: id
        in: path
        required: true
        description: "Device id, or `me` for the calling TV."
        schema: { type: string }
    get:
      tags: [devices]
      operationId: getDeviceHealth
      description: |
        TV health («Состояние»): the newest sample and the last 50 (newest
        first). Readers: the TV itself, its owner, any super_admin; shared
        users, plain admins and strangers get 404.
      responses:
        "200":
          description: Health samples.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeviceHealth" }
        "404": { $ref: "#/components/responses/Error" }
    post:
      tags: [devices]
      operationId: postDeviceHealth
      description: |
        TV credential only, for its own id (or `me`); users get 403, another
        TV's id 404. The TV posts ≈2 min after start, then every 10 min, plus
        once after a playback session — never when reporting is switched off
        on that TV. Unknown fields are dropped; out-of-range values → 422;
        body > 4 KB → 413; more than one post per minute per TV → 429. The
        newest 50 samples per TV are kept.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DeviceHealthSample" }
      responses:
        "201":
          description: Stored sample (with `at`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeviceHealthSample" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /me/playback-clients:
    get:
      tags: [devices]
      operationId: listPlaybackClients
      description: "The caller's browsers/phones (PWA) with a playback profile, newest first (at most 20 per user; saving a 21st drops the oldest). Browser session or API token only (TV credentials 403)."
      responses:
        "200":
          description: Client playback profiles.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/ClientPlaybackPrefs" } }
  /me/playback-clients/{client_id}:
    parameters:
      - { name: client_id, in: path, required: true, description: "Stable per-browser id (localStorage martytv.client_id).", schema: { type: string, pattern: "^[A-Za-z0-9_-]{8,64}$" } }
    get:
      tags: [devices]
      operationId: getPlaybackClient
      responses:
        "200":
          description: This browser's profile.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ClientPlaybackPrefs" }
        "404": { $ref: "#/components/responses/Error" }
    patch:
      tags: [devices]
      operationId: upsertPlaybackClient
      description: "Creates or updates this browser's record. Given `auto`/`manual` replace that part wholesale; `name`/`platform` update when given."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ClientPlaybackPrefsPatch" }
      responses:
        "200":
          description: Saved profile.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ClientPlaybackPrefs" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
    delete:
      tags: [devices]
      operationId: deletePlaybackClient
      responses:
        "204": { description: Deleted. }
        "404": { $ref: "#/components/responses/Error" }

  /pairing:
    post:
      tags: [pairing]
      security: []
      operationId: startPairing
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                device_name: { type: string, maxLength: 64 }
                platform: { type: string }
      responses:
        "201":
          description: Pairing request opened (expires in ~5 minutes).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PairingStart" }
        "429": { $ref: "#/components/responses/Error" }
  /pairing/lookup:
    get:
      tags: [pairing]
      operationId: lookupPairing
      parameters:
        - { name: code, in: query, required: true, schema: { type: string } }
      responses:
        "200":
          description: The waiting TV.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PairingPending" }
        "404": { $ref: "#/components/responses/Error" }
  /pairing/{id}:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      tags: [pairing]
      security: [{ pairingSecret: [] }]
      operationId: getPairingStatus
      responses:
        "200":
          description: Status for the TV that opened the request.
          content:
            application/json:
              schema:
                type: object
                required: [status, expires_at]
                properties:
                  status: { type: string, enum: [pending, approved, denied, consumed, expired] }
                  expires_at: { type: string, format: date-time }
        "404": { $ref: "#/components/responses/Error" }
  /pairing/{id}/exchange:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    post:
      tags: [pairing]
      security: [{ pairingSecret: [] }]
      operationId: exchangePairing
      responses:
        "200":
          description: Device credential (returned exactly once).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeviceCredentialResponse" }
        "409": { $ref: "#/components/responses/Error" }
        "410": { $ref: "#/components/responses/Error" }
  /pairing/{id}/approve:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    post:
      tags: [pairing]
      operationId: approvePairing
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, maxLength: 64 }
                default_profile_id: { type: string, format: uuid }
      responses:
        "204": { description: Approved. }
        "410": { $ref: "#/components/responses/Error" }
  /pairing/{id}/deny:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    post:
      tags: [pairing]
      operationId: denyPairing
      responses:
        "204": { description: Denied. }

  /admin/users:
    get:
      tags: [admin]
      operationId: adminListUsers
      responses:
        "200":
          description: All accounts.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/AdminUser" } }
    post:
      tags: [admin]
      operationId: adminCreateUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string }
                display_name: { type: string }
                password: { type: string, minLength: 10 }
                role: { $ref: "#/components/schemas/Role" }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminUser" }
        "403": { description: "super_admin_required: only a super_admin creates admin/super_admin accounts." }
        "422": { $ref: "#/components/responses/Error" }
  /admin/users/{id}:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    patch:
      tags: [admin]
      operationId: adminUpdateUser
      description: |
        Roles: user < admin < super_admin. A plain admin may disable/enable,
        rename and reset passwords of regular users only; changing an admin or
        super_admin, or granting/revoking admin or super_admin, needs a
        super_admin (403 super_admin_required). Your own role and disabling
        yourself are refused (409 self_lockout); so is removing the last active
        administrator (409 last_admin) or super_admin (409 last_super_admin).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                disabled: { type: boolean }
                role: { $ref: "#/components/schemas/Role" }
                display_name: { type: string }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminUser" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /admin/users/{id}/password:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    post:
      tags: [admin]
      operationId: adminResetPassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password: { type: string, minLength: 10 }
      responses:
        "204": { description: Reset; user's sessions revoked. }
  /admin/new-episodes:
    get:
      tags: [admin]
      operationId: adminNewEpisodes
      description: The nightly «Новые серии» check — schedule (NEW_EPISODES_AT in NEW_EPISODES_TZ) and the last 10 runs.
      responses:
        "200":
          description: Status.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NewEpisodesStatus" }
  /admin/new-episodes/run:
    post:
      tags: [admin]
      operationId: adminRunNewEpisodes
      description: Starts a check now (in the background).
      responses:
        "202": { description: Started. }
        "409": { $ref: "#/components/responses/Error" }
  /admin/integrations:
    get:
      tags: [admin]
      operationId: adminIntegrations
      responses:
        "200":
          description: External service health (no secrets).
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/IntegrationStatus" } }
  /admin/appearance:
    get:
      tags: [admin]
      operationId: adminAppearance
      description: "Server-wide look switches (app_settings). seasonal_effects = the holiday animations for everyone (default true)."
      responses:
        "200": { description: Current switches., content: { application/json: { schema: { $ref: "#/components/schemas/AdminAppearance" } } } }
        "403": { $ref: "#/components/responses/Error" }
    put:
      tags: [admin]
      operationId: updateAdminAppearance
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/AdminAppearance" } } }
      responses:
        "200": { description: Saved (audited appearance.updated)., content: { application/json: { schema: { $ref: "#/components/schemas/AdminAppearance" } } } }
        "403": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /admin/playback:
    get:
      tags: [admin]
      operationId: adminPlayback
      description: "Server-wide playback switches (app_settings). instant_play = «Мгновенный старт» (POST /playback/warm; default true)."
      responses:
        "200": { description: Current switches., content: { application/json: { schema: { $ref: "#/components/schemas/AdminPlayback" } } } }
        "403": { $ref: "#/components/responses/Error" }
    put:
      tags: [admin]
      operationId: updateAdminPlayback
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/AdminPlayback" } } }
      responses:
        "200": { description: Saved (audited playback_settings.updated)., content: { application/json: { schema: { $ref: "#/components/schemas/AdminPlayback" } } } }
        "403": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }

  # ---------------------------------------------------------------- catalog (Phase 2)
  /catalog/config:
    get:
      tags: [catalog]
      operationId: catalogConfig
      description: Image base URL and sizes, plus the TMDB attribution text clients must show.
      responses:
        "200":
          description: Catalog configuration.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CatalogConfig" }
        "401": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/CatalogUnavailable" }
        "502": { $ref: "#/components/responses/Error" }
  /catalog/home:
    get:
      tags: [catalog]
      operationId: catalogHome
      parameters: [{ $ref: "#/components/parameters/Lang" }, { $ref: "#/components/parameters/ProfileId" }]
      responses:
        "200":
          description: Home screen rows (titles are localized by clients from `key`).
          content:
            application/json:
              schema:
                type: object
                required: [rows]
                properties:
                  rows: { type: array, items: { $ref: "#/components/schemas/HomeRow" } }
        "401": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/CatalogUnavailable" }
        "502": { $ref: "#/components/responses/Error" }
  /catalog/lists/{list}:
    parameters:
      - name: list
        in: path
        required: true
        schema: { $ref: "#/components/schemas/ListKey" }
    get:
      tags: [catalog]
      operationId: catalogList
      description: |
        Curated lists. `upcoming` and `now_playing` are movie-only; `on_the_air` and
        `airing_today` are series-only; `trending` accepts kind=all.
      parameters:
        - { name: kind, in: query, required: true, schema: { type: string, enum: [all, movie, series] } }
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/Lang" }
        - { $ref: "#/components/parameters/ProfileId" }
        - { $ref: "#/components/parameters/HideWatched" }
      responses:
        "200":
          description: One page.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MediaPage" }
        "401": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/CatalogUnavailable" }
        "502": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /catalog/discover:
    get:
      tags: [catalog]
      operationId: catalogDiscover
      parameters:
        - { name: kind, in: query, required: true, schema: { type: string, enum: [movie, series] } }
        - { name: genres, in: query, description: "Comma-separated TMDB genre ids (all must match).", schema: { type: string } }
        - { name: year_from, in: query, schema: { type: integer } }
        - { name: year_to, in: query, schema: { type: integer } }
        - { name: runtime_min, in: query, schema: { type: integer } }
        - { name: runtime_max, in: query, schema: { type: integer } }
        - { name: original_language, in: query, description: "ISO 639-1, e.g. en, ru, ko.", schema: { type: string } }
        - { name: rating_min, in: query, schema: { type: number, minimum: 0, maximum: 10 } }
        - { name: sort, in: query, schema: { type: string, enum: [popularity, rating, release_date, title], default: popularity } }
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/Lang" }
        - { $ref: "#/components/parameters/ProfileId" }
        - { $ref: "#/components/parameters/HideWatched" }
      responses:
        "200":
          description: One page of matches.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MediaPage" }
        "401": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/CatalogUnavailable" }
        "502": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /catalog/search:
    get:
      tags: [catalog]
      operationId: catalogSearch
      description: Multilingual title search (matches original, translated and alternative titles).
      parameters:
        - { name: q, in: query, required: true, schema: { type: string, minLength: 1, maxLength: 100 } }
        - { name: kind, in: query, schema: { type: string, enum: [all, movie, series], default: all } }
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/Lang" }
        - { $ref: "#/components/parameters/ProfileId" }
      responses:
        "200":
          description: One page of results (people are excluded).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MediaPage" }
        "401": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/CatalogUnavailable" }
        "502": { $ref: "#/components/responses/Error" }
  /catalog/genres:
    get:
      tags: [catalog]
      operationId: catalogGenres
      parameters:
        - { name: kind, in: query, required: true, schema: { type: string, enum: [movie, series] } }
        - { $ref: "#/components/parameters/Lang" }
      responses:
        "200":
          description: Genres.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Genre" } }
        "401": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/CatalogUnavailable" }
        "502": { $ref: "#/components/responses/Error" }
  /media/{id}:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      tags: [catalog]
      operationId: getMedia
      parameters: [{ $ref: "#/components/parameters/Lang" }, { $ref: "#/components/parameters/ProfileId" }]
      responses:
        "200":
          description: Full details.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MediaDetail" }
        "401": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/CatalogUnavailable" }
        "502": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /media/{id}/similar:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      tags: [catalog]
      operationId: getMediaSimilar
      parameters: [{ $ref: "#/components/parameters/Page" }, { $ref: "#/components/parameters/Lang" }, { $ref: "#/components/parameters/ProfileId" }]
      responses:
        "200":
          description: Similar titles.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MediaPage" }
        "401": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/CatalogUnavailable" }
        "502": { $ref: "#/components/responses/Error" }
  /media/{id}/recommendations:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      tags: [catalog]
      operationId: getMediaRecommendations
      parameters: [{ $ref: "#/components/parameters/Page" }, { $ref: "#/components/parameters/Lang" }, { $ref: "#/components/parameters/ProfileId" }]
      responses:
        "200":
          description: TMDB recommendations for this title.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MediaPage" }
        "401": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/CatalogUnavailable" }
        "502": { $ref: "#/components/responses/Error" }
  /media/{id}/seasons/{season}:
    parameters:
      - { $ref: "#/components/parameters/Id" }
      - { name: season, in: path, required: true, schema: { type: integer, minimum: 0 } }
    get:
      tags: [catalog]
      operationId: getSeason
      parameters: [{ $ref: "#/components/parameters/Lang" }]
      responses:
        "200":
          description: Season with episodes (series only).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Season" }
        "401": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/CatalogUnavailable" }
        "502": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /media/{id}/providers:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      tags: [catalog]
      operationId: getMediaProviders
      description: Optional streaming availability from TMDB (JustWatch data); may be empty.
      parameters:
        - { name: region, in: query, description: "ISO 3166-1 alpha-2; defaults to CATALOG_REGION.", schema: { type: string } }
      responses:
        "200":
          description: Providers.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Providers" }
        "401": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/CatalogUnavailable" }
        "502": { $ref: "#/components/responses/Error" }
  /media/{id}/quotes:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      tags: [catalog]
      operationId: getMediaQuotes
      description: |
        «Цитаты»: famous quotes from Wikiquote (the page is found through Wikidata
        by TMDB id), in `lang` or else the other language; at most 12, taken
        round-robin across characters. Empty when Wikiquote has nothing. Never
        AI-written. Cached 30 days (misses 7); the first call may take seconds.
      parameters:
        - { $ref: "#/components/parameters/Lang" }
      responses:
        "200":
          description: Quotes.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MediaQuotes" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "502": { $ref: "#/components/responses/Error" }
  /media/{id}/facts:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      tags: [catalog]
      operationId: getMediaFacts
      description: |
        «Факты»: Kinopoisk's facts and bloopers (keyed API, budgeted; Russian) when
        the title has a Kinopoisk id and some facts; otherwise written by DeepSeek
        in `lang` (`source: ai`). At most 15, facts before bloopers. Cached 30 days
        (AI stand-ins for a day while Kinopoisk may still answer).
      parameters:
        - { $ref: "#/components/parameters/Lang" }
      responses:
        "200":
          description: Facts.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MediaFacts" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "502": { $ref: "#/components/responses/Error" }
  /media/{id}/companion:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      tags: [catalog]
      operationId: getMediaCompanion
      description: |
        Which watch-companion buttons the profile gets on this title (internal/companion).
        «Ранее в сериале» (`recap.available`): a series with completed episodes, last
        touched ≥ 7 days ago. «После титров» (`after_credits.available`): a completed
        movie, or a series whose season finale is completed (`scope: season`, or
        `series` for the final season of an ended show). Both false while AI is off
        (no DeepSeek key, or the admin switch `companion_ai`).
      parameters:
        - { $ref: "#/components/parameters/Lang" }
        - { name: profile_id, in: query, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Availability.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MediaCompanion" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /media/{id}/recap:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    post:
      tags: [catalog]
      operationId: postMediaRecap
      description: |
        «Ранее в сериале»: ≤ 5 lines built by DeepSeek ONLY from the TMDB synopses of the
        episodes this profile completed (the furthest 12; nothing past the last watched
        one is sent). Cached by the exact episodes used (a repeat press is free, `cached`).
        409 `not_eligible` (no break yet / nothing completed), 422 `no_synopses`,
        429 `companion_limit` (FORYOU_COMPANION_DAILY_PER_PROFILE per Moscow day, uncached
        answers only) or `ai_budget`, 502 `ai_failed` (not counted), 503 `ai_disabled`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CompanionRequest" }
      responses:
        "200":
          description: The recap.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SeriesRecap" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
        "502": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /media/{id}/after-credits:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    post:
      tags: [catalog]
      operationId: postMediaAfterCredits
      description: |
        «После титров» (spoilers): `topic: ending` «Объяснение финала» or `significance`
        «Почему это важно» (told to stay general, avoid unverifiable facts and say when it
        doesn't know: `known: false`). Only for what the profile finished; never past that
        season. Cached per title, scope and language. Errors as for /recap.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/CompanionRequest"
                - type: object
                  required: [topic]
                  properties:
                    topic: { type: string, enum: [ending, significance] }
      responses:
        "200":
          description: The text.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AfterCredits" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
        "502": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /media/{id}/after-credits/chat:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      tags: [catalog]
      operationId: getMediaAfterCreditsChat
      description: The profile's spoiler chat about what it finished (empty when none, or when it was about an earlier season).
      parameters:
        - { $ref: "#/components/parameters/Lang" }
        - { name: profile_id, in: query, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: The chat.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AfterCreditsChat" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
    post:
      tags: [catalog]
      operationId: postMediaAfterCreditsChat
      description: |
        Sends one message (2–300 characters) and returns the chat with the answer
        (1–4 sentences, about this title only; off-topic or injection → `refused`).
        At most 6 messages per chat (409 `chat_full`); `reset: true` starts over
        (with or without a message). Each message counts toward the daily limit.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/CompanionRequest"
                - type: object
                  properties:
                    message: { type: string, maxLength: 300 }
                    reset: { type: boolean }
      responses:
        "200":
          description: The chat.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AfterCreditsChat" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
        "502": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /people/{tmdb_id}:
    get:
      tags: [catalog]
      operationId: getPerson
      description: |
        An actor's or director's page: bio and their films and series (TMDB
        combined credits), most popular first. Talk shows and appearances as
        oneself are left out. With profile_id, titles carry the profile's state.
      parameters:
        - { name: tmdb_id, in: path, required: true, schema: { type: integer, minimum: 1 } }
        - { $ref: "#/components/parameters/Lang" }
        - { $ref: "#/components/parameters/ProfileId" }
      responses:
        "200":
          description: The person.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Person" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/CatalogUnavailable" }
        "502": { $ref: "#/components/responses/Error" }
  /images/{size}/{file}:
    get:
      tags: [catalog]
      operationId: getImage
      security: []
      description: |
        Same-origin image proxy/cache for TMDB images, used when IMAGE_PROXY=true
        (e.g. TVs without direct internet, or regions where image.tmdb.org is blocked).
        Only TMDB sizes and file names are accepted.
      parameters:
        - { name: size, in: path, required: true, schema: { type: string, enum: [w92, w154, w185, w300, w342, w500, w780, w1280, h632, original] } }
        - { name: file, in: path, required: true, schema: { type: string, pattern: "^[A-Za-z0-9_-]+\\.(jpg|png|svg)$" } }
      responses:
        "200": { description: Image bytes. }
        "404": { $ref: "#/components/responses/Error" }

  # ---------------------------------------------------------------- releases & playback (Phase 4)
  /media/{id}/releases:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      tags: [releases]
      operationId: listReleases
      description: |
        Searches the torrent sources the profile enabled (Prowlarr, Jacred;
        server-side, keys never reach clients), merges and de-duplicates them
        by info hash, parses and normalizes them, rejects wrong matches, and
        ranks them by confidence + the profile's preferences. A source that
        fails is listed in `indexer_errors`; 502 only when all failed. A
        profile with no torrent source enabled gets an empty list.
        Series: pass `season` (and optionally `episode`) to rank packs/episodes.
        Results are cached ~30 min unless `refresh=true`.
        Device playback profiles (`device_id`, `client_id`, or the calling TV)
        only re-rank per request (penalties, never hiding): warnings
        too_heavy_for_device, over_device_resolution, codec_unsupported,
        codec_unknown (likely XviD: an old-style rip naming no codec or resolution),
        audio_needs_conversion, audio_unsupported, hdr_avoided, may_stutter
        (the variant is in the device's auto.rough); reason device_fit when a
        release fits every constraint.
      parameters:
        - { name: season, in: query, schema: { type: integer, minimum: 0 } }
        - { name: episode, in: query, schema: { type: integer, minimum: 1 } }
        - { name: profile_id, in: query, description: "Rank with this profile's preferences (must be accessible to the caller).", schema: { type: string, format: uuid } }
        - { name: refresh, in: query, schema: { type: boolean } }
        - { name: q, in: query, description: "«Уточнить»: search Prowlarr with this text instead of the automatic queries (2–100 chars; counts against the refresh rate limit).", schema: { type: string, minLength: 2, maxLength: 100 } }
        - { name: loose, in: query, description: "«Уточнить»: also return uncertain matches (low confidence, year/version differences; with q, also differently titled uploads). They carry the warning uncertain_match and confidence < 0.5. Sequels, soundtracks and wrong seasons/episodes are never returned.", schema: { type: boolean } }
        - { name: device_id, in: query, description: "Rank for this TV's playback profile (caller needs owner/use access or super_admin, else 404). A TV credential's own profile applies automatically.", schema: { type: string, format: uuid } }
        - { name: client_id, in: query, description: "Rank for this browser's playback profile (the caller's own /me/playback-clients record; unknown → no device profile).", schema: { type: string, pattern: "^[A-Za-z0-9_-]{8,64}$" } }
        - { name: device_prefs, in: query, description: "off = ignore device/browser playback profiles («Показать все»).", schema: { type: string, enum: ["on", "off"] } }
        - { $ref: "#/components/parameters/Lang" }
      responses:
        "200":
          description: Ranked releases (best first). Rejected/low-confidence matches are excluded.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReleaseList" }
        "404": { $ref: "#/components/responses/Error" }
        "502": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /playback/sources:
    post:
      tags: [playback]
      operationId: createPlaybackSource
      description: |
        Prepares a release for streaming: registers it with TorrServer, waits
        for torrent metadata, selects the movie/episode file, and returns a
        source with a short-lived `stream_url`. May return `status: preparing`;
        poll GET /playback/sources/{id} until `ready` or `error`.
        Re-using the same (release, episode) returns the existing source.

        Online: pass an OnlineVariant id (`o…`) from /media/{id}/online as
        `release_id` (optionally `quality`). The source is `kind: online`,
        `ready` at once, and streams through the same /stream/{token} proxy
        (`format` mp4 or hls).

        IPTV: `{kind: "iptv", channel_id, profile_id?}` (no media/release). Returns a `kind: iptv`,
        `live: true` source at once whose `stream_url` (/api/v1/live/<token>/index.m3u8, or
        …/stream.ts for plain MPEG-TS channels) goes through the signed live proxy. It has no id to
        GET later (POST again for a fresh token), no duration and no progress reporting.
        The server opens the channel first (its URL, then mirrors: other URLs of the same tvg-id),
        with short timeouts; when none answers it fails in seconds with 502 and a cause:
        `channel_geo_blocked` (403/451: region or access restricted), `channel_timeout`,
        `channel_format_unsupported` (not HLS / MPEG-TS, e.g. DASH or an HTML page) or
        `channel_unavailable` (offline: DNS, 404, refused, 5xx). The failure is remembered for 45 s.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: "media_id and release_id are required unless kind is iptv (then channel_id is) or video (then video_id is; quality caps the height, default the profile's video_quality)."
              properties:
                kind: { type: string, enum: [release, iptv, video], default: release }
                video_id: { type: string, pattern: "^[A-Za-z0-9_-]{11}$", description: "Video: the YouTube video id (kind video; see /video/*)." }
                channel_id: { type: string, format: uuid, description: "IPTV: IptvChannel.id." }
                media_id: { type: string, format: uuid }
                release_id: { type: string, maxLength: 128, description: "Release.id from /media/{id}/releases, or OnlineVariant.id (\"o…\") from /media/{id}/online (valid 24 h)." }
                episode_id: { type: string, format: uuid, description: "Series: which episode to select inside the torrent / which episode of a season-level online variant." }
                profile_id: { type: string, format: uuid }
                quality: { type: integer, description: "Online only: wanted vertical resolution from the variant's qualities (default: best ≤ the profile's preferred resolution)." }
                audio: { type: string, pattern: "^(original|[A-Za-z]{2,3}(-[A-Za-z0-9]{2,8})?)$", description: "Video: the audio track — original (the video's own) or a language (ru, pt-br; a base language matches a regional track). Ignored when the video lacks it (then VIDEO_LANG, the original, English — in that order)." }
      responses:
        "201":
          description: Source (preparing or ready).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlaybackSource" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "502": { $ref: "#/components/responses/Error" }
  /playback/warm:
    post:
      tags: [playback]
      operationId: warmPlayback
      description: |
        Instant play («Мгновенный старт»): a title page open for a couple of seconds names the
        release its Play would start (the client's own ranking, as for Play). In the background
        the server prepares it like POST /playback/sources (TorrServer, metadata, file), reads a
        small head of the file (or of `start_seconds`) and keeps the torrent connected for a few
        minutes. POST /playback/sources with the same media / episode / release then returns that
        source at once (usually `ready`). One warm per profile (a newer one replaces it), two per
        server; a warm nobody plays is dropped after `expires_at` (its torrent only when it was added
        for it). Never creates playback sessions or history. Answers at once.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [media_id, profile_id]
              description: "release_id, or source_id when Play resumes the source the title was last watched with (WatchProgress.source_id; its release and episode are used, and its GET counts as Play)."
              properties:
                media_id: { type: string, format: uuid }
                episode_id: { type: string, format: uuid, description: "Series: the episode Play would start (resume / next up)." }
                release_id: { type: string, maxLength: 128 }
                source_id: { type: string, format: uuid }
                profile_id: { type: string, format: uuid }
                start_seconds: { type: number, minimum: 0, description: "The resume position Play will start at (0 = the start)." }
      responses:
        "202":
          description: Warming, or skipped with a reason.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WarmResult" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
    delete:
      tags: [playback]
      operationId: cancelPlaybackWarm
      description: The viewer left the title page — the profile's warm stops (dropped after a few seconds unless Play takes it meanwhile).
      parameters:
        - { name: profile_id, in: query, required: true, schema: { type: string, format: uuid } }
      responses:
        "204": { description: Cancelled (or nothing to cancel). }
        "422": { $ref: "#/components/responses/Error" }
  /playback/sources/{id}:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      tags: [playback]
      operationId: getPlaybackSource
      description: Current status, live torrent stats, media info and a fresh stream_url.
      responses:
        "200":
          description: Source.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlaybackSource" }
        "404": { $ref: "#/components/responses/Error" }
    patch:
      tags: [playback]
      operationId: selectPlaybackFile
      description: "Torrent: manually pick another file (e.g. wrong episode auto-selected). Online: switch `quality`."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                file_index: { type: integer, minimum: 0, description: "Torrent sources only." }
                quality: { type: integer, description: "Online sources only: one of `qualities`." }
      responses:
        "200":
          description: Updated source.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlaybackSource" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
    delete:
      tags: [playback]
      operationId: cancelPlaybackSource
      description: |
        The viewer cancelled while the source was loading: stops preparing it
        and, when the server added the torrent to TorrServer for this source
        (it wasn't there before) and nothing else uses it, removes the torrent
        so it stops downloading. Otherwise only the preparation stops.
      responses:
        "204": { description: Cancelled. }
        "404": { $ref: "#/components/responses/Error" }
  /playback/sources/{id}/files:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      tags: [playback]
      operationId: listPlaybackFiles
      responses:
        "200":
          description: Files in the torrent (video files flagged).
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/TorrentFile" } }
  /stream/{token}/{filename}:
    get:
      tags: [playback]
      operationId: streamNamed
      security: []
      description: Same as /stream/{token}; the trailing file name (ignored by the server) lets external players (MSX, VLC) detect the container from the URL.
      parameters:
        - { name: token, in: path, required: true, schema: { type: string } }
        - { name: filename, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Media bytes. }
        "206": { description: Partial content. }
        "403": { $ref: "#/components/responses/Error" }
  /stream/{token}:
    get:
      tags: [playback]
      operationId: stream
      security: []
      description: |
        Streams the selected file through the API (proxy to TorrServer) with
        HTTP Range support. The token is an opaque, signed, expiring capability
        bound to one source; it is the only way clients reach TorrServer.
        Used directly as a <video src>. HEAD is supported.
      parameters:
        - { name: token, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Media bytes. }
        "206": { description: Partial content. }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "502": { $ref: "#/components/responses/Error" }
  /stream/{token}/compat.mp4:
    get:
      tags: [playback]
      operationId: streamCompat
      security: []
      description: |
        Browser compatibility stream of a torrent source (PlaybackSource.compat_url;
        only when the server runs the transcoder). The file is remuxed to
        fragmented MP4: video copied (or, with `video=h264`, re-encoded to
        H.264 — old codecs like XviD / MPEG-2 / VC-1 ≤ 1080p, see
        PlaybackSource.compat_video), one audio track converted to AAC stereo
        (copied when already AAC). No Range support (200, `Accept-Ranges: none`):
        to seek, request again with a new `start`. The stream begins at the
        keyframe at or before `start`; `X-Stream-Start` (seconds) says where, and
        players add it to the element's currentTime. HEAD answers
        `X-Stream-Start` for a `start` without starting a stream. 503
        `transcoder_busy` when the server's conversion slots are full; 502
        `transcoder_unavailable` when the transcoder is down.
      parameters:
        - { name: token, in: path, required: true, schema: { type: string } }
        - { name: audio, in: query, description: "Global stream index of the audio track (MediaInfo.audio[].index). Default: the default track.", schema: { type: integer } }
        - { name: start, in: query, description: "Position in seconds (≤ duration).", schema: { type: number, minimum: 0 } }
        - { name: ch, in: query, description: "2 (default, stereo) or 6 (AAC 5.1).", schema: { type: integer, enum: [2, 6] } }
        - { name: video, in: query, description: "h264: re-encode the video to H.264 (only when PlaybackSource.compat_video; else 422 video_not_convertible). Default: video copied.", schema: { type: string, enum: [h264] } }
      responses:
        "200":
          description: Fragmented MP4 (video/mp4), streamed.
          headers:
            X-Stream-Start: { description: "Where the stream really starts (keyframe), seconds.", schema: { type: number } }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "502": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /stream/{token}/compat.m3u8:
    get:
      tags: [playback]
      operationId: streamCompatHls
      security: []
      description: |
        HLS variant of the compat stream, for Safari / iOS / iPadOS (incl. web
        views such as Media Station X), whose AVFoundation won't play a
        progressive MP4 without byte ranges. Same token, parameters and errors
        as compat.mp4 (replace `compat.mp4` in `compat_url` with
        `compat.m3u8`). Starts (or reuses) a conversion session — video
        copied (HEVC tagged `hvc1`) or re-encoded with `video=h264`, audio →
        AAC — and answers once its first
        segments exist with a multivariant playlist whose one variant is
        `compat/<session>/index.m3u8` (relative). `X-Stream-Start` is the
        keyframe the session begins at; players add it to currentTime. HEAD
        answers `X-Stream-Start` only (no session). Seeking beyond the
        generated segments = request again with a new `start`.
      parameters:
        - { name: token, in: path, required: true, schema: { type: string } }
        - { name: audio, in: query, description: "Global stream index of the audio track (MediaInfo.audio[].index). Default: the default track.", schema: { type: integer } }
        - { name: start, in: query, description: "Position in seconds (≤ duration).", schema: { type: number, minimum: 0 } }
        - { name: ch, in: query, description: "2 (default, stereo) or 6 (AAC 5.1).", schema: { type: integer, enum: [2, 6] } }
        - { name: video, in: query, description: "h264: re-encode the video to H.264 (only when PlaybackSource.compat_video; else 422 video_not_convertible). Default: video copied.", schema: { type: string, enum: [h264] } }
      responses:
        "200":
          description: Multivariant playlist (application/vnd.apple.mpegurl, no-store).
          headers:
            X-Stream-Start: { description: "Where the session really starts (keyframe), seconds.", schema: { type: number } }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "502": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /stream/{token}/compat/{session}/{file}:
    get:
      tags: [playback]
      operationId: streamCompatHlsFile
      security: []
      description: |
        A file of an HLS compat session (from compat.m3u8). `index.m3u8`: the
        fMP4 EVENT media playlist (only finished segments; `#EXT-X-START:
        TIME-OFFSET=0` so playback starts at its beginning; `#EXT-X-ENDLIST`
        once converted to the end; no-store). `init.mp4` / `seg<N>.m4s`:
        video/mp4 with Range (206, `Content-Range`) and HEAD. 404
        `compat_session_gone` when the session ended (unused for a few
        minutes, paused ≥ 10 min, evicted, server restarted) or a segment far
        behind the playhead was deleted: request compat.m3u8 again at the
        position.
      parameters:
        - { name: token, in: path, required: true, schema: { type: string } }
        - { name: session, in: path, required: true, schema: { type: string, pattern: "^[0-9a-f]{32}$" } }
        - { name: file, in: path, required: true, schema: { type: string, pattern: "^(index\\.m3u8|init\\.mp4|seg[0-9]{1,6}\\.m4s)$" } }
        - { name: Range, in: header, schema: { type: string } }
      responses:
        "200": { description: "Playlist (application/vnd.apple.mpegurl) or segment (video/mp4)." }
        "206": { description: Partial segment. }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "416": { description: Range not satisfiable. }
        "502": { $ref: "#/components/responses/Error" }
  /stream/{token}/subs/{file}:
    get:
      tags: [playback]
      operationId: streamCompatSubtitles
      security: []
      description: |
        A text subtitle track (subrip/ass/webvtt/mov_text; not PGS/VOBSUB) of a
        torrent source as WebVTT, timed like the compat stream requested with
        the same `start` (cues relative to its X-Stream-Start). Streams cues as
        the file is read (capped read rate after `burst` seconds of media).
        Same token and errors as compat.mp4.
      parameters:
        - { name: token, in: path, required: true, schema: { type: string } }
        - { name: file, in: path, required: true, description: "<stream index>.vtt (MediaInfo.subtitles[].index)", schema: { type: string, pattern: "^[0-9]{1,4}\\.vtt$" } }
        - { name: start, in: query, schema: { type: number, minimum: 0 } }
        - { name: burst, in: query, description: "Seconds of media read at full speed first (e.g. how far the player already is past start).", schema: { type: number, minimum: 0 } }
      responses:
        "200": { description: "text/vtt; charset=utf-8" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "502": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }

  # ---------------------------------------------------------------- sources (torrent / online / anime providers)
  /sources:
    get:
      tags: [sources]
      operationId: listSources
      description: |
        Catalog of every source provider for the settings UI («Источники»):
        torrent (Prowlarr, Jacred) and anime (AniLiberty; UI group «Аниме»).
        With `profile_id`, `enabled` reflects that profile's choice
        (ProfileSettings.sources); without it every source counts as enabled.
        A source is actually searched only when `enabled` and `available`.
      parameters:
        - { name: profile_id, in: query, description: "Report this profile's choice (must be accessible to the caller).", schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Sources in display order.
          content:
            application/json:
              schema:
                type: object
                required: [items, enabled]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/SourceItem" } }
                  enabled: { $ref: "#/components/schemas/SourcesEnabled" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /media/{id}/online:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      tags: [sources]
      operationId: listOnlineVariants
      description: |
        Looks the title up at every online/anime source the profile enabled
        (concurrently, ~15 s timeout each) and returns playable variants
        (provider × voice-over × quality ladder), best first; the top item has
        `preferred: true` (auto-pick by the profile's preferred_voiceovers,
        audio language and resolution). One source failing never fails the
        response: see `providers[].status`. Results are cached per source
        (6 h; empty 1 h; errors 10 min) unless `refresh=true`.
        Series: with `season` only, one variant per voice lists its
        `episodes`; with `season`+`episode`, per-episode variants.
        Play a variant with POST /playback/sources (`release_id` = variant id).
      parameters:
        - { name: season, in: query, schema: { type: integer, minimum: 0 } }
        - { name: episode, in: query, schema: { type: integer, minimum: 1 } }
        - { name: profile_id, in: query, description: "Use this profile's source choice and preferences.", schema: { type: string, format: uuid } }
        - { name: refresh, in: query, description: "Bypass the cache (rate limited).", schema: { type: boolean } }
        - { $ref: "#/components/parameters/Lang" }
      responses:
        "200":
          description: Variants and per-source status.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OnlineList" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
        "502": { $ref: "#/components/responses/Error" }
  /admin/sources:
    get:
      tags: [admin]
      operationId: adminListSources
      responses:
        "200":
          description: Every source with its admin settings (no secrets).
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/AdminSource" } }
        "403": { $ref: "#/components/responses/Error" }
  /admin/sources/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, pattern: "^[a-z0-9:_-]{1,64}$" } }
    get:
      tags: [admin]
      operationId: adminGetSource
      responses:
        "200": { description: Source., content: { application/json: { schema: { $ref: "#/components/schemas/AdminSource" } } } }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    patch:
      tags: [admin]
      operationId: adminUpdateSource
      description: |
        Enable/disable a source for everyone, override its base URL, or set
        credentials. Credentials are write-only (stored encrypted, never
        returned; `has_credentials` tells whether some are set). Audited as
        `sources.updated` (without values).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                enabled: { type: boolean }
                base_url: { type: string, maxLength: 512, description: "http(s) URL without credentials; empty string = default (env)." }
                credentials:
                  type: object
                  maxProperties: 10
                  additionalProperties: { type: string, maxLength: 4096 }
                  description: "Replaces stored credentials (e.g. {\"apikey\": \"…\"} for Jacred); {} clears them; omit to keep."
      responses:
        "200": { description: Updated source., content: { application/json: { schema: { $ref: "#/components/schemas/AdminSource" } } } }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /admin/sources/{id}/probe:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, pattern: "^[a-z0-9:_-]{1,64}$" } }
    post:
      tags: [admin]
      operationId: adminProbeSource
      description: Runs the source's health check now (otherwise every 30 min, plus live error counting).
      responses:
        "200": { description: Source with fresh health., content: { application/json: { schema: { $ref: "#/components/schemas/AdminSource" } } } }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  # ---------------------------------------------------------------- watch sync, lists, settings (Phase 5)
  /profiles/{id}/settings:
    parameters:
      - $ref: "#/components/parameters/Id"
      - name: device_class
        in: query
        description: |
          Browsers name their class (DeviceClass: desktop = «Компьютер», mobile
          = «Телефон»): GET answers base → that class's layer, PUT stores the
          layered keys (TvSettings.layered_keys: look, autoplay, skip…) in that
          layer and the rest in the profile base. A paired TV is always layered
          per its own device id (the parameter is ignored). Without it (API
          tokens, old clients) everything is the profile base. Other values → 422.
        schema: { $ref: "#/components/schemas/DeviceClass" }
    get:
      tags: [profiles]
      operationId: getProfileSettings
      responses:
        "200": { description: Settings (defaults filled in)., content: { application/json: { schema: { $ref: "#/components/schemas/ProfileSettings" } } } }
        "404": { $ref: "#/components/responses/Error" }
    put:
      tags: [profiles]
      operationId: putProfileSettings
      description: Partial updates allowed (omitted fields keep their value). TV devices may update settings of profiles they can use (their layered keys go to that TV's layer). The answer is the caller's effective settings (see device_class).
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/ProfileSettings" } } } }
      responses:
        "200": { description: Saved settings., content: { application/json: { schema: { $ref: "#/components/schemas/ProfileSettings" } } } }
        "422": { $ref: "#/components/responses/Error" }
  /playback/sessions:
    post:
      tags: [watch]
      operationId: startPlaybackSession
      description: |
        Called by the player when playback starts. Returns where to resume.
        Opening a title is NOT watching: history/progress is only written once
        progress reports arrive with a meaningful position (>= 30 s).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [profile_id, media_id]
              properties:
                profile_id: { type: string, format: uuid }
                media_id: { type: string, format: uuid }
                episode_id: { type: string, format: uuid }
                source_id: { type: string, format: uuid }
      responses:
        "201":
          description: Session.
          content:
            application/json:
              schema:
                type: object
                required: [id, resume_position_seconds, progress, report_token]
                properties:
                  id: { type: string, format: uuid }
                  report_token: { type: string, description: "Session-bound token (24 h) for progress reports sent with navigator.sendBeacon: POST /playback/sessions/{id}/progress?token=… (text/plain body, no other auth)." }
                  resume_position_seconds: { type: [number, "null"], description: "Where to resume (null = start; also null when the item was completed)." }
                  progress: { oneOf: [{ $ref: "#/components/schemas/WatchProgress" }, { type: "null" }] }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /playback/sessions/{id}/progress:
    parameters:
      - { $ref: "#/components/parameters/Id" }
      - { name: token, in: query, description: "report_token from session start (for sendBeacon without headers/cookies).", schema: { type: string } }
    post:
      tags: [watch]
      operationId: reportProgress
      description: |
        Periodic (~15 s) and on pause/seek/end/stop/page-hide. `seq` must
        increase per session; older/duplicate reports and reports from a stale
        session (a newer session for the same profile+item exists on another
        device) are ignored (`accepted:false`). Sendable via navigator.sendBeacon
        (text/plain JSON body accepted).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [seq, position_seconds, state]
              properties:
                seq: { type: integer, minimum: 0 }
                position_seconds: { type: number, minimum: 0 }
                duration_seconds: { type: [number, "null"], minimum: 0 }
                state: { type: string, enum: [playing, paused, seeking, ended, stopped] }
      responses:
        "200":
          description: Result.
          content:
            application/json:
              schema:
                type: object
                required: [accepted, progress]
                properties:
                  accepted: { type: boolean }
                  reason: { type: string, enum: [stale_sequence, stale_session, too_early, position_reset], description: "position_reset: a spot near the start after the session had played past the opening, without a seek (the engine restarted the stream) — the saved resume point stays." }
                  progress: { oneOf: [{ $ref: "#/components/schemas/WatchProgress" }, { type: "null" }] }
        "404": { $ref: "#/components/responses/Error" }
  /profiles/{id}/continue-watching:
    parameters: [{ $ref: "#/components/parameters/Id" }, { $ref: "#/components/parameters/Lang" }]
    get:
      tags: [watch]
      operationId: continueWatching
      description: In-progress movies/episodes and series with a next unwatched episode, most recent first (max 30).
      responses:
        "200":
          description: Items.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/ContinueItem" } }
  /profiles/{id}/new-episodes:
    parameters: [{ $ref: "#/components/parameters/Id" }, { $ref: "#/components/parameters/Lang" }]
    get:
      tags: [watch]
      operationId: newEpisodes
      description: |
        «Новые серии»: episodes of the profile's series (episode progress in the last year, watchlist or favorites,
        or rated on Kinopoisk and imported — those only while ongoing, and only episodes after the import)
        that aired after what the profile watched, found by the nightly check. Unseen first (newest first), then
        seen ones that aired in the last 30 days (max 100). Watching the episode or a later one counts as seen.
      responses:
        "200":
          description: List.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NewEpisodeList" }
        "404": { $ref: "#/components/responses/Error" }
  /profiles/{id}/new-episodes/seen:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    post:
      tags: [watch]
      operationId: markNewEpisodesSeen
      description: Marks the given new episodes (or all) seen/hidden.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                episode_ids: { type: array, maxItems: 200, items: { type: string, format: uuid } }
                all: { type: boolean }
      responses:
        "204": { description: Done. }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /profiles/{id}/history:
    parameters: [{ $ref: "#/components/parameters/Id" }, { $ref: "#/components/parameters/Lang" }]
    get:
      tags: [watch]
      operationId: watchHistory
      parameters:
        - { name: cursor, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 30 } }
      responses:
        "200":
          description: Newest first.
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/HistoryItem" } }
                  next_cursor: { type: [string, "null"] }
  /profiles/{id}/tickets:
    parameters: [{ $ref: "#/components/parameters/Id" }, { $ref: "#/components/parameters/Lang" }]
    get:
      tags: [watch]
      operationId: profileTickets
      description: >-
        Ticket stubs, newest (highest number) first. Missing stubs for finished films are issued on read.
        The profile's own account (or its TV) and admins only.
      parameters:
        - { name: cursor, in: query, schema: { type: string }, description: next_cursor of the previous page. }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 24 } }
      responses:
        "200": { description: A page of stubs., content: { application/json: { schema: { $ref: "#/components/schemas/TicketPage" } } } }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /profiles/{id}/achievements:
    parameters: [{ $ref: "#/components/parameters/Id" }, { $ref: "#/components/parameters/Lang" }]
    get:
      tags: [watch]
      operationId: profileAchievements
      description: >-
        Unlocked stickers (silent: no events or notifications), recorded on read from the watch history,
        plus the progress of the next locked counter goals («37 / 50 films»); the rest stay secret.
        The profile's own account (or its TV) and admins only.
      responses:
        "200": { description: Unlocked stickers., content: { application/json: { schema: { $ref: "#/components/schemas/AchievementList" } } } }
        "404": { $ref: "#/components/responses/Error" }
  /media/{id}/progress:
    parameters: [{ $ref: "#/components/parameters/Id" }, { $ref: "#/components/parameters/Lang" }]
    get:
      tags: [watch]
      operationId: mediaProgress
      parameters: [{ name: profile_id, in: query, required: true, schema: { type: string, format: uuid } }]
      responses:
        "200": { description: Progress., content: { application/json: { schema: { $ref: "#/components/schemas/MediaProgress" } } } }
        "404": { $ref: "#/components/responses/Error" }
  /media/{id}/watched:
    parameters: [{ $ref: "#/components/parameters/Id" }, { $ref: "#/components/parameters/Lang" }]
    put:
      tags: [watch]
      operationId: setWatched
      description: Manual watched/unwatched override for a movie, an episode, or a whole season.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [profile_id, watched]
              properties:
                profile_id: { type: string, format: uuid }
                watched: { type: boolean }
                episode_id: { type: string, format: uuid }
                season_number: { type: integer, minimum: 0, description: "Series: apply to every aired episode of this season." }
      responses:
        "200": { description: Updated progress., content: { application/json: { schema: { $ref: "#/components/schemas/MediaProgress" } } } }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /profiles/{id}/lists/{list}:
    parameters:
      - { $ref: "#/components/parameters/Id" }
      - { name: list, in: path, required: true, schema: { type: string, enum: [watchlist, favorites] } }
      - { $ref: "#/components/parameters/Lang" }
    get:
      tags: [lists]
      operationId: getProfileList
      parameters: [{ $ref: "#/components/parameters/Page" }]
      responses:
        "200": { description: Newest first., content: { application/json: { schema: { $ref: "#/components/schemas/MediaPage" } } } }
  /profiles/{id}/lists/{list}/{mediaId}:
    parameters:
      - { $ref: "#/components/parameters/Id" }
      - { name: list, in: path, required: true, schema: { type: string, enum: [watchlist, favorites] } }
      - { name: mediaId, in: path, required: true, schema: { type: string, format: uuid } }
    put:
      tags: [lists]
      operationId: addToProfileList
      responses:
        "204": { description: Added (idempotent). }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      tags: [lists]
      operationId: removeFromProfileList
      responses:
        "204": { description: Removed (idempotent). }
  /profiles/{id}/ratings/{mediaId}:
    parameters:
      - { $ref: "#/components/parameters/Id" }
      - { name: mediaId, in: path, required: true, schema: { type: string, format: uuid } }
    put:
      tags: [lists]
      operationId: rateMedia
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rating]
              properties:
                rating: { type: integer, minimum: 1, maximum: 10 }
      responses:
        "204": { description: Saved. }
        "422": { $ref: "#/components/responses/Error" }
    delete:
      tags: [lists]
      operationId: unrateMedia
      responses:
        "204": { description: Removed. }

  # ---------------------------------------------------------------- rating imports (Kinopoisk CSV)
  /profiles/{id}/imports/kinopoisk:
    parameters:
      - { $ref: "#/components/parameters/Id" }
    post:
      tags: [lists]
      operationId: startKinopoiskImport
      description: >-
        Imports a Kinopoisk ratings export (CSV, UTF-8, max 5 MB) into the profile in the background.
        Only the profile's owner may import (404 otherwise; TV devices 403). One queued/running job per
        profile (409 import_in_progress). Switches may be form fields or query parameters.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary, description: "kp_id,type,title_ru,title_original,year,my_rating,kp_rating,kp_votes,duration_min,date_rated,url" }
                overwrite: { type: boolean, default: false, description: "Replace ratings already set in Cineko (default: keep them, counted as skipped)." }
                mark_watched: { type: boolean, default: true, description: "Mark matched titles watched (completed, dated when rated; never in continue watching)." }
                dry_run: { type: boolean, default: false, description: "Match only; write nothing." }
      responses:
        "202":
          description: Job created.
          content:
            application/json:
              schema:
                type: object
                required: [job_id]
                properties:
                  job_id: { type: string, format: uuid }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
    get:
      tags: [lists]
      operationId: latestKinopoiskImport
      description: The profile's most recent import job (404 when none). Owner only.
      responses:
        "200":
          description: Job.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImportJob" }
        "404": { $ref: "#/components/responses/Error" }
  /imports/{jobId}:
    parameters:
      - { name: jobId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [lists]
      operationId: getImportJob
      description: Progress of one of the caller's import jobs (404 for anyone else's).
      responses:
        "200":
          description: Job.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImportJob" }
        "404": { $ref: "#/components/responses/Error" }

  # ---------------------------------------------------------------- admin activity & messages (Phase 5)
  /admin/activity/now:
    get:
      tags: [admin]
      operationId: adminActivityNow
      description: Who is watching what right now (live TV states + active playback sessions). Admin only.
      parameters: [{ $ref: "#/components/parameters/Lang" }]
      responses:
        "200":
          description: Active playback, newest first.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/ActivityItem" } }
  /admin/users/{id}/history:
    parameters: [{ $ref: "#/components/parameters/Id" }, { $ref: "#/components/parameters/Lang" }]
    get:
      tags: [admin]
      operationId: adminUserHistory
      description: Watch history across all of a user's profiles. Admin only.
      parameters:
        - { name: cursor, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 30 } }
      responses:
        "200":
          description: Newest first.
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/AdminHistoryItem" } }
                  next_cursor: { type: [string, "null"] }
  /admin/messages:
    get:
      tags: [admin]
      operationId: adminListMessages
      description: Messages the admins have sent (newest first) with read counts.
      responses:
        "200":
          description: Sent messages.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/SentMessage" } }
    post:
      tags: [admin]
      operationId: adminSendMessage
      description: |
        Send a message to all users or selected users. Delivered live over the
        realtime socket (`message` event to the users' browsers and TVs when
        `show_on_tv`) and stored in each recipient's inbox.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, body]
              properties:
                title: { type: string, minLength: 1, maxLength: 80 }
                body: { type: string, minLength: 1, maxLength: 1000 }
                user_ids: { type: array, items: { type: string, format: uuid }, description: "Omit or empty = everyone (except the sender)." }
                show_on_tv: { type: boolean, default: true }
      responses:
        "201": { description: Sent., content: { application/json: { schema: { $ref: "#/components/schemas/SentMessage" } } } }
        "422": { $ref: "#/components/responses/Error" }
  # ---------------------------------------------------------------- admin system (server load)
  /admin/system:
    get:
      tags: [admin]
      operationId: adminSystemStatus
      description: |
        Server load for the admin Server tab. Host numbers come from the
        martytv-hostmon service on the host (unix socket `HOSTMON_SOCKET`);
        without it (`hostmon: unavailable`) they are the API container's own
        view (`scope: container`). App metrics are always the API's. Admin only.
      responses:
        "200": { description: Current snapshot., content: { application/json: { schema: { $ref: "#/components/schemas/SystemStatus" } } } }
  /admin/system/history:
    get:
      tags: [admin]
      operationId: adminSystemHistory
      description: 10-second samples kept in memory for one hour (by hostmon, or by the API in the fallback). Admin only.
      parameters:
        - { name: minutes, in: query, schema: { type: integer, minimum: 1, maximum: 60, default: 60 } }
      responses:
        "200": { description: Samples, oldest first., content: { application/json: { schema: { $ref: "#/components/schemas/SystemHistory" } } } }
  /messages:
    get:
      tags: [messages]
      operationId: listMyMessages
      description: "The caller's inbox. For a TV credential, the device owner's messages that have show_on_tv."
      responses:
        "200":
          description: Newest first (max 100).
          content:
            application/json:
              schema:
                type: object
                required: [items, unread]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Message" } }
                  unread: { type: integer }
  /messages/{id}/read:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    post:
      tags: [messages]
      operationId: markMessageRead
      responses:
        "204": { description: Marked read. }
        "404": { $ref: "#/components/responses/Error" }

  # ---------------------------------------------------------------- service status (TV status line)
  /speedtest:
    get:
      tags: [system]
      operationId: speedtest
      description: "Connection speed test (TV + PWA background measurement of the device → server link): streams `bytes` incompressible random bytes, never cached nor compressed. Any signed-in reader; rate-limited per user / TV (30 per 10 min) and to a few concurrent tests."
      parameters:
        - { name: bytes, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 26214400, default: 1048576 } }
      responses:
        "200": { description: Random bytes., content: { application/octet-stream: { schema: { type: string, format: binary } } } }
        "401": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /status:
    get:
      tags: [system]
      operationId: serviceStatus
      description: "Backend health for any signed-in reader (TV status corner / ticker). Cached ~15 s; no versions or errors."
      responses:
        "200":
          description: Current status.
          content:
            application/json:
              schema:
                type: object
                required: [torrserver, prowlarr, active_streams, server_time, seasonal_effects, cpu_percent]
                properties:
                  torrserver:
                    type: object
                    required: [ok, latency_ms]
                    properties:
                      ok: { type: boolean }
                      latency_ms: { type: [integer, "null"], description: "Round trip of TorrServer /echo; null when down." }
                  prowlarr:
                    type: object
                    description: "The torrent search backend (Prowlarr, or Jackett when INDEXER=jackett)."
                    required: [ok]
                    properties:
                      ok: { type: boolean }
                  active_streams: { type: integer, description: "Streams proxied right now (all users)." }
                  server_time: { type: string, format: date-time }
                  seasonal_effects: { type: boolean, description: "Admin switch of the holiday animations (PUT /admin/appearance); false = off for everyone." }
                  cpu_percent: { type: [number, "null"], description: "Server CPU use right now, % of all cores (latest 10 s sample); null until the first sample. The TV player's stats panel shows it." }
                  features:
                    type: object
                    description: "Parts this server has (install.sh options). Clients hide what's off: no «Видео» tab without video, no Cineko Music links without music. Absent on older servers = everything on."
                    required: [video, music, torrents]
                    properties:
                      video: { type: boolean, description: "YouTube «Видео» (VIDEO_ENABLED and an Invidious URL)." }
                      music: { type: boolean, description: "Cineko Music is installed (MUSIC_ENABLED)." }
                      torrents: { type: boolean, description: "A torrent search backend is configured (INDEXER prowlarr or jackett)." }
        "401": { $ref: "#/components/responses/Error" }

  # ---------------------------------------------------------------- recommendations between people («Посоветовать», Phase 6 early)
  /recommendations:
    post:
      tags: [recommendations]
      operationId: recommend
      description: "«Посоветовать»: recommend a title to other household users with an optional note. Recipients get a realtime `recommendation` event."
      parameters: [{ $ref: "#/components/parameters/Lang" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [media_id, to_user_ids]
              properties:
                media_id: { type: string, format: uuid }
                to_user_ids: { type: array, minItems: 1, maxItems: 20, items: { type: string, format: uuid } }
                note: { type: string, maxLength: 500 }
                from_profile_id: { type: string, format: uuid, description: "Which of the sender's profiles recommends (shown as avatar/colour)." }
      responses:
        "201":
          description: Sent.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Recommendation" } }
        "422": { $ref: "#/components/responses/Error" }
  /recommendations/inbox:
    get:
      tags: [recommendations]
      operationId: recommendationsInbox
      description: "«Вам посоветовали»: recommendations received by the caller (for a TV credential: its owner's), newest first."
      parameters: [{ $ref: "#/components/parameters/Lang" }, { $ref: "#/components/parameters/ProfileId" }]
      responses:
        "200":
          description: Inbox.
          content:
            application/json:
              schema:
                type: object
                required: [items, unseen]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Recommendation" } }
                  unseen: { type: integer }
  /recommendations/sent:
    get:
      tags: [recommendations]
      operationId: recommendationsSent
      parameters: [{ $ref: "#/components/parameters/Lang" }]
      responses:
        "200":
          description: Sent by the caller, with recipients' reactions.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Recommendation" } }
  /recommendations/{id}:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    patch:
      tags: [recommendations]
      operationId: updateRecommendation
      description: Recipient marks it seen and/or reacts (the sender sees the reaction).
      parameters: [{ $ref: "#/components/parameters/Lang" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                seen: { type: boolean }
                reaction: { type: [string, "null"], enum: [like, dislike, watched, null] }
                reply: { type: [string, "null"], maxLength: 300 }
      responses:
        "200": { description: Updated., content: { application/json: { schema: { $ref: "#/components/schemas/Recommendation" } } } }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      tags: [recommendations]
      operationId: deleteRecommendation
      description: Recipient dismisses it (or sender withdraws it).
      responses:
        "204": { description: Removed. }

  # ---------------------------------------------------------------- client-errors (client error logging)
  /client-errors:
    post:
      tags: [client-errors]
      operationId: reportClientErrors
      description: |
        Report a batch of client errors (web PWA or TV app). Any signed-in
        session, paired TV or API token with `read`. Secrets (tokens, stream
        tokens, emails, magnet links, credential query params) are scrubbed
        before storage. Rate limited per user/device and globally; over the
        limit events are dropped silently and the response is still 202 so
        clients never retry. The body may be sent as `text/plain` (sendBeacon).
        Cookie sessions sending with sendBeacon cannot add `X-CSRF-Token`, so
        this endpoint only checks the Origin for them.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [events]
              properties:
                events: { type: array, minItems: 1, maxItems: 20, items: { $ref: "#/components/schemas/ClientErrorEvent" } }
      responses:
        "202":
          description: Accepted (possibly dropped by rate limits).
          content:
            application/json:
              schema:
                type: object
                required: [accepted]
                properties:
                  accepted: { type: integer, description: Events stored. }
        "401": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /admin/client-errors:
    get:
      tags: [client-errors]
      operationId: adminListClientErrors
      description: Error groups (web, tv and the API's own 5xx). Admin only.
      parameters:
        - { name: app, in: query, schema: { $ref: "#/components/schemas/ClientErrorApp" } }
        - { name: kind, in: query, schema: { $ref: "#/components/schemas/ClientErrorKind" } }
        - { name: status, in: query, schema: { type: string, enum: [unresolved, resolved, all], default: unresolved } }
        - { name: since, in: query, description: Only groups seen at or after this time., schema: { type: string, format: date-time } }
        - name: user_id
          in: query
          description: |
            Only groups this user hit (a paired TV's errors count for its owner).
            `count`, `first_seen`, `last_seen` (also for `since` and `sort`) are
            then the user's own; `users_affected` is 1 and `devices_affected`
            counts the user's TVs.
          schema: { type: string, format: uuid }
        - { name: device_id, in: query, schema: { type: string, format: uuid } }
        - { name: q, in: query, description: Substring of the message, component or top frame., schema: { type: string, maxLength: 200 } }
        - { name: sort, in: query, schema: { type: string, enum: [last_seen, count], default: last_seen } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
      responses:
        "200":
          description: Groups matching the filters.
          content:
            application/json:
              schema:
                type: object
                required: [items, total]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/ClientErrorGroup" } }
                  total: { type: integer }
  /admin/client-errors/users:
    get:
      tags: [client-errors]
      operationId: adminListClientErrorUsers
      description: Accounts that hit at least one stored group (the user filter), by name. Admin only.
      responses:
        "200":
          description: Users.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/ClientErrorUser" } }
  /admin/client-errors/{id}:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      tags: [client-errors]
      operationId: adminGetClientError
      description: One group with its most recent samples (up to 20, newest first). Admin only.
      parameters:
        - { name: user_id, in: query, description: "The group as this user saw it (see the list's `user_id`) and only their samples; 404 if they never hit it.", schema: { type: string, format: uuid } }
      responses:
        "200": { description: The group., content: { application/json: { schema: { $ref: "#/components/schemas/ClientErrorDetail" } } } }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
    patch:
      tags: [client-errors]
      operationId: adminUpdateClientError
      description: Resolve or reopen a group. A resolved group that recurs reopens by itself and is marked `regressed`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [resolved]
              properties:
                resolved: { type: boolean }
      responses:
        "200": { description: Updated., content: { application/json: { schema: { $ref: "#/components/schemas/ClientErrorGroup" } } } }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      tags: [client-errors]
      operationId: adminDeleteClientError
      description: Delete a group and its samples.
      responses:
        "204": { description: Deleted. }
        "404": { $ref: "#/components/responses/Error" }
  # ---------------------------------------------------------------- end client-errors

  # ---- foryou (Phase 6)
  # Personal recommendations («Для вас»), Surprise Me («Удиви меня!»), Explore
  # («Обзор»), AI collections (подборки), Diary and Taste DNA, admin rerun.
  # Not to be confused with /recommendations (people recommending titles to
  # each other). See docs/architecture.md "Recommendations (Phase 6)".
  /foryou/rows:
    get:
      tags: [foryou]
      operationId: forYouRows
      description: |
        «Для вас»: ordered rows of personal recommendations for a profile.
        Rows are computed by the daily run and cached per profile (24 h); a
        missing/expired cache is computed on the fly (a few seconds at most).
        Titles the profile rated, completed or dismissed since the cache was
        built are filtered out at read time; after new signals the rows are
        rebuilt in the background and a realtime `foryou.updated` event
        follows. Every item carries a typed, localized `reason`. Items are
        unique across rows. Paired TVs may read profiles they can use.
      parameters: [{ name: profile_id, in: query, required: true, description: "A profile the caller may use (404 otherwise).", schema: { type: string, format: uuid } }, { $ref: "#/components/parameters/Lang" }]
      responses:
        "200": { description: Rows., content: { application/json: { schema: { $ref: "#/components/schemas/ForYouRows" } } } }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /foryou/feedback:
    post:
      tags: [foryou]
      operationId: forYouFeedback
      description: |
        Record what the profile did with recommended titles, for evaluation
        and ranking: `impression` (shown; batch them, e.g. once per row when
        it scrolls into view), `open` (details opened), `play`, `complete`,
        `dismiss` («Не интересно»: hidden from every row, Surprise and
        collections at once, and used as a negative taste signal) and
        `undismiss`. Send either one event (`media_id`, `action`, `row_id`)
        or a batch in `events` (≤ 100). Unknown media ids are skipped.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [profile_id]
              properties:
                profile_id: { type: string, format: uuid }
                media_id: { type: string, format: uuid }
                action: { $ref: "#/components/schemas/ForYouFeedbackAction" }
                row_id: { type: string, maxLength: 80, description: "ForYouRow.id (or a surface like `surprise`, `collection:<id>`, `explore`, `channel`)." }
                events: { type: array, maxItems: 100, items: { $ref: "#/components/schemas/ForYouFeedbackEvent" } }
      responses:
        "202":
          description: Recorded.
          content:
            application/json:
              schema:
                type: object
                required: [accepted]
                properties:
                  accepted: { type: integer }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /foryou/surprise/options:
    get:
      tags: [foryou]
      operationId: forYouSurpriseOptions
      description: Moods (localized) and decades for the «Удиви меня!» form.
      parameters: [{ $ref: "#/components/parameters/Lang" }]
      responses:
        "200":
          description: Options.
          content:
            application/json:
              schema:
                type: object
                required: [moods, decades]
                properties:
                  moods: { type: array, items: { $ref: "#/components/schemas/ForYouMoodOption" } }
                  decades: { type: array, items: { type: integer }, description: "e.g. 1950 … 2020" }
  /foryou/surprise:
    post:
      tags: [foryou]
      operationId: forYouSurprise
      description: |
        «Удиви меня!»: one weighted-random pick from the profile's scored
        recommendation pool after the filters (higher score = more likely).
        When nothing in the pool fits, TMDB discover with the same filters is
        used (`source: discover`). Re-roll by sending the returned
        `reroll.exclude_ids` back as `exclude_ids`. `media` is null when
        nothing matches at all. Spoiler-free display is up to the client.
      parameters: [{ $ref: "#/components/parameters/Lang" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SurpriseRequest" }
      responses:
        "200": { description: The pick., content: { application/json: { schema: { $ref: "#/components/schemas/SurpriseResult" } } } }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /foryou/explore:
    get:
      tags: [foryou]
      operationId: forYouExplore
      description: |
        «Обзор»: data-driven sections of tiles (moods, decades, countries and
        languages, best by genre, curated TMDB keyword collections, AI
        collections). Ordering follows the profile's taste where it has one.
        Every tile opens with `GET /foryou/browse?tile=<tile.id>`; tiles that
        map onto `/catalog/discover` also carry those params in `discover`.
      parameters: [{ name: profile_id, in: query, required: true, description: "A profile the caller may use (404 otherwise).", schema: { type: string, format: uuid } }, { $ref: "#/components/parameters/Lang" }]
      responses:
        "200":
          description: Sections.
          content:
            application/json:
              schema:
                type: object
                required: [sections]
                properties:
                  sections: { type: array, items: { $ref: "#/components/schemas/ExploreSection" } }
        "404": { $ref: "#/components/responses/Error" }
  /foryou/browse:
    get:
      tags: [foryou]
      operationId: forYouBrowse
      description: |
        Titles of one Explore tile. The profile's hide_anime and hide_watched
        settings apply and items carry `me`. Collections return all their
        items on page 1.
      parameters:
        - { name: tile, in: query, required: true, description: "ExploreTile.id, e.g. mood:cozy, decade:1980, lang:ko, genre:18, kw:4379, collection:<uuid>, curated:<list id> (the resolved items of a curated list).", schema: { type: string, maxLength: 80 } }
        - { name: kind, in: query, schema: { $ref: "#/components/schemas/MediaKind" } }
        - { name: profile_id, in: query, required: true, description: "A profile the caller may use (404 otherwise).", schema: { type: string, format: uuid } }
        - { $ref: "#/components/parameters/Lang" }
        - { $ref: "#/components/parameters/Page" }
      responses:
        "200": { description: One page., content: { application/json: { schema: { $ref: "#/components/schemas/ForYouBrowsePage" } } } }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "502": { $ref: "#/components/responses/CatalogUnavailable" }
        "503": { $ref: "#/components/responses/CatalogUnavailable" }
  /foryou/collections:
    get:
      tags: [foryou]
      operationId: forYouCollections
      description: |
        AI collections (подборки) for the profile: its latest personal batch
        (3–5) plus the latest global ones (2–3), newest first. Generated
        daily; kept 7 days. Empty with `ai_enabled: false` when no AI key is
        configured.
      parameters: [{ name: profile_id, in: query, required: true, description: "A profile the caller may use (404 otherwise).", schema: { type: string, format: uuid } }, { $ref: "#/components/parameters/Lang" }]
      responses:
        "200":
          description: Collections.
          content:
            application/json:
              schema:
                type: object
                required: [items, ai_enabled]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/ForYouCollection" } }
                  ai_enabled: { type: boolean }
        "404": { $ref: "#/components/responses/Error" }
  /foryou/collections/{id}:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      tags: [foryou]
      operationId: forYouCollection
      description: One collection (global, or personal to a profile the caller may use).
      parameters: [{ name: profile_id, in: query, required: true, description: "A profile the caller may use (404 otherwise).", schema: { type: string, format: uuid } }, { $ref: "#/components/parameters/Lang" }]
      responses:
        "200": { description: The collection., content: { application/json: { schema: { $ref: "#/components/schemas/ForYouCollection" } } } }
        "404": { $ref: "#/components/responses/Error" }
  /curated:
    get:
      tags: [foryou]
      operationId: listCurated
      description: |
        «Подборки»: curated film lists from books, directors' lists, polls and
        the Russian/Soviet canon (internal/curated, embedded JSON files).
        Grouped by `group` in a fixed order (thinkers, directors, polls, modern, ru).
        With `profile_id`, `watched` counts the profile's finished or rated
        titles in each list (0 without).
      parameters: [{ name: profile_id, in: query, description: "A profile the caller may use (404 otherwise).", schema: { type: string, format: uuid } }, { $ref: "#/components/parameters/Lang" }]
      responses:
        "200":
          description: The lists by group.
          content:
            application/json:
              schema:
                type: object
                required: [groups]
                properties:
                  groups: { type: array, items: { $ref: "#/components/schemas/CuratedGroup" } }
        "404": { $ref: "#/components/responses/Error" }
  /curated/{list_id}:
    parameters: [{ name: list_id, in: path, required: true, schema: { type: string, pattern: "^[a-z0-9-]{1,64}$" } }]
    get:
      tags: [foryou]
      operationId: getCurated
      description: |
        One curated list with all its items in list order (`rank` = position
        for ranked lists). Items not (yet) found in the catalog come with
        `media: null` («нет в каталоге»).
      parameters: [{ name: profile_id, in: query, description: "A profile the caller may use (404 otherwise); adds `me` and `watched`.", schema: { type: string, format: uuid } }, { $ref: "#/components/parameters/Lang" }]
      responses:
        "200": { description: The list., content: { application/json: { schema: { $ref: "#/components/schemas/CuratedList" } } } }
        "404": { $ref: "#/components/responses/Error" }
  /profiles/{id}/channel:
    get:
      tags: [foryou]
      operationId: getChannel
      description: |
        «Cineko TV»: a programme for the lean-back channel, built on request
        (the TV calls it when the viewer tunes in; nothing is computed ahead).
        Films from the profile's «Для вас» pool by score (with a little
        randomness), never rated, started, finished or dismissed ones, anime
        hidden when the profile hides it, and films whose recent torrent search
        found nothing (with no online variant) left out; plus the next episode
        of series in progress (at most a third of the slots, never two in a
        row). Consecutive picks alternate genres. Runtimes are estimates when
        `runtime_known` is false; the TV builds the clock from them. Plays
        started on the channel are reported as feedback with `row_id: "channel"`.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: count, in: query, schema: { type: integer, minimum: 1, maximum: 20, default: 8 } }
        - { name: exclude, in: query, description: "Comma-separated media ids already on the programme (≤ 200).", schema: { type: string } }
        - { $ref: "#/components/parameters/Lang" }
      responses:
        "200":
          description: The programme, in order.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChannelProgramme" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /profiles/{id}/notes:
    get:
      tags: [foryou]
      operationId: listMediaNotes
      description: "«Мои заметки»: the profile's notes, newest first, 30 per page. The profile's account and its TVs only (404 otherwise)."
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: cursor, in: query, schema: { type: string } }
        - { $ref: "#/components/parameters/Lang" }
      responses:
        "200":
          description: Notes.
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/MediaNoteItem" } }
                  next_cursor: { type: [string, "null"] }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /profiles/{id}/family:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      tags: [foryou]
      operationId: getFamily
      description: |
        «Семья советует»: titles that other profiles on this server liked and
        this profile has not seen, ranked by taste similarity. Only profiles
        that opted in (`share_with_family`, default off) contribute, and only
        their ratings, finished titles and favorites — never in-progress
        positions, the watchlist or notes; no admin override. Excludes what
        this profile rated, started, finished or dismissed («Не интересно»),
        and anime when it hides anime. Score per title = Σ over sharers of
        weight(similarity) × signal (★8+ / favorite / finished in the last
        6 months; low ratings count against), faded by age, plus a bonus per
        extra member who liked it. Similarity blends rating agreement on
        co-rated titles (Pearson + closeness) with the cosine of genre
        affinities (taste, quiz), shown as `match`. `enabled` is false (and
        nothing is returned) when the profile turned `show_family` off. The
        same row is embedded in GET /foryou/rows (kind `family`). The
        profile's account and its TVs (others 404).
      parameters:
        - { $ref: "#/components/parameters/Lang" }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
      responses:
        "200": { description: The family block., content: { application/json: { schema: { $ref: "#/components/schemas/FamilyBlock" } } } }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /profiles/{id}/family/media/{mediaId}:
    get:
      tags: [foryou]
      operationId: getMediaFamily
      description: |
        «Оценки семьи» for a title page: what sharing profiles did with it
        (rating, finished, favorite), members who liked it first. Empty when
        nobody shares or the profile turned `show_family` off.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: mediaId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: Family members' activity on the title., content: { application/json: { schema: { $ref: "#/components/schemas/MediaFamily" } } } }
        "404": { $ref: "#/components/responses/Error" }
  /profiles/{id}/notes/{mediaId}:
    put:
      tags: [foryou]
      operationId: putMediaNote
      description: |
        Save the profile's private note on a title (replaces it). Empty text
        and no reasons deletes it (204). Notes reach the AI prompts as the
        viewer's own reactions (next run; no regeneration) and dislike
        reasons feed the taste. The profile's account and its TVs only.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: mediaId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MediaNoteInput" }
      responses:
        "200":
          description: Saved.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MediaNoteSaved" }
        "204": { description: Deleted. }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /profiles/{id}/diary:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      tags: [foryou]
      operationId: profileDiary
      description: |
        Movie diary: a calendar of what the profile completed, rated and
        rewatched in one month (dates in Moscow time, UTC+3) plus that
        month's stats. Owner only: other accounts get 404, TV credentials 403.
      parameters:
        - { name: month, in: query, description: "YYYY-MM; defaults to the current month (Moscow time).", schema: { type: string, pattern: "^[0-9]{4}-(0[1-9]|1[0-2])$" } }
        - { $ref: "#/components/parameters/Lang" }
      responses:
        "200": { description: The month., content: { application/json: { schema: { $ref: "#/components/schemas/Diary" } } } }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /profiles/{id}/taste:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      tags: [foryou]
      operationId: profileTaste
      description: |
        Taste DNA: the profile's aggregated affinities computed from its real
        ratings and viewing (no AI). Scores are −1…1 (negative = dislikes).
        Owner only (other accounts 404, TV credentials 403).
      parameters: [{ $ref: "#/components/parameters/Lang" }]
      responses:
        "200": { description: Taste., content: { application/json: { schema: { $ref: "#/components/schemas/TasteDNA" } } } }
        "404": { $ref: "#/components/responses/Error" }
  # ---- taste quiz («Давайте определим ваш вкус») ----
  /profiles/{id}/taste-quiz:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      tags: [foryou]
      operationId: getTasteQuiz
      description: |
        The profile's taste quiz: the questions (option ids; clients hold the
        labels), the answers so far, how many titles were rated / answered,
        and whether it was completed or dismissed. The profile's account and
        its TVs.
      responses:
        "200": { description: State., content: { application/json: { schema: { $ref: "#/components/schemas/TasteQuizState" } } } }
        "404": { $ref: "#/components/responses/Error" }
  /profiles/{id}/taste-quiz/titles:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      tags: [foryou]
      operationId: getTasteQuizTitles
      description: |
        The next well-known films and series to ask about (global hits and
        classics, every decade, Soviet and Russian cinema, series, Korea,
        anime, Europe…), minus titles the profile rated, watched, dismissed,
        listed or already answered in the quiz.
      parameters:
        - { $ref: "#/components/parameters/Lang" }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 30, default: 10 } }
      responses:
        "200":
          description: Titles.
          content:
            application/json:
              schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: "#/components/schemas/MediaSummary" } } } }
        "404": { $ref: "#/components/responses/Error" }
  /profiles/{id}/taste-quiz/answers:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    post:
      tags: [foryou]
      operationId: answerTasteQuiz
      description: |
        Saves questionnaire answers (merged per question; an empty list clears
        it) and answered titles. A title's answer has its usual effect:
        `rated` → the profile's rating, `want` → watchlist, `not_interested`
        → a «Не интересно» dismissal; `unseen` is only remembered.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                questions: { type: object, additionalProperties: { type: array, items: { type: string } } }
                titles: { type: array, maxItems: 50, items: { $ref: "#/components/schemas/TasteQuizTitleAnswer" } }
      responses:
        "200": { description: State., content: { application/json: { schema: { $ref: "#/components/schemas/TasteQuizState" } } } }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /profiles/{id}/taste-quiz/finish:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    post:
      tags: [foryou]
      operationId: finishTasteQuiz
      description: |
        Marks the quiz completed, recomputes the taste (the answers nudge its
        affinities) and refreshes the recommendations: rows now, AI
        collections in the background when AI is on (`ai_regeneration`).
      parameters: [{ $ref: "#/components/parameters/Lang" }]
      responses:
        "200":
          description: Done.
          content:
            application/json:
              schema:
                type: object
                required: [state, ai_regeneration]
                properties:
                  state: { $ref: "#/components/schemas/TasteQuizState" }
                  ai_regeneration: { type: boolean }
        "404": { $ref: "#/components/responses/Error" }
  /profiles/{id}/taste-quiz/dismiss:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    post:
      tags: [foryou]
      operationId: dismissTasteQuiz
      description: Hides the quiz invitation (Home card / banner). The quiz stays available from Settings.
      responses:
        "200": { description: State., content: { application/json: { schema: { $ref: "#/components/schemas/TasteQuizState" } } } }
        "404": { $ref: "#/components/responses/Error" }
  /profiles/{id}/taste-quiz/generate:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    post:
      tags: [foryou]
      operationId: generateTasteQuiz
      description: |
        «✨ Заполнить по моим фильмам»: derives the questionnaire answers from
        the profile's history (ratings ≥ 7 like / ≤ 4 dislike, finished,
        favourites, rewatches, watchlist, abandoned, «Не интересно», notes;
        recency-weighted) — deterministic, no AI. Overwrites genres_like,
        genres_dislike, eras, origins, mood, format and intensity (a question
        with no evidence is cleared); audio and company are kept. Then
        refreshes the recommendations like finishing the quiz (without
        marking it completed). Callable again any time. Fewer than 3 rated /
        finished / favourite titles → 409 `not_enough_history`.
      parameters: [{ $ref: "#/components/parameters/Lang" }]
      responses:
        "200":
          description: Generated and saved.
          content: { application/json: { schema: { $ref: "#/components/schemas/TasteQuizGenerated" } } }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /foryou/ask:
    post:
      tags: [foryou]
      operationId: forYouAsk
      description: |
        «Спросить ИИ»: the viewer describes what they want in free text
        (3–500 characters); DeepSeek proposes titles from the profile's
        identifier-free taste summary, each resolved through TMDB. Returned:
        a short plain-text `answer`, up to 8 playable `items` (model order,
        each with a one-line `why`), 2–3 `followups` (refinements to pre-fill)
        and the tokens spent. Unresolved/ambiguous titles, dismissed ones,
        anime with hide_anime and — unless `include_watched` — completed or
        rated ones are dropped; with fewer than 3 left the model is asked
        once more for better-known titles. Requests that are not about
        choosing films/series (or try to override the rules) get
        `refused: true`, `items: []` and a short answer. Counts toward the
        daily AI token budget and a per-account daily ask limit
        (FORYOU_ASK_DAILY_PER_USER, default 30; a TV is billed to its owner):
        429 `ask_limit` / `ai_budget` with Retry-After. 503 `ai_disabled`
        without an AI key; 502 `ai_failed` when the model fails (not counted).
        With `device_id` (an owned TV; browsers/tokens only) the answer is
        also sent to that TV as the realtime event `foryou.ask`
        (payload = this response). Opening a returned title should be sent as
        feedback `open` with `row_id: "ask"`.
      parameters: [{ $ref: "#/components/parameters/Lang" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ForYouAskRequest" }
      responses:
        "200": { description: The answer (also stored in the history)., content: { application/json: { schema: { $ref: "#/components/schemas/ForYouAsk" } } } }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
        "502": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /foryou/ai-settings:
    get:
      tags: [foryou]
      operationId: forYouAISettings
      description: The admin's DeepSeek temperatures and the creativity offsets (users and TVs; Cineko Music reads its default here).
      responses:
        "200":
          description: Settings.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ForYouAISettings" }
        "401": { $ref: "#/components/responses/Error" }
  /foryou/asks:
    get:
      tags: [foryou]
      operationId: forYouAsks
      description: |
        The profile's last 20 asks, newest first, to reopen previous answers.
        Only the prompt, answer, follow-ups and the titles (id + why) are
        stored; `media` carries fresh `me`.
      parameters: [{ name: profile_id, in: query, required: true, description: "A profile the caller may use (404 otherwise).", schema: { type: string, format: uuid } }, { $ref: "#/components/parameters/Lang" }]
      responses:
        "200":
          description: History.
          content:
            application/json:
              schema:
                type: object
                required: [items, ai_enabled, daily_limit]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/ForYouAsk" } }
                  ai_enabled: { type: boolean, description: "False without an AI key (POST /foryou/ask answers 503)." }
                  daily_limit: { type: integer, description: "Asks per account per Moscow day." }
        "404": { $ref: "#/components/responses/Error" }
  /foryou/regenerate:
    get:
      tags: [foryou]
      operationId: forYouRegenStatus
      description: Whether the profile may refresh its AI collections now («Обновить подборки ИИ»).
      parameters: [{ name: profile_id, in: query, required: true, description: "A profile the caller may use (404 otherwise).", schema: { type: string, format: uuid } }]
      responses:
        "200":
          description: Status.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ForYouRegenStatus" }
        "404": { $ref: "#/components/responses/Error" }
    post:
      tags: [foryou]
      operationId: forYouRegenerate
      description: |
        «Обновить подборки ИИ»: regenerate the profile's AI collections and
        rebuild its rows in the background (the daily run's per-profile
        pipeline with AI on; recorded as a run with trigger `user`).
        `foryou.updated` (reason `collections`) follows when done. One per
        profile per Moscow day on top of the daily run (admins unlimited):
        429 `regen_limit` with `fields.next_available_at` and Retry-After.
        Counts against the daily token budget: 429 `ai_budget`. No AI key:
        503 `ai_disabled`. A regeneration already running for the profile
        is returned without counting again. A model failure gives the day's
        regeneration back.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [profile_id]
              properties:
                profile_id: { type: string, format: uuid }
      responses:
        "202":
          description: Started (status with `running` and `run_id`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ForYouRegenStatus" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /admin/foryou/rerun:
    post:
      tags: [foryou]
      operationId: adminForYouRerun
      description: |
        Start a background recommendations run now (taste → rows → AI
        collections when `ai`). Scope `all` also generates the global
        collections. One run at a time: 409 `run_in_progress` with the
        running `run_id`. Admin only; audited (`foryou.rerun`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [scope]
              properties:
                scope: { type: string, enum: [all, user, profile] }
                id: { type: string, format: uuid, description: "User id (scope user) or profile id (scope profile)." }
                ai: { type: boolean, default: true, description: "Also (re)generate AI collections (subject to the token budget)." }
      responses:
        "202":
          description: Started.
          content:
            application/json:
              schema:
                type: object
                required: [run_id]
                properties:
                  run_id: { type: string, format: uuid }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409":
          description: Another run is in progress (code run_in_progress).
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Error"
                  - type: object
                    required: [run_id]
                    properties:
                      run_id: { type: string, format: uuid }
        "422": { $ref: "#/components/responses/Error" }
  /admin/foryou/runs:
    get:
      tags: [foryou]
      operationId: adminForYouRuns
      description: Recent runs (newest first, up to 30) with progress, AI usage and errors, plus the AI budget status. Admin only.
      responses:
        "200":
          description: Runs.
          content:
            application/json:
              schema:
                type: object
                required: [items, ai, daily_at, next_run_at]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/ForYouRun" } }
                  ai: { $ref: "#/components/schemas/ForYouAIStatus" }
                  daily_at: { type: string, description: "HH:MM Moscow time of the daily run (FORYOU_DAILY_AT); \"off\" when disabled." }
                  next_run_at: { type: [string, "null"], format: date-time }
        "403": { $ref: "#/components/responses/Error" }
  /admin/foryou/ai:
    put:
      tags: [foryou]
      operationId: adminSetForYouAI
      description: Sets the DeepSeek temperatures (app_settings `ai_temperature`), the AI «Факты» switch (`ai_facts`) and the AI feature switches themes_ai, picks_ai and companion_ai (`ai_feature_themes`, `ai_feature_picks`, `ai_feature_companion`). Omitted fields keep their value; at least one is required. Admin only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                temperature:
                  type: object
                  properties:
                    collections: { type: number, minimum: 0, maximum: 1.5 }
                    ask: { type: number, minimum: 0, maximum: 1.5 }
                    music: { type: number, minimum: 0, maximum: 1.5 }
                    facts: { type: number, minimum: 0, maximum: 1.5 }
                    companion: { type: number, minimum: 0, maximum: 1.5 }
                facts_ai: { type: boolean, description: "False: «Факты» show only Kinopoisk's (stored AI ones are hidden)." }
                themes_ai: { type: boolean, description: "False: the daily run doesn't ask the model to group the scorer's candidates into theme rubrics." }
                picks_ai: { type: boolean, description: "False: no AI re-ranking of «Подобрано для вас» (stored picks still apply until they expire, 48 h)." }
                companion_ai: { type: boolean, description: "False: no «Ранее в сериале» / «После титров» (buttons hidden)." }
                learn_weights: { type: boolean, description: "False: the nightly run stops learning source weights and scoring ignores the stored ones (`ai_feature_learn_weights`; not an AI call)." }
      responses:
        "200":
          description: The new settings.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ForYouAISettings" }
        "403": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /admin/foryou/weights:
    get:
      tags: [foryou]
      operationId: adminForYouWeights
      description: Learned source weights per profile («Учить веса по просмотрам», docs/architecture.md "Learned source weights") with the share-weighted counts of the 60-day window behind them. Admin only.
      responses:
        "200":
          description: Every profile with stored weights.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ForYouWeights" }
        "403": { $ref: "#/components/responses/Error" }
  /admin/foryou/weights/{id}:
    delete:
      tags: [foryou]
      operationId: adminResetForYouWeights
      description: Forgets a profile's learned weights (back to the defaults; its rows rebuild in the background). Admin only.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204": { description: Reset. }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /admin/foryou/quality:
    get:
      tags: [foryou]
      operationId: adminForYouQuality
      description: |
        Recommendation quality per profile and for the household, from the
        profiles' own plays and ratings (read-only, cached 5 minutes): the
        shown → played (≥ 10 min) → finished → rated → liked (≥ 7) funnel,
        ratings of recommended titles vs the profile's other ratings,
        calibration by predicted score, per-source quality, precision@10 of
        «Подобрано для вас», best hits and misses. Admin only.
      parameters:
        - { name: window, in: query, schema: { type: string, enum: ["30", "90", "all"], default: "90" } }
        - { name: lang, in: query, schema: { type: string, enum: [en, ru], default: en } }
      responses:
        "200":
          description: The report.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ForYouQuality" }
        "403": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  # ---- end foryou

  # ------------------------------------------------------------ server downloads
  /downloads:
    get:
      tags: [downloads]
      operationId: listDownloads
      description: |
        Server-side full downloads (docs/architecture.md "Server downloads").
        Without `all`, the caller's downloads (those they requested). `all=true`
        (admins only, 403 otherwise) lists every download with its requesters.
      parameters:
        - { name: all, in: query, schema: { type: boolean } }
        - { name: status, in: query, schema: { $ref: "#/components/schemas/DownloadStatus" } }
        - { name: media_id, in: query, schema: { type: string, format: uuid } }
        - { name: lang, in: query, schema: { type: string, enum: [en, ru] } }
      responses:
        "200":
          description: Downloads, newest first.
          content: { application/json: { schema: { $ref: "#/components/schemas/DownloadList" } } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
    post:
      tags: [downloads]
      operationId: createDownload
      description: |
        Download the file of a ready torrent playback source (one the caller can
        use) to the server's library, so it plays from disk later. Downloads are
        shared, keyed by (info hash, file index): an existing one is reused and
        the caller is added to its requesters; a failed one is restarted.
        `season: true` also queues every other episode file of the same season
        in the torrent (season packs). Returns every affected download.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [source_id]
              properties:
                source_id: { type: string, format: uuid }
                season: { type: boolean, description: "Queue every episode file of this source's season in the torrent." }
      responses:
        "201":
          description: The created or reused downloads.
          content: { application/json: { schema: { $ref: "#/components/schemas/DownloadList" } } }
        "404": { $ref: "#/components/responses/Error" }
        "409": { description: "source_not_ready (no file selected yet).", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "422": { description: "not_a_torrent (online sources can't be downloaded).", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "503": { description: "library_unavailable (no writable library directory).", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /downloads/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [downloads]
      operationId: getDownload
      parameters:
        - { name: lang, in: query, schema: { type: string, enum: [en, ru] } }
      responses:
        "200": { description: Download., content: { application/json: { schema: { $ref: "#/components/schemas/Download" } } } }
        "404": { description: "Not found, or not one of the caller's downloads (admins see all).", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
    patch:
      tags: [downloads]
      operationId: updateDownload
      description: "Pin («Хранить дольше»: never evicted) or pause/resume. Requesters and admins."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                pinned: { type: boolean }
                paused: { type: boolean }
      responses:
        "200": { description: Updated., content: { application/json: { schema: { $ref: "#/components/schemas/Download" } } } }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
    delete:
      tags: [downloads]
      operationId: deleteDownload
      description: |
        A requester removes themselves; the file is deleted when nobody else
        requested it. Admins delete the download (and its file) outright.
      responses:
        "204": { description: Removed. }
        "404": { $ref: "#/components/responses/Error" }
  /admin/storage:
    get:
      tags: [admin]
      operationId: adminGetStorage
      responses:
        "200": { description: Disk and library usage., content: { application/json: { schema: { $ref: "#/components/schemas/StorageStatus" } } } }
        "403": { $ref: "#/components/responses/Error" }
    patch:
      tags: [admin]
      operationId: adminUpdateStorage
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/StorageSettingsUpdate" } } }
      responses:
        "200": { description: Updated status., content: { application/json: { schema: { $ref: "#/components/schemas/StorageStatus" } } } }
        "403": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /admin/torrserver/torrents:
    get:
      tags: [admin]
      operationId: adminListTorrServerTorrents
      description: |
        Every torrent in the household's TorrServer (shared with Lampa and other
        apps), with what Cineko uses it for. Read-only list (`POST /torrents
        {"action":"list"}`).
      responses:
        "200":
          description: Torrents, newest first.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/TorrServerTorrent" } }
        "403": { $ref: "#/components/responses/Error" }
        "502": { $ref: "#/components/responses/Error" }
  /admin/torrserver/torrents/{hash}:
    parameters:
      - { name: hash, in: path, required: true, schema: { type: string, pattern: "^[0-9a-f]{40}$" } }
    delete:
      tags: [admin]
      operationId: adminRemoveTorrServerTorrent
      description: |
        Removes the torrent from TorrServer (`POST /torrents {"action":"rem"}`),
        which also removes it from Lampa. Cineko re-adds it on the next playback.
        Refused with 409 `torrent_in_use` while it is streaming or a server
        download is reading it, unless `force=true`. Audited.
      parameters:
        - { name: force, in: query, schema: { type: boolean } }
      responses:
        "204": { description: Removed. }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "502": { $ref: "#/components/responses/Error" }

  # ------------------------------------------------------------ IPTV (Phase 7)
  /iptv/channels:
    get:
      tags: [iptv]
      operationId: listIptvChannels
      description: |
        Live TV channels of the enabled playlists the profile uses (ProfileSettings.iptv_playlists),
        deduplicated across playlists (tvg-id, else normalized name + URL), in the profile's order with
        its numbers, each with the current and next programme. Hidden channels are left out unless
        `include_hidden`. Browser sessions, TVs and API tokens (read).
      parameters:
        - { $ref: "#/components/parameters/ProfileId" }
        - { name: group, in: query, description: "IptvGroup.id, or `favorites`.", schema: { type: string, maxLength: 80 } }
        - { name: q, in: query, description: "Name search (case/ё-insensitive) or a channel number.", schema: { type: string, maxLength: 100 } }
        - { name: include_hidden, in: query, schema: { type: boolean, default: false } }
      responses:
        "200":
          description: Channels.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IptvChannelList" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /iptv/channels/{id}/epg:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      tags: [iptv]
      operationId: getIptvChannelEpg
      description: The channel's programmes overlapping [from, to) (default now − 3 h … now + 24 h; at most 3 days).
      parameters:
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
      responses:
        "200":
          description: Programmes in start order.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/IptvProgramme" } }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /iptv/channels/{id}/prefs:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    patch:
      tags: [iptv]
      operationId: updateIptvChannelPrefs
      description: Per-profile favorite / hidden / custom number (null clears it). Returns the channel as listed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [profile_id]
              properties:
                profile_id: { type: string, format: uuid }
                favorite: { type: boolean }
                hidden: { type: boolean }
                number: { type: [integer, "null"], minimum: 1, maximum: 9999 }
      responses:
        "200": { description: Channel., content: { application/json: { schema: { $ref: "#/components/schemas/IptvChannel" } } } }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /iptv/order:
    put:
      tags: [iptv]
      operationId: setIptvOrder
      description: Custom channel order for a profile (listed ids first, in this order; the rest keep the default order after them). An empty list resets.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [profile_id, channel_ids]
              properties:
                profile_id: { type: string, format: uuid }
                channel_ids: { type: array, maxItems: 5000, items: { type: string, format: uuid } }
      responses:
        "204": { description: Saved. }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /iptv/watched:
    post:
      tags: [iptv]
      operationId: reportIptvWatched
      description: |
        "Watched channel" event (live TV has no progress): remembers the profile's last channel
        («Продолжить смотреть ТВ»). Send once when a channel has played for a few seconds.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [profile_id, channel_id]
              properties:
                profile_id: { type: string, format: uuid }
                channel_id: { type: string, format: uuid }
      responses:
        "204": { description: Recorded. }
        "404": { $ref: "#/components/responses/Error" }
  /iptv/state:
    get:
      tags: [iptv]
      operationId: getIptvState
      description: Whether live TV is available to the profile and its last watched channel (Home card).
      parameters:
        - { $ref: "#/components/parameters/ProfileId" }
      responses:
        "200":
          description: State.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IptvState" }
        "404": { $ref: "#/components/responses/Error" }
  /iptv/guide:
    get:
      tags: [iptv]
      operationId: getIptvGuide
      description: |
        One page of the programme grid: channels (as in /iptv/channels, same filters and order) with
        their programmes overlapping [from, to). Default from = now − 30 min (floored to 30 min),
        to = from + 4 h; the range is at most 24 h.
      parameters:
        - { $ref: "#/components/parameters/ProfileId" }
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
        - { name: group, in: query, schema: { type: string, maxLength: 80 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 30 } }
      responses:
        "200":
          description: Guide page.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IptvGuide" }
        "422": { $ref: "#/components/responses/Error" }
  /iptv/logos/{id}:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      tags: [iptv]
      operationId: getIptvLogo
      security: []
      description: |
        The channel's logo, fetched server-side from the URL in its playlist (never a client-supplied
        URL) and cached on disk. Public like /images (TV <img> tags send no credentials).
      responses:
        "200": { description: Image bytes. }
        "404": { $ref: "#/components/responses/Error" }
        "502": { $ref: "#/components/responses/Error" }
  /admin/iptv/playlists:
    get:
      tags: [admin]
      operationId: adminListIptvPlaylists
      responses:
        "200":
          description: Playlists with refresh status and stats.
          content:
            application/json:
              schema:
                type: object
                required: [items, totals, proxy_configured, refresh_hours, epg_refresh_hours]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/AdminIptvPlaylist" } }
                  totals: { $ref: "#/components/schemas/IptvStats" }
                  proxy_configured: { type: boolean, description: "IPTV_PROXY_URL (or TMDB_PROXY_URL) is set: via_proxy and the automatic proxy fallback work." }
                  refresh_hours: { type: integer }
                  epg_refresh_hours: { type: integer }
        "403": { $ref: "#/components/responses/Error" }
    post:
      tags: [admin]
      operationId: adminCreateIptvPlaylist
      description: Adds a playlist and starts its first refresh in the background. Audited `iptv.playlist_created`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminIptvPlaylistInput" }
      responses:
        "201": { description: Created., content: { application/json: { schema: { $ref: "#/components/schemas/AdminIptvPlaylist" } } } }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /admin/iptv/playlists/{id}:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    patch:
      tags: [admin]
      operationId: adminUpdateIptvPlaylist
      description: Partial update (kind can't change). Audited `iptv.playlist_updated`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminIptvPlaylistInput" }
      responses:
        "200": { description: Updated., content: { application/json: { schema: { $ref: "#/components/schemas/AdminIptvPlaylist" } } } }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
    delete:
      tags: [admin]
      operationId: adminDeleteIptvPlaylist
      description: Deletes the playlist, its channels and their per-profile preferences. Audited `iptv.playlist_deleted`.
      responses:
        "204": { description: Deleted. }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /admin/iptv/playlists/{id}/content:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    put:
      tags: [admin]
      operationId: adminUploadIptvPlaylist
      description: Uploads the M3U of an `m3u_file` playlist (raw body, ≤ 5 MB) and refreshes it. Audited `iptv.playlist_uploaded`.
      requestBody:
        required: true
        content:
          text/plain:
            schema: { type: string }
          audio/x-mpegurl:
            schema: { type: string }
      responses:
        "200": { description: Stored; refresh started., content: { application/json: { schema: { $ref: "#/components/schemas/AdminIptvPlaylist" } } } }
        "404": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /admin/iptv/playlists/{id}/refresh:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    post:
      tags: [admin]
      operationId: adminRefreshIptvPlaylist
      description: Refreshes the playlist and then its EPG in the background (409 refresh_running while one runs). Audited `iptv.playlist_refreshed`.
      responses:
        "202": { description: Started., content: { application/json: { schema: { $ref: "#/components/schemas/AdminIptvPlaylist" } } } }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /admin/iptv/countries:
    get:
      tags: [admin]
      operationId: adminListIptvCountries
      description: iptv-org country presets for the picker (code = iptv-org playlist name, e.g. ru → countries/ru.m3u; int = international).
      responses:
        "200":
          description: Countries.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [code, name_en, name_ru, suggested]
                      properties:
                        code: { type: string }
                        name_en: { type: string }
                        name_ru: { type: string }
                        suggested: { type: boolean, description: "Preselected in the picker (ru, kz, ua, by, int)." }
                        guides: { type: array, items: { type: string }, description: "Default XMLTV guides of the preset, in merge priority." }
  # ------------------------------------------------------------ video (YouTube via Invidious)
  /video/search:
    get:
      tags: [video]
      operationId: searchVideos
      description: |
        YouTube search through the self-hosted Invidious (cached 10 min). Videos honour the profile's
        `video_hide_shorts` (pass `shorts=true` to keep them) and carry its `progress`. 503 `video_unavailable`
        when Invidious is down or not configured (every /video endpoint).
      parameters:
        - { $ref: "#/components/parameters/ProfileId" }
        - { name: q, in: query, required: true, schema: { type: string, minLength: 1, maxLength: 150 } }
        - { name: type, in: query, schema: { type: string, enum: [all, video, channel, playlist], default: all } }
        - { name: page, in: query, schema: { type: integer, minimum: 1, maximum: 20, default: 1 } }
        - { $ref: "#/components/parameters/VideoShorts" }
      responses:
        "200": { description: Results., content: { application/json: { schema: { $ref: "#/components/schemas/VideoSearchResult" } } } }
        "401": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /video/search/suggestions:
    get:
      tags: [video]
      operationId: videoSearchSuggestions
      description: Search-as-you-type suggestions (≤ 10, cached 1 h).
      parameters:
        - { name: q, in: query, required: true, schema: { type: string, minLength: 1, maxLength: 100 } }
      responses:
        "200":
          description: Suggestions.
          content:
            application/json:
              schema: { type: object, required: [items], properties: { items: { type: array, items: { type: string } } } }
        "503": { $ref: "#/components/responses/Error" }
  /video/trending:
    get:
      tags: [video]
      operationId: videoTrending
      description: |
        «В тренде» (cached 30 min). YouTube retired its trending page and Invidious' default list is now mostly
        live streams, which can't be played yet: without `type` they are dropped and the list is topped up from
        the gaming chart.
      parameters:
        - { $ref: "#/components/parameters/ProfileId" }
        - { name: region, in: query, schema: { type: string, pattern: "^[A-Za-z]{2}$", default: RU } }
        - { name: type, in: query, schema: { type: string, enum: [default, music, gaming, movies, news] } }
        - { $ref: "#/components/parameters/VideoShorts" }
      responses:
        "200": { description: Videos., content: { application/json: { schema: { $ref: "#/components/schemas/VideoList" } } } }
        "503": { $ref: "#/components/responses/Error" }
  /video/videos/{video_id}:
    parameters: [{ $ref: "#/components/parameters/VideoId" }]
    get:
      tags: [video]
      operationId: getVideo
      description: A video with description, channel, related videos, playable qualities and captions (cached up to 6 h). With profile_id also `progress`, `in_watch_later` and `channel.subscribed`.
      parameters:
        - { $ref: "#/components/parameters/ProfileId" }
      responses:
        "200": { description: Video., content: { application/json: { schema: { $ref: "#/components/schemas/VideoDetail" } } } }
        "404": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /video/channels/{channel_id}:
    parameters: [{ $ref: "#/components/parameters/VideoChannelId" }]
    get:
      tags: [video]
      operationId: getVideoChannel
      description: A channel with its latest uploads (cached 30 min); `continuation` pages through /videos.
      parameters:
        - { $ref: "#/components/parameters/ProfileId" }
        - { $ref: "#/components/parameters/VideoShorts" }
      responses:
        "200": { description: Channel., content: { application/json: { schema: { $ref: "#/components/schemas/VideoChannel" } } } }
        "404": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /video/channels/{channel_id}/videos:
    parameters: [{ $ref: "#/components/parameters/VideoChannelId" }]
    get:
      tags: [video]
      operationId: listVideoChannelVideos
      parameters:
        - { $ref: "#/components/parameters/ProfileId" }
        - { name: continuation, in: query, schema: { type: string, maxLength: 2000 } }
        - { $ref: "#/components/parameters/VideoShorts" }
      responses:
        "200": { description: Uploads., content: { application/json: { schema: { $ref: "#/components/schemas/VideoPage" } } } }
        "404": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /video/playlists/{playlist_id}:
    parameters:
      - { name: playlist_id, in: path, required: true, schema: { type: string, pattern: "^[A-Za-z0-9_-]{10,64}$" } }
    get:
      tags: [video]
      operationId: getVideoPlaylist
      parameters:
        - { $ref: "#/components/parameters/ProfileId" }
      responses:
        "200": { description: Playlist., content: { application/json: { schema: { $ref: "#/components/schemas/VideoPlaylist" } } } }
        "404": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /video/feed:
    get:
      tags: [video]
      operationId: videoFeed
      description: «Подписки» — the latest uploads of the profile's subscribed channels merged newest first (up to 30 per channel; the server refreshes every subscribed channel every 30 min and right after subscribing), a page at a time (`offset` / `limit`, then `next_offset`). Works while Invidious is down (cached).
      parameters:
        - { $ref: "#/components/parameters/RequiredProfileId" }
        - { $ref: "#/components/parameters/VideoShorts" }
        - { name: offset, in: query, description: "Skip this many feed entries (the previous page's next_offset).", schema: { type: integer, minimum: 0, maximum: 5000, default: 0 } }
        - { name: limit, in: query, description: "Feed entries per page (Shorts are dropped after paging, so a page may hold fewer items).", schema: { type: integer, minimum: 1, maximum: 200, default: 100 } }
      responses:
        "200":
          description: Feed.
          content:
            application/json:
              schema:
                type: object
                required: [items, refreshed_at, next_offset]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/VideoItem" } }
                  refreshed_at: { type: [string, "null"], format: date-time }
                  next_offset: { type: [integer, "null"], description: "offset of the next page; null = this was the last one." }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /video/subscriptions:
    get:
      tags: [video]
      operationId: listVideoSubscriptions
      description: The profile's subscribed channels (stored in Cineko, no Google account), by name.
      parameters:
        - { $ref: "#/components/parameters/RequiredProfileId" }
      responses:
        "200":
          description: Channels.
          content:
            application/json:
              schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: "#/components/schemas/VideoSubscription" } } } }
        "404": { $ref: "#/components/responses/Error" }
  /video/subscriptions/{channel_id}:
    parameters: [{ $ref: "#/components/parameters/VideoChannelId" }]
    put:
      tags: [video]
      operationId: subscribeVideoChannel
      description: Subscribes the profile (idempotent). Name/avatar come from Invidious when reachable.
      parameters:
        - { $ref: "#/components/parameters/RequiredProfileId" }
      responses:
        "200": { description: Subscribed., content: { application/json: { schema: { $ref: "#/components/schemas/VideoChannelRef" } } } }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
    delete:
      tags: [video]
      operationId: unsubscribeVideoChannel
      parameters:
        - { $ref: "#/components/parameters/RequiredProfileId" }
      responses:
        "204": { description: Unsubscribed (also when it wasn't). }
        "404": { $ref: "#/components/responses/Error" }
  /video/watch-later:
    get:
      tags: [video]
      operationId: listVideoWatchLater
      description: «Смотреть позже», newest first.
      parameters:
        - { $ref: "#/components/parameters/RequiredProfileId" }
      responses:
        "200": { description: Videos., content: { application/json: { schema: { $ref: "#/components/schemas/VideoList" } } } }
        "404": { $ref: "#/components/responses/Error" }
  /video/watch-later/{video_id}:
    parameters: [{ $ref: "#/components/parameters/VideoId" }]
    put:
      tags: [video]
      operationId: addVideoWatchLater
      parameters:
        - { $ref: "#/components/parameters/RequiredProfileId" }
      responses:
        "200": { description: Added (idempotent)., content: { application/json: { schema: { $ref: "#/components/schemas/VideoItem" } } } }
        "404": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
    delete:
      tags: [video]
      operationId: removeVideoWatchLater
      parameters:
        - { $ref: "#/components/parameters/RequiredProfileId" }
      responses:
        "204": { description: Removed. }
  /video/history:
    get:
      tags: [video]
      operationId: listVideoHistory
      description: «История» — videos the profile played, most recent first (≤ 200), each with `progress`.
      parameters:
        - { $ref: "#/components/parameters/RequiredProfileId" }
      responses:
        "200": { description: Videos., content: { application/json: { schema: { $ref: "#/components/schemas/VideoList" } } } }
        "404": { $ref: "#/components/responses/Error" }
  /video/history/{video_id}:
    parameters: [{ $ref: "#/components/parameters/VideoId" }]
    delete:
      tags: [video]
      operationId: removeVideoHistory
      parameters:
        - { $ref: "#/components/parameters/RequiredProfileId" }
      responses:
        "204": { description: Removed (resume position too). }
  /video/continue:
    get:
      tags: [video]
      operationId: listVideoContinue
      description: «Продолжить» — unfinished videos (position ≥ 15 s, last 60 days), most recent first (≤ 30).
      parameters:
        - { $ref: "#/components/parameters/RequiredProfileId" }
      responses:
        "200": { description: Videos., content: { application/json: { schema: { $ref: "#/components/schemas/VideoList" } } } }
  /video/progress:
    post:
      tags: [video]
      operationId: reportVideoProgress
      description: |
        Saves the resume position (every ~10 s while playing, on pause and on exit). A video counts as finished
        within its last 8 % or 20 s. The first report adds it to «История».
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [profile_id, video_id, position_seconds]
              properties:
                profile_id: { type: string, format: uuid }
                video_id: { type: string, pattern: "^[A-Za-z0-9_-]{11}$" }
                position_seconds: { type: number, minimum: 0 }
                duration_seconds: { type: number, minimum: 0 }
      responses:
        "204": { description: Saved. }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /video/thumbs/vi/{video_id}/{name}:
    get:
      tags: [video]
      operationId: getVideoThumbnail
      security: []
      description: Public same-origin thumbnail proxy (Invidious → i.ytimg.com through the VPN; cached on disk 7 days). Item.thumbnail / thumbnail_hd point here.
      parameters:
        - { $ref: "#/components/parameters/VideoId" }
        - { name: name, in: path, required: true, schema: { type: string, enum: [default.jpg, mqdefault.jpg, hqdefault.jpg, sddefault.jpg, maxresdefault.jpg, hq720.jpg] } }
      responses:
        "200": { description: Image., content: { image/jpeg: { schema: { type: string, format: binary } } } }
        "404": { $ref: "#/components/responses/Error" }
        "502": { $ref: "#/components/responses/Error" }
  /admin/video/status:
    get:
      tags: [admin]
      operationId: adminVideoStatus
      description: Invidious health card (probed every minute; `check=true` probes now) and subscription feed stats.
      parameters:
        - { name: check, in: query, schema: { type: boolean } }
      responses:
        "200": { description: Status., content: { application/json: { schema: { $ref: "#/components/schemas/AdminVideoStatus" } } } }
        "403": { $ref: "#/components/responses/Error" }
  # ---------------------------------------------------------------- outage alerts (internal/alerts)
  /admin/incidents:
    get:
      tags: [admin]
      operationId: adminListIncidents
      description: "Outage incidents: open ones first, then the last 30 days. Opened by the API's monitor (TMDB, Prowlarr, TorrServer, Invidious, the VPN proxy, disk, database; ~3 failed checks a minute apart) or the host scripts (POST /internal/incident). Admins get a Cineko message (and Web Push) on open, every 6 h while open, and on recovery."
      parameters:
        - { name: lang, in: query, description: "Language of summary / notes (ru default, en, kk).", schema: { type: string } }
      responses:
        "200":
          description: Newest first.
          content:
            application/json:
              schema:
                type: object
                required: [items, open]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Incident" } }
                  open: { type: integer }
        "403": { $ref: "#/components/responses/Error" }
  /admin/alerts/push:
    get:
      tags: [admin]
      operationId: adminAlertPushStatus
      description: The server's VAPID public key (applicationServerKey) and how many browsers of the caller get outage pushes.
      responses:
        "200":
          description: Status.
          content:
            application/json:
              schema:
                type: object
                required: [public_key, subscriptions]
                properties:
                  public_key: { type: string, description: "base64url uncompressed P-256 point." }
                  subscriptions: { type: integer }
        "403": { $ref: "#/components/responses/Error" }
    post:
      tags: [admin]
      operationId: adminAlertPushSubscribe
      description: "«Уведомления о сбоях»: store this browser's PushSubscription (upsert by endpoint). Only known push services (FCM, Mozilla, Apple, Windows) over HTTPS."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [endpoint, keys]
              properties:
                endpoint: { type: string }
                keys:
                  type: object
                  required: [p256dh, auth]
                  properties:
                    p256dh: { type: string }
                    auth: { type: string }
                locale: { type: string, description: "ru | en | kk: the language of pushes and of this admin's alert messages." }
      responses:
        "204": { description: Subscribed. }
        "422": { $ref: "#/components/responses/Error" }
  /admin/alerts/push/unsubscribe:
    post:
      tags: [admin]
      operationId: adminAlertPushUnsubscribe
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [endpoint]
              properties:
                endpoint: { type: string }
      responses:
        "204": { description: Removed (or wasn't there). }
  /admin/alerts/push/test:
    post:
      tags: [admin]
      operationId: adminAlertPushTest
      description: Sends a test notification to the caller's subscribed browsers.
      responses:
        "200":
          description: Result.
          content:
            application/json:
              schema:
                type: object
                required: [sent, failed]
                properties:
                  sent: { type: integer }
                  failed: { type: integer }
  # ---------------------------------------------------------------- super_admin: all devices & pairing requests
  /admin/devices:
    get:
      tags: [admin]
      operationId: adminListDevices
      description: "super_admin only (403 super_admin_required otherwise). Every household TV with its owner; metadata only, never credentials. Live refresh: realtime `admin.devices.updated`."
      responses:
        "200":
          description: Active (paired) devices, by owner.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/AdminDevice" } }
        "403": { $ref: "#/components/responses/Error" }
  /admin/devices/{id}:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    patch:
      tags: [admin]
      operationId: adminRenameDevice
      description: "super_admin only. Renames anyone's TV (audited admin.device_renamed)."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, minLength: 1, maxLength: 64 }
      responses:
        "204": { description: Renamed. }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
    delete:
      tags: [admin]
      operationId: adminDeleteDevice
      description: "super_admin only. Unpairs anyone's TV like the owner's «Отвязать»: credentials revoked, socket closed (audited admin.device_deleted)."
      responses:
        "204": { description: Unpaired. }
        "404": { $ref: "#/components/responses/Error" }
  /admin/devices/{id}/revoke-credential:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    post:
      tags: [admin]
      operationId: adminRevokeDeviceCredential
      description: "super_admin only. Revokes the TV's credentials and closes its socket; the device stays listed (credential_active false) until deleted, and the TV must pair again (audited admin.device_credential_revoked)."
      responses:
        "204": { description: Revoked. }
        "404": { $ref: "#/components/responses/Error" }
  /admin/pairing:
    get:
      tags: [admin]
      operationId: adminListPairing
      description: "super_admin only. Pending requests, approved ones not yet exchanged, and requests that expired or were rejected in the last hour (newest first). Never the poll secret."
      responses:
        "200":
          description: Pairing requests.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/AdminPairingRequest" } }
        "403": { $ref: "#/components/responses/Error" }
  /admin/pairing/{id}/reject:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    post:
      tags: [admin]
      operationId: adminRejectPairing
      description: "super_admin only. Rejects a pending request or cancels an approved, not yet exchanged one; the TV's next poll sees denied (audited admin.pairing_rejected). 410 pairing_unavailable when it already ended."
      responses:
        "204": { description: Rejected. }
        "410": { $ref: "#/components/responses/Error" }
  /admin/pairing/assignees:
    get:
      tags: [admin]
      operationId: adminPairingAssignees
      description: "super_admin only. Enabled users with their profiles (oldest first), for «Принять и назначить…»."
      responses:
        "200":
          description: Users.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [id, username, display_name, profiles]
                      properties:
                        id: { type: string, format: uuid }
                        username: { type: string }
                        display_name: { type: string }
                        profiles:
                          type: array
                          items:
                            type: object
                            required: [id, name]
                            properties:
                              id: { type: string, format: uuid }
                              name: { type: string }
  /admin/pairing/{id}/approve:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    post:
      tags: [admin]
      operationId: adminApprovePairing
      description: |
        super_admin only. Accepts a pending request and assigns the TV to
        user_id, exactly as if that user had approved it: the TV's exchange
        creates a device owned by them. default_profile_id must be one of their
        profiles; without it their first profile is used (one is created if
        they have none). Audited pairing.admin_approved; the user's sockets get
        device.changed. 422 for a disabled/unknown user or a foreign profile,
        410 pairing_unavailable when the request expired or was already handled.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_id]
              properties:
                user_id: { type: string, format: uuid }
                device_name: { type: string, maxLength: 64, description: "Default: the name the TV sent." }
                default_profile_id: { type: string, format: uuid }
      responses:
        "204": { description: Approved for the user. }
        "410": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }

components:
  securitySchemes:
    cookieAuth: { type: apiKey, in: cookie, name: mt_session }
    bearerAuth: { type: http, scheme: bearer }
    pairingSecret: { type: apiKey, in: header, name: Authorization, description: "Pairing <poll_secret>" }
  parameters:
    ProfileId:
      name: profile_id
      in: query
      description: Apply this profile's settings (e.g. hide_anime) and annotate items with `me` (progress, lists, rating). Must be accessible to the caller.
      schema: { type: string, format: uuid }
    HideWatched:
      name: hide_watched
      in: query
      description: With profile_id, drop titles the profile has completed. Defaults to the profile's hide_watched setting.
      schema: { type: boolean }
    Lang:
      name: lang
      in: query
      description: Content language for titles/overviews. Defaults to en.
      schema: { type: string, enum: [en, ru], default: en }
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, maximum: 500, default: 1 }
    Id:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    RequiredProfileId:
      name: profile_id
      in: query
      required: true
      description: The profile whose list this is (must be accessible to the caller).
      schema: { type: string, format: uuid }
    VideoId:
      name: video_id
      in: path
      required: true
      description: YouTube video id.
      schema: { type: string, pattern: "^[A-Za-z0-9_-]{11}$" }
    VideoChannelId:
      name: channel_id
      in: path
      required: true
      description: YouTube channel id (UC…).
      schema: { type: string, pattern: "^UC[A-Za-z0-9_-]{22}$" }
    VideoShorts:
      name: shorts
      in: query
      description: true = keep Shorts even when the profile hides them (video_hide_shorts).
      schema: { type: boolean }
  responses:
    CatalogUnavailable:
      description: "TMDB is not configured (code catalog_unavailable). 502 catalog_upstream_error means TMDB failed and nothing was cached."
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Error:
      description: Error envelope.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string, examples: [validation_failed, unauthorized, rate_limited] }
            message: { type: string }
            request_id: { type: string }
            fields:
              type: object
              additionalProperties: { type: string }
    Scope:
      type: string
      enum: [read, write, admin, "device:register"]
    User:
      type: object
      required: [id, username, display_name, role]
      properties:
        id: { type: string, format: uuid }
        username: { type: string }
        display_name: { type: string }
        role: { $ref: "#/components/schemas/Role" }
    AdminUser:
      allOf:
        - $ref: "#/components/schemas/User"
        - type: object
          required: [disabled_at, created_at]
          properties:
            disabled_at: { type: [string, "null"], format: date-time }
            created_at: { type: string, format: date-time }
    Session:
      type: object
      required: [kind, user]
      properties:
        kind: { type: string, enum: [session, token, device] }
        user: { $ref: "#/components/schemas/User" }
        csrf_token: { type: string }
        scopes: { type: array, items: { type: string } }
        device_id: { type: string, format: uuid }
    SessionInfo:
      type: object
      required: [id, user_agent, ip, created_at, last_seen_at, expires_at, current]
      properties:
        id: { type: string, format: uuid }
        user_agent: { type: string }
        ip: { type: string }
        created_at: { type: string, format: date-time }
        last_seen_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
        current: { type: boolean }
    ApiToken:
      type: object
      required: [id, name, prefix, scopes, expires_at, last_used_at, created_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        prefix: { type: string }
        scopes: { type: array, items: { type: string } }
        expires_at: { type: [string, "null"], format: date-time }
        last_used_at: { type: [string, "null"], format: date-time }
        created_at: { type: string, format: date-time }
    Profile:
      type: object
      required: [id, user_id, name, avatar, color, has_pin, created_at]
      properties:
        id: { type: string, format: uuid }
        user_id: { type: string, format: uuid }
        name: { type: string }
        avatar: { type: string }
        color: { type: string }
        has_pin: { type: boolean }
        created_at: { type: string, format: date-time }
    ProfileInput:
      type: object
      properties:
        name: { type: string, maxLength: 32 }
        avatar: { type: string, maxLength: 64 }
        color: { type: string, pattern: "^#[0-9a-fA-F]{6}$" }
        pin: { type: string, pattern: "^[0-9]{4,8}$" }
        clear_pin: { type: boolean }
    Preferences:
      type: object
      required: [ui_language, preferred_audio_languages, preferred_subtitle_languages, preferred_resolution, max_size_gb, preferred_codecs]
      properties:
        ui_language: { type: string, enum: ["", en, ru, kk], description: "The profile's interface language; \"\" = not chosen. Apps use it on a device that has no language of its own (that device's choice wins), before the browser/TV language." }
        preferred_audio_languages: { type: array, items: { type: string } }
        preferred_subtitle_languages: { type: array, items: { type: string } }
        preferred_resolution: { type: string, enum: ["", 480p, 720p, 1080p, 2160p] }
        max_size_gb: { type: [number, "null"] }
        preferred_codecs: { type: array, items: { type: string } }
        preferred_voiceovers: { type: array, maxItems: 10, items: { type: string, minLength: 1, maxLength: 40 }, description: "Preferred dub/voice-over studios, most preferred first (e.g. LostFilm). Boosts matching releases and auto-selects matching audio tracks in the built-in player." }
    Device:
      type: object
      required: [id, owner_user_id, owner_username, name, platform, default_profile_id, created_at, last_seen_at, access, online]
      properties:
        id: { type: string, format: uuid }
        owner_user_id: { type: string, format: uuid }
        owner_username: { type: string }
        name: { type: string }
        platform: { type: string }
        default_profile_id: { type: [string, "null"], format: uuid }
        created_at: { type: string, format: date-time }
        last_seen_at: { type: [string, "null"], format: date-time }
        access: { type: string, enum: [owner, use, control, device] }
        online: { type: boolean }
        owner:
          type: object
          description: Only with `GET /devices?scope=all`.
          required: [id, username, display_name]
          properties:
            id: { type: string, format: uuid }
            username: { type: string }
            display_name: { type: string }
        via: { type: string, enum: [admin], description: "Only with `scope=all`: reached through the super_admin role (not owned or shared)." }
    DevicePermission:
      type: object
      required: [user_id, username, permission, created_at]
      properties:
        user_id: { type: string, format: uuid }
        username: { type: string }
        permission: { type: string, enum: [control, use] }
        created_at: { type: string, format: date-time }
    PlaybackAuto:
      type: object
      description: "Detected by the device itself (reported on start and after playback). All fields optional."
      properties:
        screen_width: { type: [integer, "null"], minimum: 0, maximum: 16384, description: "Physical pixels (CSS × DPR)." }
        screen_height: { type: [integer, "null"], minimum: 0, maximum: 16384 }
        video: { type: array, maxItems: 16, items: { type: string, enum: [h264, hevc, vp9, av1, hdr10, dv] }, description: "Decodable video codecs/formats." }
        audio: { type: array, maxItems: 16, items: { type: string, enum: [aac, ac3, eac3, dts, truehd, mp3, opus, flac] }, description: "Decodable audio codecs." }
        containers: { type: array, maxItems: 16, items: { type: string, enum: [mkv, mp4, ts] } }
        rough:
          type: array
          maxItems: 16
          items: { type: string, enum: [h264_1080p, h264_2160p, hevc_1080p, hevc_2160p, hevc_10bit_1080p, hevc_10bit_2160p, av1_1080p, av1_2160p, av1_10bit_1080p, av1_10bit_2160p, silent, anderson] }
          description: "Video variants (codec, 10-bit, 1080p / 2160p) the device decodes but not smoothly: mediaCapabilities.decodingInfo says smooth = false, or playback dropped many frames there. Ranking demotes matching releases (warning may_stutter)."
        hls: { type: [boolean, "null"] }
        compat: { type: [boolean, "null"], description: "Compat streams (AAC transcode) are usable." }
        throughput_bps: { type: [number, "null"], minimum: 0, maximum: 10000000000, description: "Current estimate of the device → server throughput, bits/s: the median of recent playback sessions and background speed tests (GET /speedtest), the newest test weighing most (a new network replaces older samples)." }
        model: { type: [string, "null"], maxLength: 128, description: "e.g. «TX3 · Android 11 · MSX»." }
        platform: { type: [string, "null"], maxLength: 64 }
        detected_at: { type: [string, "null"], format: date-time }
    PlaybackManual:
      type: object
      description: "User overrides; null / missing = automatic."
      properties:
        preset: { type: [string, "null"], maxLength: 32, pattern: "^[a-z0-9_]*$", description: "Preset last applied (informational)." }
        max_resolution: { type: [string, "null"], enum: ["720p", "1080p", "2160p", null] }
        max_bitrate_mbps: { type: [integer, "null"], minimum: 0, maximum: 1000, description: "null = auto (from throughput), 0 = unlimited." }
        max_size_gb: { type: [number, "null"], minimum: 0, maximum: 500, description: "0 / null = no limit." }
        video_codec: { type: [string, "null"], enum: [h264, hevc, null] }
        hdr: { type: [string, "null"], enum: [allow, avoid, null] }
        audio: { type: [string, "null"], enum: [prefer_aac_ac3, avoid_dts_truehd, always_compat, null] }
        default_player: { type: [string, "null"], enum: [builtin, msx, external, null] }
        prefer_smaller: { type: [boolean, "null"] }
    PlaybackEffective:
      type: object
      description: "auto + manual merged (manual wins); what release ranking uses. Null limits = none. Mirrors effectivePrefs() in @martytv/media-types."
      required: [max_resolution, max_bitrate_bps, max_size_gb, video_codec, avoid_hdr, audio, prefer_smaller, video, audio_codecs, rough, compat, default_player]
      properties:
        max_resolution: { type: [string, "null"], enum: ["720p", "1080p", "2160p", null] }
        max_bitrate_bps: { type: [number, "null"] }
        max_size_gb: { type: [number, "null"] }
        video_codec: { type: [string, "null"], enum: [h264, hevc, null] }
        avoid_hdr: { type: boolean }
        audio: { type: [string, "null"], enum: [prefer_aac_ac3, avoid_dts_truehd, always_compat, null] }
        prefer_smaller: { type: boolean }
        video: { type: [array, "null"], items: { type: string }, description: "Decodable video (null = unknown)." }
        audio_codecs: { type: [array, "null"], items: { type: string }, description: "Decodable audio (null = unknown)." }
        rough: { type: [array, "null"], items: { type: string }, description: "auto.rough: variants that don't play smoothly (null = none known)." }
        compat: { type: boolean }
        default_player: { type: [string, "null"], enum: [builtin, msx, external, null] }
    PlaybackConstraint:
      type: object
      description: "One applied constraint (summary chip). Same as Constraint in @martytv/media-types."
      required: [code]
      properties:
        code: { type: string, enum: [max_resolution, max_bitrate, max_size, codec, no_hdr, no_audio, compat_audio, smaller] }
        value: { type: string, description: "max_resolution: 720p/1080p/2160p; codec: h264/hevc." }
        mbps: { type: number, description: "max_bitrate." }
        gb: { type: number, description: "max_size." }
        codecs: { type: array, items: { type: string }, description: "no_audio." }
    DeviceHealthSample:
      type: object
      description: |
        What a TV's browser can tell about its own load (browsers can't read
        system CPU/RAM). Every measurement is optional: old engines lack most
        APIs. Heap = performance.memory (Chromium only); fps / slow frames
        from requestAnimationFrame over ≤3 s; lag = setTimeout drift over
        the same sample; long tasks via PerformanceObserver('longtask') since
        the previous report; dropped/total frames = getVideoPlaybackQuality()
        over the last playback session (reason = playback).
      required: [reason]
      properties:
        at: { type: string, format: date-time, description: "Set by the server." }
        reason: { type: string, enum: [periodic, playback] }
        uptime_s: { type: integer, minimum: 0, description: "Seconds since the app started." }
        screen: { type: string, maxLength: 24, description: "home, details, player… (DeviceState.screen)." }
        playing: { type: boolean, description: "The player was open while sampling." }
        model: { type: string, maxLength: 120 }
        heap_used_mb: { type: number, minimum: 0 }
        heap_total_mb: { type: number, minimum: 0 }
        heap_limit_mb: { type: number, minimum: 0 }
        device_memory_gb: { type: number, minimum: 0, description: "navigator.deviceMemory (a rounded bucket)." }
        cores: { type: integer, minimum: 0, description: "navigator.hardwareConcurrency." }
        fps: { type: number, minimum: 0, maximum: 1000, description: "Median frame rate over the sample." }
        slow_frames_pct: { type: number, minimum: 0, maximum: 100, description: "Share of frames longer than 50 ms." }
        lag_ms: { type: number, minimum: 0, description: "Median event-loop delay." }
        lag_max_ms: { type: number, minimum: 0, description: "Worst event-loop delay in the sample." }
        long_tasks: { type: integer, minimum: 0, description: "Long tasks (> 50 ms) since the previous report." }
        long_task_ms: { type: number, minimum: 0, description: "Their total duration." }
        dropped_frames: { type: integer, minimum: 0 }
        total_frames: { type: integer, minimum: 0 }
    DeviceHealth:
      type: object
      required: [latest, history]
      properties:
        latest: { oneOf: [{ $ref: "#/components/schemas/DeviceHealthSample" }, { type: "null" }] }
        history: { type: array, items: { $ref: "#/components/schemas/DeviceHealthSample" }, description: "Newest first, at most 50." }
    PlaybackPrefs:
      type: object
      required: [auto, manual, effective, constraints, updated_at]
      properties:
        auto: { $ref: "#/components/schemas/PlaybackAuto" }
        manual: { $ref: "#/components/schemas/PlaybackManual" }
        effective: { $ref: "#/components/schemas/PlaybackEffective" }
        constraints: { type: array, items: { $ref: "#/components/schemas/PlaybackConstraint" } }
        updated_at: { type: [string, "null"], format: date-time }
    PlaybackPrefsPatch:
      type: object
      description: "Each given part replaces that part wholesale (send the full object). Body ≤ 8 KB."
      properties:
        auto: { $ref: "#/components/schemas/PlaybackAuto" }
        manual: { $ref: "#/components/schemas/PlaybackManual" }
    ClientPlaybackPrefs:
      allOf:
        - { $ref: "#/components/schemas/PlaybackPrefs" }
        - type: object
          required: [client_id, name, platform]
          properties:
            client_id: { type: string }
            name: { type: string }
            platform: { type: string }
    ClientPlaybackPrefsPatch:
      allOf:
        - { $ref: "#/components/schemas/PlaybackPrefsPatch" }
        - type: object
          properties:
            name: { type: string, maxLength: 64 }
            platform: { type: string, maxLength: 64 }
    ReleaseDeviceFit:
      type: object
      description: "The device/browser whose playback profile ranked the list."
      required: [kind, id, name, constraints]
      properties:
        kind: { type: string, enum: [device, client] }
        id: { type: string }
        name: { type: string }
        constraints: { type: array, items: { $ref: "#/components/schemas/PlaybackConstraint" } }
    DeviceCredentialResponse:
      type: object
      required: [device, credential]
      properties:
        device: { $ref: "#/components/schemas/Device" }
        credential: { type: string, description: "mtd_… device credential; store it securely on the TV." }
    PairingStart:
      type: object
      required: [pairing_id, user_code, poll_secret, expires_at, verification_url, verification_url_complete, poll_interval_seconds]
      properties:
        pairing_id: { type: string, format: uuid }
        user_code: { type: string, examples: [K7QM-2XPD] }
        poll_secret: { type: string }
        expires_at: { type: string, format: date-time }
        verification_url: { type: string }
        verification_url_complete: { type: string, description: Encode this in the QR code. Contains no secret. }
        poll_interval_seconds: { type: integer }
    PairingPending:
      type: object
      required: [pairing_id, user_code, device_name, platform, ip, created_at, expires_at]
      properties:
        pairing_id: { type: string, format: uuid }
        user_code: { type: string }
        device_name: { type: string }
        platform: { type: string }
        ip: { type: string }
        created_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
    IntegrationStatus:
      type: object
      required: [name, configured, ok, checked_at]
      properties:
        name: { type: string, enum: [prowlarr, jackett, torrserver, tmdb, kinopoisk], description: "Only the torrent search backend INDEXER chose is listed (prowlarr or jackett; neither with INDEXER=none)." }
        configured: { type: boolean, description: "kinopoisk: false without KINOPOISK_API_KEY (ratings then stay null)." }
        ok: { type: boolean }
        version: { type: string }
        error: { type: string }
        budget_remaining: { type: integer, description: "kinopoisk only: id-lookup requests left today (Moscow day)." }
        checked_at: { type: string, format: date-time }

    MediaKind:
      type: string
      enum: [movie, series]
    ListKey:
      type: string
      enum: [trending, popular, top_rated, upcoming, now_playing, on_the_air, airing_today]
    # ---- taste quiz ----
    TasteQuizQuestion:
      type: object
      required: [id, multi, options]
      properties:
        id: { type: string, enum: [genres_like, genres_dislike, eras, origins, mood, format, audio, company, intensity] }
        multi: { type: boolean }
        options: { type: array, items: { type: string }, description: "Option ids (genre questions: TMDB genre ids)." }
    TasteQuizState:
      type: object
      required: [questions, answers, rated, answered, goal, started_at, completed_at, dismissed_at]
      properties:
        questions: { type: array, items: { $ref: "#/components/schemas/TasteQuizQuestion" } }
        answers: { type: object, additionalProperties: { type: array, items: { type: string } } }
        rated: { type: integer, description: Titles rated in the quiz. }
        answered: { type: integer, description: Titles answered in any way. }
        goal: { type: integer, description: Rated titles that make a good start. }
        started_at: { type: [string, "null"], format: date-time }
        completed_at: { type: [string, "null"], format: date-time }
        dismissed_at: { type: [string, "null"], format: date-time }
    TasteQuizGenerated:
      type: object
      required: [state, basis, ai_regeneration]
      properties:
        state: { $ref: "#/components/schemas/TasteQuizState" }
        basis: { $ref: "#/components/schemas/TasteQuizBasis" }
        ai_regeneration: { type: boolean }
    TasteQuizBasis:
      type: object
      description: What a generation was based on.
      required: [titles, rated, completed, favorites, liked, disliked]
      properties:
        titles: { type: integer, description: Rated, finished or favourite titles. }
        rated: { type: integer }
        completed: { type: integer }
        favorites: { type: integer }
        liked: { type: integer, description: Titles counted as liked. }
        disliked: { type: integer, description: Titles counted as disliked (low rating, abandoned, dismissed). }
    TasteQuizTitleAnswer:
      type: object
      required: [media_id, answer]
      properties:
        media_id: { type: string, format: uuid }
        answer: { type: string, enum: [rated, unseen, not_interested, want] }
        rating: { type: integer, minimum: 1, maximum: 10, description: "Required for rated." }
    MediaSummary:
      type: object
      description: |
        A title as shown on a poster card. `id` is Cineko's internal UUID and is
        stable across languages and devices (phone and TV open the same id).
      required: [id, kind, tmdb_id, title, original_title, year, release_date, overview, poster_path, backdrop_path, rating, vote_count, genre_ids]
      properties:
        id: { type: string, format: uuid }
        kind: { $ref: "#/components/schemas/MediaKind" }
        tmdb_id: { type: integer }
        title: { type: string }
        original_title: { type: string }
        year: { type: [integer, "null"] }
        release_date: { type: [string, "null"], format: date, description: "Movies: release date. Series: first air date." }
        overview: { type: string }
        poster_path: { type: [string, "null"], description: "TMDB file path, e.g. /abc.jpg. Build URLs with imageUrl() from @martytv/media-types." }
        backdrop_path: { type: [string, "null"] }
        rating: { type: [number, "null"], description: "TMDB vote average 0–10; null when there are too few votes." }
        vote_count: { type: integer }
        kp_rating: { type: [number, "null"], description: "Kinopoisk rating 0–10 when known (filled lazily; absent/null until fetched)." }
        imdb_rating: { type: [number, "null"], description: "IMDb rating 0–10 when known (from the Kinopoisk data source)." }
        genre_ids: { type: array, items: { type: integer } }
        award_badge: { $ref: "#/components/schemas/AwardBadge" }
        me:
          description: Present when the request had profile_id.
          oneOf: [{ $ref: "#/components/schemas/MediaUserState" }, { type: "null" }]
    AwardBadge:
      type: object
      description: |
        Poster badge (🏆), present only for titles with tier-1 wins: Oscars or the
        main prize of Cannes (Palme d'Or), Venice (Golden Lion) or Berlin (Golden
        Bear). `group` is the award group with the most such wins (ties: oscar,
        cannes, venice, berlin); clients translate `awards.group.<group>`.
        Annotated together with kp_rating wherever summaries carry ratings.
      required: [group, count]
      properties:
        group: { type: string, enum: [oscar, cannes, venice, berlin] }
        count: { type: integer, minimum: 1 }
    AwardGroup:
      type: object
      description: |
        One award (Oscars, Cannes, Golden Globe…; `other` = everything outside the
        curated list of major awards) with the title's wins and nominations, from
        Wikidata (P166 award received / P1411 nominated for). Labels are in the
        request `lang`; inside a curated group `label` is the category ("лучший
        фильм", "Best Director"), in `other` the full award name.
        tier: 1 = Oscars and the main prizes of Cannes/Venice/Berlin, 2 = other
        major awards (Golden Globe, BAFTA, Emmy, César, Goya, European Film Awards,
        Independent Spirit, Nika, Golden Eagle, Kinotavr, other festival prizes),
        3 = other.
      required: [group, group_label, tier, wins, nominations]
      properties:
        group: { type: string, description: "oscar, cannes, venice, berlin, golden_globe, bafta, emmy, cesar, goya, efa, spirit, nika, golden_eagle, kinotavr or other." }
        group_label: { type: string, description: "Short group name: «Оскар», «Канны», «Другие награды»…" }
        tier: { type: integer, minimum: 1, maximum: 3 }
        wins: { type: array, items: { $ref: "#/components/schemas/AwardEntry" } }
        nominations: { type: array, items: { $ref: "#/components/schemas/AwardEntry" }, description: "Nominations not won (a nomination for an award also won that year is dropped)." }
    AwardEntry:
      type: object
      required: [label, year]
      properties:
        label: { type: string }
        year: { type: [integer, "null"], description: "Ceremony/festival year; null when Wikidata has none." }
    MediaPage:
      type: object
      required: [items, page, total_pages, total_results]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/MediaSummary" } }
        page: { type: integer }
        total_pages: { type: integer }
        total_results: { type: integer }
    HomeRow:
      type: object
      required: [key, kind, list, items]
      properties:
        key: { type: string, description: "Stable id; clients translate catalog.row.<key>.", enum: [trending, popular_movies, popular_series, top_rated_movies, top_rated_series, upcoming_movies, on_the_air_series] }
        kind: { type: string, enum: [all, movie, series] }
        list: { $ref: "#/components/schemas/ListKey" }
        items: { type: array, items: { $ref: "#/components/schemas/MediaSummary" } }
    Genre:
      type: object
      required: [id, name]
      properties:
        id: { type: integer }
        name: { type: string }
    CastMember:
      type: object
      required: [person_tmdb_id, name, character, profile_path, order]
      properties:
        person_tmdb_id: { type: integer }
        name: { type: string }
        character: { type: string }
        profile_path: { type: [string, "null"] }
        order: { type: integer }
    Person:
      type: object
      required: [tmdb_id, name, profile_path, biography, birthday, deathday, place_of_birth, known_for_department, credits]
      properties:
        tmdb_id: { type: integer }
        name: { type: string }
        profile_path: { type: [string, "null"] }
        biography: { type: string, description: "In the requested language, else English; may be empty." }
        birthday: { type: [string, "null"], format: date }
        deathday: { type: [string, "null"], format: date }
        place_of_birth: { type: [string, "null"] }
        known_for_department: { type: string, description: "Acting, Directing…" }
        credits: { type: array, maxItems: 150, items: { $ref: "#/components/schemas/PersonCredit" } }
    PersonCredit:
      type: object
      required: [media, role, crew]
      properties:
        media: { $ref: "#/components/schemas/MediaSummary" }
        role: { type: string, description: "Character(s) played and/or jobs (Director, Screenplay…), comma-separated." }
        crew: { type: boolean, description: "Only behind the camera (directed / wrote), didn't act." }
    CrewMember:
      type: object
      required: [person_tmdb_id, name, job, department, profile_path]
      properties:
        person_tmdb_id: { type: integer }
        name: { type: string }
        job: { type: string, description: "Director, Screenplay, Writer, Creator, Producer, Original Music Composer…" }
        department: { type: string }
        profile_path: { type: [string, "null"] }
    SeasonSummary:
      type: object
      required: [season_number, name, overview, air_date, episode_count, poster_path]
      properties:
        season_number: { type: integer, description: "0 = specials." }
        name: { type: string }
        overview: { type: string }
        air_date: { type: [string, "null"], format: date }
        episode_count: { type: integer }
        poster_path: { type: [string, "null"] }
    Episode:
      type: object
      required: [id, season_number, episode_number, name, overview, air_date, runtime, still_path, rating]
      properties:
        id: { type: string, format: uuid, description: "Internal episode id (used by watch history later)." }
        season_number: { type: integer }
        episode_number: { type: integer }
        name: { type: string }
        overview: { type: string }
        air_date: { type: [string, "null"], format: date }
        runtime: { type: [integer, "null"], description: Minutes. }
        still_path: { type: [string, "null"] }
        rating: { type: [number, "null"] }
    Season:
      allOf:
        - $ref: "#/components/schemas/SeasonSummary"
        - type: object
          required: [media_id, episodes]
          properties:
            media_id: { type: string, format: uuid }
            episodes: { type: array, items: { $ref: "#/components/schemas/Episode" } }
    Video:
      type: object
      required: [site, key, name, type]
      properties:
        site: { type: string, enum: [YouTube, Vimeo] }
        key: { type: string }
        name: { type: string }
        type: { type: string, description: "Trailer, Teaser…" }
    MediaQuotes:
      type: object
      required: [items, source, source_url, lang]
      properties:
        items:
          type: array
          maxItems: 12
          items:
            type: object
            required: [text, speaker]
            properties:
              text: { type: string }
              speaker: { type: [string, "null"], description: "The character, when the page says." }
        source: { type: [string, "null"], enum: [wikiquote, null] }
        source_url: { type: [string, "null"], description: "The Wikiquote page." }
        lang: { type: string, enum: [ru, en], description: "Language of the quotes (may differ from the request)." }
    MediaFacts:
      type: object
      required: [items, source, source_url, lang]
      properties:
        items:
          type: array
          maxItems: 15
          items:
            type: object
            required: [text, kind, spoiler]
            properties:
              text: { type: string, description: "Plain text." }
              kind: { type: string, enum: [fact, blooper] }
              spoiler: { type: boolean, description: "Reveals the plot: hide until asked." }
        source: { type: [string, "null"], enum: [kinopoisk, ai, null], description: "ai = written by DeepSeek (label it, may be inaccurate)." }
        source_url: { type: [string, "null"] }
        lang: { type: string, enum: [ru, en] }
    MediaCompanion:
      type: object
      required: [ai_enabled, daily_limit, used_today, recap, after_credits]
      properties:
        ai_enabled: { type: boolean }
        daily_limit: { type: integer }
        used_today: { type: integer }
        recap:
          type: object
          required: [available, last_watched_at, through, cached]
          properties:
            available: { type: boolean }
            last_watched_at: { type: [string, "null"], format: date-time }
            through:
              description: "The furthest completed episode."
              oneOf: [{ $ref: "#/components/schemas/EpisodeRef" }, { type: "null" }]
            cached: { type: boolean, description: "Pressing is free (already generated for these episodes)." }
        after_credits:
          type: object
          required: [available, scope, season]
          properties:
            available: { type: boolean }
            scope: { type: string, enum: [movie, season, series, ""] }
            season: { type: [integer, "null"] }
    EpisodeRef:
      type: object
      required: [season, episode]
      properties:
        season: { type: integer }
        episode: { type: integer }
    CompanionRequest:
      type: object
      required: [profile_id]
      properties:
        profile_id: { type: string, format: uuid }
        lang: { type: string, enum: [en, ru] }
    SeriesRecap:
      type: object
      required: [lines, through, episodes, cached, generated_at]
      properties:
        lines: { type: array, maxItems: 5, items: { type: string }, description: "Plain text, one sentence each." }
        through: { $ref: "#/components/schemas/EpisodeRef" }
        episodes: { type: integer, description: "Synopses it was built from." }
        cached: { type: boolean }
        generated_at: { type: string, format: date-time }
    AfterCredits:
      type: object
      required: [topic, known, paragraphs, scope, season, cached, generated_at]
      properties:
        topic: { type: string, enum: [ending, significance] }
        known: { type: boolean, description: "False: the model doesn't know this title well enough (paragraphs empty)." }
        paragraphs: { type: array, maxItems: 4, items: { type: string } }
        scope: { type: string, enum: [movie, season, series] }
        season: { type: [integer, "null"] }
        cached: { type: boolean }
        generated_at: { type: string, format: date-time }
    AfterCreditsChat:
      type: object
      required: [messages, followups, limit, remaining, scope, season, refused]
      properties:
        messages:
          type: array
          items:
            type: object
            required: [role, text]
            properties:
              role: { type: string, enum: [user, assistant] }
              text: { type: string }
        followups: { type: array, maxItems: 3, items: { type: string }, description: "Suggested next questions." }
        limit: { type: integer, description: "Messages per chat (6)." }
        remaining: { type: integer }
        scope: { type: string, enum: [movie, season, series] }
        season: { type: [integer, "null"] }
        refused: { type: boolean, description: "The last message was off-topic and declined." }
    MediaDetail:
      allOf:
        - $ref: "#/components/schemas/MediaSummary"
        - type: object
          required: [tagline, runtime, status, original_language, genres, countries, cast, crew, seasons, number_of_seasons, number_of_episodes, last_air_date, external_ids, trailer, awards]
          properties:
            tagline: { type: string }
            runtime: { type: [integer, "null"], description: "Minutes. Series: typical episode runtime." }
            status: { type: string, description: "Released, In Production, Returning Series, Ended…" }
            original_language: { type: string }
            genres: { type: array, items: { $ref: "#/components/schemas/Genre" } }
            countries: { type: array, items: { type: string }, description: "ISO 3166-1 codes." }
            cast: { type: array, maxItems: 30, items: { $ref: "#/components/schemas/CastMember" } }
            crew: { type: array, items: { $ref: "#/components/schemas/CrewMember" }, description: "Key crew only (directors, writers, creators, composer, DoP)." }
            seasons: { type: array, items: { $ref: "#/components/schemas/SeasonSummary" }, description: "Empty for movies." }
            number_of_seasons: { type: [integer, "null"] }
            number_of_episodes: { type: [integer, "null"] }
            last_air_date: { type: [string, "null"], format: date }
            external_ids:
              type: object
              required: [tmdb, imdb, tvdb]
              properties:
                tmdb: { type: integer }
                imdb: { type: [string, "null"] }
                tvdb: { type: [integer, "null"] }
                kinopoisk: { type: [integer, "null"] }
            trailer: { oneOf: [{ $ref: "#/components/schemas/Video" }, { type: "null" }] }
            awards:
              type: array
              items: { $ref: "#/components/schemas/AwardGroup" }
              description: |
                Awards and nominations grouped per award, sorted by tier, then wins,
                then nominations. Stored rows only: a title never checked is looked up
                on Wikidata in the background (the list fills on a later view); the
                whole catalog is re-checked every 60 days. Empty when unknown.
    Provider:
      type: object
      required: [provider_id, name, logo_path]
      properties:
        provider_id: { type: integer }
        name: { type: string }
        logo_path: { type: [string, "null"] }
    Providers:
      type: object
      required: [region, link, flatrate, rent, buy]
      properties:
        region: { type: string }
        link: { type: [string, "null"], description: "TMDB watch page; JustWatch attribution required when shown." }
        flatrate: { type: array, items: { $ref: "#/components/schemas/Provider" } }
        rent: { type: array, items: { $ref: "#/components/schemas/Provider" } }
        buy: { type: array, items: { $ref: "#/components/schemas/Provider" } }
    CatalogConfig:
      type: object
      required: [image_base_url, poster_sizes, backdrop_sizes, profile_sizes, still_sizes, attribution, region, available]
      properties:
        image_base_url: { type: string, description: "Either https://image.tmdb.org/t/p or /api/v1/images (proxy mode). URL = base + '/' + size + path." }
        poster_sizes: { type: array, items: { type: string } }
        backdrop_sizes: { type: array, items: { type: string } }
        profile_sizes: { type: array, items: { type: string } }
        still_sizes: { type: array, items: { type: string } }
        attribution: { type: string, description: "This product uses the TMDB API but is not endorsed or certified by TMDB." }
        region: { type: string }
        available: { type: boolean, description: "False when TMDB is not configured; clients show an explanatory empty state." }

    # ------------------------------------------------------------ realtime (Phase 3)
    CommandType:
      type: string
      enum: [media.open, media.play, media.pause, media.resume, media.stop, media.seek, media.next_episode, media.select_source, playback.set_audio, playback.set_subtitles, playback.set_volume, device.show_message, device.request_state, iptv.play, video.play]
    CommandErrorCode:
      type: string
      description: |
        device_offline, timeout (no ack in time), forbidden (no access to the TV),
        bad_message, bad_payload (failed server-side validation), unsupported (the
        TV doesn't implement it yet), busy_playing (TV is playing something; resend
        with force:true after the user confirms), not_found (media unknown),
        failed (TV-side error).
      enum: [device_offline, timeout, forbidden, bad_message, bad_payload, unsupported, busy_playing, not_found, failed]
    CommandRequest:
      type: object
      required: [type]
      properties:
        id: { type: string, maxLength: 64, description: "Client-chosen idempotency id; generated by the server when omitted." }
        type: { $ref: "#/components/schemas/CommandType" }
        payload: { description: "Typed per command; see the *Payload schemas." }
    CommandAck:
      type: object
      required: [id, ok]
      properties:
        id: { type: string }
        ok: { type: boolean }
        error: { $ref: "#/components/schemas/CommandErrorCode" }
        result: { description: "Command-specific result, e.g. the TV's new DeviceState." }
    CommandSender:
      type: object
      description: Added by the server to every command forwarded to a TV.
      required: [user_id, username, display_name]
      properties:
        user_id: { type: string, format: uuid }
        username: { type: string }
        display_name: { type: string }
    MediaOpenPayload:
      type: object
      description: "media.open — show the title's details screen on the TV."
      required: [media_id]
      properties:
        media_id: { type: string, format: uuid }
        season_number: { type: integer, minimum: 0, description: "Series: preselect this season." }
        episode_number: { type: integer, minimum: 1, description: "Series: focus this episode (requires season_number)." }
        force: { type: boolean, description: "Interrupt current playback (only after the user confirmed a busy_playing ack)." }
    MediaPlayPayload:
      type: object
      description: "media.play — start playback (Phase 4)."
      required: [media_id]
      properties:
        media_id: { type: string, format: uuid }
        episode_id: { type: string, format: uuid }
        source_id: { type: string, maxLength: 128, description: "PlaybackSource.id (uuid) prepared elsewhere. Omitted → the TV prepares one itself (release_id, else its own best release)." }
        release_id: { type: string, maxLength: 128, description: "Release.id (or an online variant id) chosen on the phone: the TV creates the source itself (POST /playback/sources) on its loading screen. Omitted (and no source_id) → the TV searches and ranks releases for itself." }
        quality: { type: integer, minimum: 1, maximum: 4320, description: "Online variants: the wanted quality for release_id." }
        position_seconds: { type: number, minimum: 0 }
        force: { type: boolean }
        player: { $ref: "#/components/schemas/PlayerKind" }
    SeekPayload:
      type: object
      description: "media.seek"
      required: [position_seconds]
      properties:
        position_seconds: { type: number, minimum: 0 }
    SelectSourcePayload:
      type: object
      description: "media.select_source"
      required: [source_id]
      properties:
        source_id: { type: string, maxLength: 128 }
    SetTrackPayload:
      type: object
      description: "playback.set_audio / playback.set_subtitles (track_id null = subtitles off)."
      required: [track_id]
      properties:
        track_id: { type: [string, "null"], maxLength: 64 }
    SetVolumePayload:
      type: object
      description: |
        playback.set_volume — the TV's sound level, at least one field. `volume`
        sets it (wins over `delta`); `delta` steps it (an off-grid level snaps
        to the step: 55 % + 0.1 → 60 %); `muted` mutes/unmutes (a volume change
        without `muted` unmutes). The TV changes its real (system) volume when
        it can (Samsung Tizen with the tv.audio privilege), else Cineko's own
        player volume (0–100 % of the TV's level, saved per TV); works with
        nothing playing too. The ack's result is the new DeviceState.
      minProperties: 1
      properties:
        volume: { type: number, minimum: 0, maximum: 1 }
        delta: { type: number, minimum: -1, maximum: 1 }
        muted: { type: boolean }
    ShowMessagePayload:
      type: object
      description: "device.show_message"
      required: [text]
      properties:
        text: { type: string, minLength: 1, maxLength: 200 }
    PlayerKind:
      type: string
      description: |
        Which player opens the stream (like Lampa's player choice):
        builtin = Cineko's HTML5 player; msx = Media Station X's native player
        (via the Cineko MSX bridge plugin; plays MKV/HEVC/AC3 that TV browsers
        often can't); external = hand off to another app (Android intents:
        VLC, MX Player, system chooser); omitted = the TV's default.
      enum: [builtin, msx, external]
    PlaybackState:
      type: object
      description: Filled in by the TV from Phase 4 on.
      required: [media_id, title, position_seconds, duration_seconds, paused, buffering]
      properties:
        media_id: { type: string, format: uuid }
        episode_id: { type: [string, "null"], format: uuid }
        title: { type: string }
        episode_label: { type: [string, "null"], description: "e.g. S01E02 · Episode name" }
        source_id: { type: [string, "null"] }
        position_seconds: { type: number }
        duration_seconds: { type: [number, "null"] }
        paused: { type: boolean }
        buffering: { type: boolean }
        volume: { type: [number, "null"], minimum: 0, maximum: 1 }
        audio_tracks: { type: array, items: { $ref: "#/components/schemas/Track" } }
        subtitle_tracks: { type: array, items: { $ref: "#/components/schemas/Track" } }
        audio_track_id: { type: [string, "null"] }
        subtitle_track_id: { type: [string, "null"] }
        loading: { oneOf: [{ $ref: "#/components/schemas/PlaybackLoading" }, { type: "null" }], description: "Set while the TV's loading screen shows (no picture yet) or the player rebuffers. Optional." }
    PlaybackLoading:
      type: object
      description: |
        What the TV's loading screen shows, for phones following a media.play:
        the stage, the progress and the live torrent numbers (null when
        unknown, e.g. before a source exists or for online sources).
      required: [stage, progress]
      properties:
        stage: { type: string, enum: [resolving, searching, creating, metadata, preloading, starting, rebuffering] }
        progress: { type: number, minimum: 0, maximum: 1, description: "0..1 (the loading screen's percentage; the rebuffer target while rebuffering)." }
        release: { type: [string, "null"], description: "Short label of the release being loaded («1080p · BDRip · 14,2 ГБ»)." }
        peers: { type: [integer, "null"] }
        seeders: { type: [integer, "null"] }
        download_speed_bps: { type: [number, "null"] }
        preloaded_bytes: { type: [integer, "null"] }
    VideoPlaybackState:
      type: object
      description: The YouTube video the TV plays (DeviceState.video).
      required: [video_id, title, channel_id, channel_name, thumbnail, position_seconds, duration_seconds, paused, buffering, quality, qualities, error]
      properties:
        video_id: { type: string, pattern: "^[A-Za-z0-9_-]{11}$" }
        title: { type: [string, "null"] }
        channel_id: { type: [string, "null"] }
        channel_name: { type: [string, "null"] }
        thumbnail: { type: [string, "null"], description: "Same-origin /api/v1/video/thumbs/… path (320×180)." }
        position_seconds: { type: number }
        duration_seconds: { type: [number, "null"] }
        paused: { type: boolean }
        buffering: { type: boolean, description: "Loading the stream or waiting for data." }
        quality: { type: [integer, "null"], description: "The height cap in effect (480/720/1080)." }
        qualities: { type: array, items: { type: integer }, description: "Heights the video offers (descending)." }
        volume: { type: [number, "null"], minimum: 0, maximum: 1 }
        error: { type: [string, "null"], enum: [unavailable, live, unplayable, failed, null], description: "Set when the TV couldn't play it." }
        audio_tracks: { type: array, items: { $ref: "#/components/schemas/Track" }, description: "Audio languages of an auto-dubbed video (id = VideoAudioTrack.id; label in the TV's language). Switch with playback.set_audio. Optional; empty for one track." }
        audio_track_id: { type: [string, "null"], description: "The audio track playing. Optional." }
    VideoAudioTrack:
      type: object
      required: [id, language, original]
      properties:
        id: { type: string, description: "The language as YouTube tags it (ru, en, pt-br); pass as audio." }
        language: { type: string }
        original: { type: boolean, description: "The video's own audio (not a dub)." }
    Track:
      type: object
      required: [id, label]
      properties:
        id: { type: string }
        label: { type: string }
        language: { type: [string, "null"] }
    DeviceState:
      type: object
      description: |
        What the TV is showing, reported by the TV on every change and after
        each reconnect. Relayed to controllers as `device.state` events.
      required: [screen, profile_id, media_id, playback]
      properties:
        screen: { type: string, enum: [boot, offline, pairing, token, profiles, home, search, browse, details, player] }
        profile_id: { type: [string, "null"], format: uuid }
        profile_name: { type: [string, "null"] }
        media_id: { type: [string, "null"], format: uuid }
        kind: { oneOf: [{ $ref: "#/components/schemas/MediaKind" }, { type: "null" }] }
        title: { type: [string, "null"], description: "Title of media_id, for display without another request." }
        poster_path: { type: [string, "null"] }
        season_number: { type: [integer, "null"] }
        playback: { oneOf: [{ $ref: "#/components/schemas/PlaybackState" }, { type: "null" }] }
        player_error: { type: [string, "null"], maxLength: 64, description: "screen = player showing a failure (preparing failed / the TV can't play it): the error code (no_releases, no_metadata, timeout, unplayable…). Optional." }
        live:
          description: "IPTV: the live channel on screen (screen = player, media_id/playback null)."
          oneOf:
            - type: object
              required: [channel_id, name, number]
              properties:
                channel_id: { type: string, format: uuid }
                name: { type: string }
                number: { type: integer }
                programme: { type: [string, "null"] }
                paused: { type: boolean, description: "Paused with media.pause (media.resume continues)." }
            - type: "null"
        video:
          description: "«Видео»: the YouTube video on screen (screen = player, media_id/playback null). Controlled with media.pause / media.resume / media.seek / media.stop / media.next_episode (the first playable related video), playback.set_audio (video.audio_tracks); video.play with the same video_id and a quality switches the quality in place."
          oneOf:
            - $ref: "#/components/schemas/VideoPlaybackState"
            - type: "null"
        players: { type: array, items: { $ref: "#/components/schemas/PlayerKind" }, description: "Players available on this TV (built-in is always present)." }
        default_player: { oneOf: [{ $ref: "#/components/schemas/PlayerKind" }, { type: "null" }], description: "The TV's preferred player; null = ask every time." }
        volume: { type: number, minimum: 0, maximum: 1, description: "The TV's sound level (playback.set_volume): the system volume when volume_source = system, else Cineko's own player volume." }
        muted: { type: boolean }
        volume_source: { type: string, enum: [system, app], description: "system = the TV's real volume (Tizen TV Audio Control API); app = Cineko's media volume." }
        system_volume: { type: string, maxLength: 64, description: "What the TV found probing its system volume API: ok, absent, denied (no privilege) or error:<name>." }

    # ------------------------------------------------------------ releases & playback (Phase 4)
    Release:
      type: object
      description: A normalized torrent search result (Prowlarr, Jacred). Retrieval links stay on the server.
      required: [id, title, indexer, size_bytes, seeders, leechers, published_at, info_hash, resolution, video_codec, hdr, audio_codecs, languages, voiceovers, release_group, source_quality, year, seasons, episodes, is_season_pack, confidence, score, reasons, warnings]
      properties:
        provider: { $ref: "#/components/schemas/ProviderRef", description: "Torrent source that found it (the first one when several returned the same info hash). Always sent by servers with sources support." }
        id: { type: string, description: "Opaque stable id (info hash when known)." }
        title: { type: string }
        indexer: { type: string }
        size_bytes: { type: integer }
        seeders: { type: integer }
        leechers: { type: [integer, "null"] }
        published_at: { type: [string, "null"], format: date-time }
        info_hash: { type: [string, "null"] }
        resolution: { type: [string, "null"], enum: ["2160p", "1080p", "720p", "576p", "480p", null] }
        video_codec: { type: [string, "null"], enum: [hevc, h264, av1, mpeg2, xvid, null] }
        hdr: { type: [string, "null"], enum: [hdr10, hdr10plus, dolby_vision, hlg, null] }
        audio_codecs: { type: array, items: { type: string }, description: "aac, ac3, eac3, dts, truehd, flac, mp3…" }
        languages: { type: array, items: { type: string }, description: "ISO 639-1 audio languages detected (e.g. ru, en, uk)." }
        voiceovers: { type: array, items: { $ref: "#/components/schemas/Voiceover" }, description: "Dubs/voice-overs named in the title (e.g. MVO LostFilm), dubs first." }
        release_group: { type: [string, "null"] }
        source_quality: { type: [string, "null"], enum: [remux, bluray, bdrip, web-dl, webrip, hdtv, dvd, cam, telesync, screener, null] }
        year: { type: [integer, "null"] }
        seasons: { type: array, items: { type: integer } }
        episodes: { type: array, items: { type: integer } }
        is_season_pack: { type: boolean }
        confidence: { type: number, minimum: 0, maximum: 1, description: "How sure we are this is the requested title/episode." }
        score: { type: number, description: "Ranking score (confidence × quality × preferences × availability)." }
        reasons: { type: array, items: { type: string }, description: "Machine-readable match reasons, e.g. title_exact, year_match, imdb_match, episode_match." }
        warnings: { type: array, items: { type: string }, description: "e.g. low_seeders, cam_quality, over_size_limit, no_preferred_language, likely_unplayable_codec, disc_image, 3d, uncertain_match; with a device profile also too_heavy_for_device, over_device_resolution, codec_unsupported, codec_unknown (an old-style rip naming neither codec nor resolution: likely XviD), audio_needs_conversion, audio_unsupported, hdr_avoided, may_stutter (decodes here but not smoothly)." }
        est_bitrate_bps: { type: [number, "null"], description: "Estimated average bitrate (size × 8 / runtime; per episode for packs), bits/s. null when the runtime is unknown." }
    Voiceover:
      type: object
      required: [kind, studio, language]
      properties:
        kind: { type: [string, "null"], enum: [dub, mvo, dvo, avo, vo, original, null], description: "dub = full dub; mvo/dvo = multi/two-voice; avo = author (single famous translator); vo = single-voice/amateur." }
        studio: { type: [string, "null"], description: "Studio or translator, e.g. LostFilm, HDRezka Studio, Кубик в Кубе, Гаврилов." }
        language: { type: string, description: "ISO 639-1, or 'orig' when only 'original track' is stated." }
    ReleaseList:
      type: object
      required: [items, searched_at, cached, indexer_errors]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Release" } }
        searched_at: { type: string, format: date-time }
        cached: { type: boolean }
        indexer_errors: { type: array, items: { type: object, required: [indexer, message], properties: { indexer: { type: string }, message: { type: string } } } }
        device: { oneOf: [{ $ref: "#/components/schemas/ReleaseDeviceFit" }, { type: "null" }], description: "The playback profile applied to the ranking; null when none." }
    TorrentFile:
      type: object
      required: [index, path, size_bytes, is_video]
      properties:
        index: { type: integer }
        path: { type: string }
        size_bytes: { type: integer }
        is_video: { type: boolean }
        season: { type: [integer, "null"] }
        episode: { type: [integer, "null"] }
    MediaStream:
      type: object
      required: [index, codec, language, title]
      properties:
        index: { type: integer }
        codec: { type: string }
        language: { type: [string, "null"] }
        title: { type: [string, "null"] }
        channels: { type: [integer, "null"] }
        default: { type: boolean }
    MediaInfo:
      type: object
      description: From TorrServer's ffprobe when available.
      required: [container, video_codec, width, height, duration_seconds, audio, subtitles]
      properties:
        container: { type: [string, "null"] }
        video_codec: { type: [string, "null"] }
        width: { type: [integer, "null"] }
        height: { type: [integer, "null"] }
        duration_seconds: { type: [number, "null"] }
        audio: { type: array, items: { $ref: "#/components/schemas/MediaStream" } }
        subtitles: { type: array, items: { $ref: "#/components/schemas/MediaStream" } }
        video_profile: { type: [string, "null"], description: "ffprobe's video profile: High, High 10, Main 10, High 4:2:2… Absent on rows probed before it existed (re-probed lazily)." }
        pix_fmt: { type: [string, "null"], description: "yuv420p, yuv420p10le…" }
        bit_depth: { type: [integer, "null"], description: "Video bit depth (from pix_fmt / bits_per_raw_sample / the profile name)." }
        video_level: { type: [integer, "null"], description: "ffprobe's level (H.264: 41 = 4.1; HEVC: 30 × level, 150 = 5.0)." }
        interlaced: { type: [boolean, "null"], description: "From field_order, when known." }
        video_codec_string: { type: [string, "null"], description: "RFC 6381 codec string (avc1.6e0028), when ffprobe prints one." }
        probe_version: { type: integer, description: "2+ = includes the video detail fields; 3+ = the chapters." }
        chapters:
          type: array
          description: "The file's titled chapters (at most 64 kept). Opening / «Заставка» / Credits / «Титры» ones become skip markers."
          items:
            type: object
            required: [start_seconds, end_seconds, title]
            properties:
              start_seconds: { type: number }
              end_seconds: { type: number }
              title: { type: string }
    PlaybackSource:
      type: object
      required: [id, media_id, episode_id, release, status, error, file, stream_url, stream_expires_at, mime_type, media_info, torrent, created_at]
      properties:
        id: { type: string, format: uuid }
        media_id: { type: [string, "null"], format: uuid, description: "null for kinds iptv and video." }
        episode_id: { type: [string, "null"], format: uuid }
        release: { $ref: "#/components/schemas/Release" }
        status: { type: string, enum: [preparing, ready, error] }
        error: { type: [string, "null"], description: "no_metadata (no peers), no_matching_file, torrserver_unavailable, release_unavailable…" }
        file: { oneOf: [{ $ref: "#/components/schemas/TorrentFile" }, { type: "null" }] }
        stream_url: { type: [string, "null"], description: "Relative URL (/api/v1/stream/<token>) usable as <video src>; refreshed on every GET." }
        stream_expires_at: { type: [string, "null"], format: date-time }
        mime_type: { type: [string, "null"], description: "video/mp4, video/x-matroska, video/webm, video/mp2t…" }
        media_info: { oneOf: [{ $ref: "#/components/schemas/MediaInfo" }, { type: "null" }] }
        torrent:
          oneOf:
            - type: object
              required: [peers, seeders, download_speed_bps, preloaded_bytes]
              properties:
                peers: { type: integer, description: "Connected (active) peers." }
                seeders: { type: integer, description: "Connected seeders." }
                download_speed_bps: { type: number }
                preloaded_bytes: { type: integer }
                total_peers: { type: integer, description: "Peers known from trackers/DHT (connected or not). Optional." }
                preload_size: { type: integer, description: "TorrServer's preload target in bytes (0 = unknown). Optional." }
                stage: { type: string, enum: [metadata, preloading, working, idle], description: "TorrServer's torrent state: metadata = fetching the file list, preloading = filling the preload buffer, working = streaming, idle = added / closed. Optional." }
            - type: "null"
        created_at: { type: string, format: date-time }
        kind: { type: string, enum: [torrent, online, iptv, video], description: "Absent or torrent for torrent sources. online: no torrent/file/media_info; /files → 404. iptv: a live channel (see live). video: a YouTube video via Invidious (see video_id)." }
        live: { type: boolean, description: "IPTV: a live stream (sliding HLS window or endless TS): no seek bar beyond the live window, no duration, no progress reports." }
        channel_id: { type: [string, "null"], format: uuid, description: "IPTV: the channel." }
        provider: { oneOf: [{ $ref: "#/components/schemas/ProviderRef" }, { type: "null" }] }
        format: { type: [string, "null"], enum: [mp4, hls, ts, null], description: "Online: how to play stream_url (hls needs hls.js outside Safari/TVs). ts: IPTV MPEG-TS pass-through (TVs natively; browsers through mpegts.js). Torrent: null." }
        video_codec: { type: [string, "null"], description: "IPTV: the video codec the last health check saw (h264, hevc, mpeg2), null if unknown." }
        audio_codec: { type: [string, "null"], description: "IPTV: the audio codec the last health check saw (aac, mp3, mp2, ac3, eac3), null if unknown. Browsers usually can't decode ac3/eac3, mpeg2 or hevc." }
        quality: { type: [integer, "null"], description: "Online: current quality." }
        qualities: { type: array, items: { type: integer }, description: "Online: switchable qualities (PATCH {quality}). Torrent: []." }
        subtitles: { type: array, items: { $ref: "#/components/schemas/Subtitle" }, description: "Online: external subtitle tracks (proxied VTT)." }
        markers:
          type: array
          items: { $ref: "#/components/schemas/SkipMarker" }
          description: |
            Intro / recap / credits ranges for «Пропустить заставку» and «Следующая серия» (live GET of a ready source only).
            Per kind the best source wins: the file's chapters, the online provider (Anilibria), TheIntroDB (by TMDB id),
            IntroDB (by IMDb id, series). Ranges are clamped to the media's duration when known; an ending of unknown
            length runs 15 minutes past its start (players clamp it to the duration). Omitted when none.
        duration_seconds: { type: [number, "null"], description: "Online: the provider's episode/film length when known (torrent sources report duration in media_info). Optional." }
        compat_url: { type: [string, "null"], description: "Torrent: browser compatibility stream (/api/v1/stream/<token>/compat.mp4; add ?audio=&start=); null when the server has no transcoder or for online sources. Subtitles: replace compat.mp4 with subs/<index>.vtt. Safari / iOS: compat.m3u8 (HLS) instead of compat.mp4." }
        compat_video: { type: boolean, description: "Torrent: the compat stream can re-encode this file's video to H.264 (add video=h264 to compat_url): an old codec (MPEG-4 Part 2 / XviD / DivX, MPEG-1/2, VC-1/WMV, H.263) at ≤ 1080p per media_info. false without media_info or transcoder. Optional (absent for other kinds)." }
        video_id: { type: string, description: "Video: the YouTube video id (kind video)." }
        fallback_url: { type: [string, "null"], description: "Video: progressive MP4 (360p) for engines without fMP4 HLS; null when YouTube has none." }
        position_seconds: { type: [number, "null"], description: "Video: the profile's resume position (unfinished videos)." }
        audio_tracks: { type: array, items: { $ref: "#/components/schemas/VideoAudioTrack" }, description: "Video: the audio languages of an auto-dubbed video (YouTube's order: VIDEO_LANG, the original, …); empty for one track. Switch with a new source ({audio: id}), continuing from the position." }
        audio_track: { type: [string, "null"], description: "Video: the audio_tracks id stream_url plays (null with one track)." }
        download: { oneOf: [{ $ref: "#/components/schemas/DownloadBrief" }, { type: "null" }], description: "Torrent: the server download of this file (docs «Server downloads»); when done, stream_url/compat_url read the server's copy instead of TorrServer. null when never requested. Optional." }

    # ------------------------------------------------------------ sources
    SourceKind:
      type: string
      enum: [torrent, online, anime]
      description: "torrent = results appear in /media/{id}/releases; online/anime = /media/{id}/online (UI group «Онлайн» / «Аниме»)."
    ProviderRef:
      type: object
      description: Which source found a release / variant (chip in the UI).
      required: [id, name, kind]
      properties:
        id: { type: string, examples: [prowlarr, jacred, anilibria] }
        name: { type: string, examples: [Prowlarr, Jacred, AniLiberty] }
        kind: { $ref: "#/components/schemas/SourceKind" }
    SourceInfo:
      type: object
      required: [id, kind, name, needs_credentials, configured, enabled_by_admin, healthy]
      properties:
        id: { type: string, pattern: "^[a-z0-9:_-]{1,64}$" }
        kind: { $ref: "#/components/schemas/SourceKind" }
        name: { type: string }
        needs_credentials: { type: boolean, description: "Needs a URL/key/account to work (show «нужен аккаунт» when not configured)." }
        configured: { type: boolean }
        enabled_by_admin: { type: boolean, description: "false = switched off for everyone (show «отключён администратором»)." }
        healthy: { type: [boolean, "null"], description: "null = not checked yet." }
        last_error: { type: string }
        checked_at: { type: string, format: date-time }
    SourceItem:
      allOf:
        - { $ref: "#/components/schemas/SourceInfo" }
        - type: object
          required: [enabled, available]
          properties:
            enabled: { type: boolean, description: "The profile's choice includes this source (always true for \"all\")." }
            available: { type: boolean, description: "enabled_by_admin && configured." }
    AdminSource:
      allOf:
        - { $ref: "#/components/schemas/SourceInfo" }
        - type: object
          required: [base_url, has_credentials, updated_at]
          properties:
            base_url: { type: string, description: "Admin override; empty = default from env." }
            has_credentials: { type: boolean }
            updated_at: { type: [string, "null"], format: date-time }
    SourcesEnabled:
      description: '"all" (default: every available source, including ones added later) or an explicit list of source ids.'
      oneOf:
        - { type: string, const: all }
        - { type: array, maxItems: 50, items: { type: string, pattern: "^[a-z0-9:_-]{1,64}$" } }
    SourcesSetting:
      type: object
      required: [enabled]
      properties:
        enabled: { $ref: "#/components/schemas/SourcesEnabled" }
    OnlineVariant:
      type: object
      description: One playable online choice. Server keeps the provider-private reference; play it with POST /playback/sources {release_id = id}.
      required: [id, provider, voice, voiceover, title, max_quality, qualities, format, subtitle_langs, season, episode, episodes, preferred, score]
      properties:
        id: { type: string, description: "Opaque, starts with \"o\"; valid 24 h after it was listed." }
        provider: { $ref: "#/components/schemas/ProviderRef" }
        voice: { type: string, description: "Voice label as the source names it (e.g. AniLiberty, Дубляж, LostFilm)." }
        voiceover: { $ref: "#/components/schemas/Voiceover" }
        title: { type: [string, "null"], description: "Episode/release name when the source has one." }
        max_quality: { type: [integer, "null"], description: "Vertical resolution, e.g. 1080." }
        qualities: { type: array, items: { type: integer } }
        format: { type: string, enum: [mp4, hls] }
        subtitle_langs: { type: array, items: { type: string } }
        season: { type: [integer, "null"] }
        episode: { type: [integer, "null"] }
        episodes: { type: array, items: { type: integer }, description: "Season-level variant (lookup without episode): episode numbers available in this voice." }
        preferred: { type: boolean, description: "The auto-pick (only the first item)." }
        score: { type: number }
    OnlineProviderStatus:
      type: object
      required: [id, name, kind, status, count, error, cached]
      properties:
        id: { type: string }
        name: { type: string }
        kind: { $ref: "#/components/schemas/SourceKind" }
        status: { type: string, enum: [ok, empty, error, timeout] }
        count: { type: integer }
        error: { type: [string, "null"] }
        cached: { type: boolean }
    OnlineList:
      type: object
      required: [items, providers, searched_at, cached]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/OnlineVariant" } }
        providers: { type: array, items: { $ref: "#/components/schemas/OnlineProviderStatus" } }
        searched_at: { type: string, format: date-time }
        cached: { type: boolean, description: "Every source answered from cache." }
    SkipMarker:
      type: object
      required: [kind, start_seconds, end_seconds]
      properties:
        kind: { type: string, enum: [opening, recap, ending], description: "opening = the intro / title sequence; recap = «Ранее в сериале»; ending = the end credits (with a next-episode preview)." }
        start_seconds: { type: number }
        end_seconds: { type: number }
        source: { type: string, enum: [chapters, provider, theintrodb, introdb], description: "Where the range came from. chapters is exact for this file; the databases time the original release (a dub's logo can shift it by seconds)." }
    Subtitle:
      type: object
      required: [url, lang, label]
      properties:
        url: { type: string, description: "Relative, proxied through the API." }
        lang: { type: [string, "null"] }
        label: { type: [string, "null"] }

    # ------------------------------------------------------------ watch sync, lists, settings (Phase 5)
    DeviceClass:
      type: string
      enum: [desktop, mobile]
      description: "A browser's settings class: desktop = «Компьютер», mobile = «Телефон» (decided once per browser, changeable in Settings)."
    TvDeviceSettings:
      type: object
      description: "A TV's own options (every profile). Unset keys are absent: the TV seeds them once from its local values; clients show the defaults (screensaver sleep, ui_sounds false, startup_intro true, calm_motion false, language: the TV's, health_report true, slow_hint false, show_prebuffer false, speedtest true)."
      properties:
        screensaver: { type: string, enum: [sleep, dvd, "off"] }
        ui_sounds: { type: boolean }
        startup_intro: { type: boolean }
        calm_motion: { type: boolean, description: "Calm background motion of «Каркас» / «Матрица»." }
        language: { type: string, enum: [ru, en, kk] }
        health_report: { type: boolean, description: "«Отправлять состояние ТВ»." }
        slow_hint: { type: boolean }
        show_prebuffer: { type: boolean }
        speedtest: { type: boolean, description: "Background speed test." }
    TvSettingsProfile:
      type: object
      required: [id, name, avatar, color, own]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        avatar: { type: string }
        color: { type: string }
        own: { type: boolean, description: "The caller's own profile." }
    TvSettings:
      type: object
      required: [device_id, device, updated_at, profiles, active_profile_id, profile_id, effective, overrides, layered_keys]
      properties:
        device_id: { type: string, format: uuid }
        device: { $ref: "#/components/schemas/TvDeviceSettings" }
        updated_at: { type: [string, "null"], format: date-time, description: "Last change of `device`." }
        profiles:
          type: array
          description: "The TV's profiles the caller may edit there."
          items: { $ref: "#/components/schemas/TvSettingsProfile" }
        active_profile_id: { type: [string, "null"], format: uuid, description: "The profile the TV shows now (live state; null offline)." }
        profile_id: { type: [string, "null"], format: uuid, description: "The profile `effective` / `overrides` are for (null: no profiles)." }
        effective:
          description: "The profile's settings on this TV (base → the TV's layer)."
          oneOf: [{ $ref: "#/components/schemas/ProfileSettings" }, { type: "null" }]
        overrides:
          description: "Only the keys set on this TV (the rest follow the profile). A partial ProfileSettings."
          oneOf: [{ $ref: "#/components/schemas/ProfileSettings" }, { type: "null" }]
        layered_keys:
          type: array
          description: "Settings that live per device class / per TV (look & feel, autoplay, countdown, skip); all others are per profile."
          items: { type: string }
    TvSettingsPatch:
      type: object
      properties:
        device: { $ref: "#/components/schemas/TvDeviceSettings" }
        reset_device: { type: array, items: { type: string, enum: [screensaver, ui_sounds, startup_intro, calm_motion, language, health_report, slow_hint, show_prebuffer, speedtest] } }
        profile_id: { type: string, format: uuid, description: "Required with `profile` / `reset`." }
        profile: { $ref: "#/components/schemas/ProfileSettings", description: "Layered keys only (others → 422)." }
        reset: { type: array, items: { type: string }, description: "Layered keys to remove from the TV's layer." }
    ProfileSettings:
      type: object
      properties:
        theme: { type: string, enum: [system, dark, light], default: system, description: "Colour mode. Only the kinozal design has a light variant; every other design is always dark." }
        design: { type: string, enum: [kinozal, terminal, projector, wireframe, cyberpunk, deco, retro80, retro90, popart, constructivism, matrix, stickerbook, pocketpet, odyssey, mult, tarkovsky, silent, anderson, noir, vague, western, redroom], default: kinozal, description: "Visual direction (Cineko-directions, Oct 2026): kinozal = «Кинозал» (Lampa evolution, lime «Сигнал», recommended); terminal = «Терминал» (HUD, orange, mono labels); projector = «Проектор» (immersive artwork, teal); wireframe = «Каркас» (synthwave neon grid, on the projector layout); cyberpunk = «Киберпанк» (neon HUD, clipped corners, on the terminal layout); deco = «Ар-деко» (gold-on-black movie palace, on the kinozal layout); retro80 = «Ретро 80-е» (VHS/arcade sunset chrome, on the kinozal layout); retro90 = «Ретро 90-е» (Windows 95 bevels on a teal desktop, on the terminal layout); popart = «Поп-арт» (comic Ben-Day dots, black outlines and hard shadows, on the projector layout); constructivism = «Конструктивизм» (1920s–30s poster graphics, red/black/cream diagonals, on the terminal layout); matrix = «Матрица» (green phosphor digital rain, glowing mono type, on the terminal layout); stickerbook = «Стикербук» (die-cut sticker posters with white borders, washi tape, tilted tiles, on the kinozal layout); pocketpet = «Тамагочи» (a pastel toy shell around an LCD screen, Cineko as a pixel pet, on the terminal layout); odyssey = «Одиссея» (late-1960s space-age sci-fi: white spaceship corridors, symmetry, dark ink on station white, one red light as the focus ring, on the projector layout, mult, tarkovsky], on the terminal layout); mult = «Мультфильм» (classic studio animation: gouache backgrounds, paper cut-outs, soft fog; a light palette, on the kinozal layout); tarkovsky = «Созерцание» (rain, water, slow drifts, sepia that turns to colour on focus; dim, on the kinozal layout). Only kinozal has a light variant (pocketpet and mult are light by design); silent = «Немое кино» (silent-film homage: black and white, film grain, intertitle cards with an art-nouveau frame, an iris-in focus, on the projector layout); anderson = «Симметрия» (a symmetric pastel homage: pink, mustard and mint, centred compositions, chapter cards per section, on the projector layout); noir = «Нуар» (1940s film noir homage: monochrome, light through window blinds, rain on the glass, typewriter type, on the terminal layout); vague = «Новая волна» (French New Wave homage: red/blue/white word cards, handwritten notes, jump-cut screen changes, on the terminal layout); western = «Вестерн» (a spaghetti-western homage: sun-bleached desert, wanted-poster cards, letterboxing, on the kinozal layout); redroom = «Красная комната» (a surreal-TV homage: red curtains, a zigzag floor, titles that sometimes play backwards, on the projector layout). Only kinozal has a light variant." }
        design_surprise: { type: string, enum: ["off", day, week], default: "off", description: "«Сюрприз»: off = always `design`; day / week = the apps show a design picked from design_favorites per local calendar day / ISO week (deterministic per profile, computed client-side — packages/ui surprise.ts; never the same design two periods in a row). `design` stays the chosen design and is used when there are fewer than 2 candidates." }
        design_favorites:
          type: array
          items: { type: string, enum: [kinozal, terminal, projector, wireframe, cyberpunk, deco, retro80, retro90, popart, constructivism, matrix, stickerbook, pocketpet, odyssey, mult, tarkovsky, silent, anderson, noir, vague, western, redroom] }
          default: []
          description: "«Избранные оформления»: the designs «Сюрприз» picks from (deduped; empty = all designs). Unknown ids → 422."
        hide_anime: { type: boolean, default: false, description: "Hide Japanese animation (TMDB genre Animation + original language ja) everywhere in the catalog." }
        hide_watched: { type: boolean, default: false, description: "Default for hiding completed titles in catalog lists." }
        autoplay_next_episode: { type: boolean, default: true }
        autoplay_countdown: { type: boolean, default: true, description: "«Отсчёт перед следующим»: the next episode (autoplay_next_episode) and the next YouTube video (video_autoplay) wait on a card with a countdown first; false starts them at once." }
        skip_segments: { type: string, enum: [button, auto, "off"], default: button, description: "«Заставки и титры» (SkipMarker): button = show «Пропустить заставку» / «Пропустить пересказ» during them and «Следующая серия» at a series' credits; auto = skip intros and recaps by themselves (with «Вернуть» for a few seconds) and start the next-episode countdown at the credits; off = never." }
        spoiler_free_episodes: { type: boolean, default: false, description: "Blur stills/overviews of unwatched episodes." }
        poster_rating: { type: string, enum: [kp, tmdb, imdb, "off"], default: kp, description: "Which rating the small badge in the top-right corner of posters shows (falls back kp → tmdb when unknown)." }
        onboarding_completed: { type: boolean, default: false, description: "Set to true when the profile finished (or skipped) the first-run setup guide." }
        sources:
          allOf: [{ $ref: "#/components/schemas/SourcesSetting" }]
          description: 'Which sources this profile searches (GET /sources lists them). Default {"enabled": "all"}. Unknown ids → 422. Replaced as a whole on PUT.' 
        loading_style:
          type: string
          enum: [popcorn, fill_title, poster_reveal, film_reel, minimal, marty, marty_popcorn, matrix, paws, aquarium, speed88, odyssey, balloons, catch, water_glass, poster_dig, chocolate_box, coffee_cup, honey_pot, hyperjump, ghost_meter, target_scan, docking, claw_machine, surprise, match]
          default: popcorn
          description: |
            Animation shown while a stream is first preparing/preloading (later
            re-buffering only shows a small looping spinner):
            popcorn = the «Попкорн» mascot (PopcornLoader in @martytv/ui): the bucket's heap of kernels grows with progress, kernels pop out, happy hop at 100%;
            fill_title = backdrop + poster, the title fills with the accent colour as loading progresses;
            poster_reveal = a blurred greyscale poster sharpens into full colour with progress;
            film_reel = film-strip frames light up one by one along a running reel;
            minimal = backdrop with a thin progress line and status text;
            marty = Cineko the mascot's loading loop with a progress bar; he cheers at 100%;
            marty_popcorn = the same with Cineko munching popcorn while it loads;
            matrix = «Матрица»: «> Загрузка конструкта…», the percentage counting up in green and a block bar over the digital rain (also what the matrix design always shows);
            paws = «Следы лапок»: paw prints walk across the bottom, one per 5 %; the last one taps impatiently when progress stalls;
            aquarium = «Аквариум»: pieces fall as little fish into Cineko's bowl, his eyes follow the newest; a full bowl turns into ▶;
            speed88 = «Назад в будущее»: a speedometer needle / digital readout climbs to 88 mph; at 88 fire trails shoot off as the film starts;
            odyssey = «Космическая одиссея»: a dark monolith rises as a moon and a sun line up; at 100 % one quiet note (only with the device's interface sounds on);
            balloons = «Вверх»: balloons get tied to a little house one by one; at 100 % it floats off;
            catch = «Лови!»: a waiting game in an LCD-handheld look — Cineko catches pieces rolling down four chutes, the TV remote's arrows move the basket, a miss cracks (a soft sound only with interface sounds on); the big number is the load's percentage, playback never waits for it;
            water_glass = «Стакан воды»: ripples in a glass of water grow with the buffer; one big ripple at 100%;
            poster_dig = «Подкоп»: the title's poster on a wall, a little hammer digs behind it; at 100% the poster tears open;
            chocolate_box = «Коробка конфет»: one chocolate eaten every ~8%, each with a fact about the title (cached facts, else Details lines);
            coffee_cup = «Чашка кофе»: a cup fills with coffee;
            honey_pot = «Горшочек мёда»: bees (one per few torrent peers) fill a honey pot; a caption when progress stalls;
            hyperjump = «Гиперпрыжок»: drifting stars stretch into lines at 100%;
            ghost_meter = «Призракометр»: a gauge's needle and lights rise; a short beep at 100% (only with the device's interface sounds on);
            target_scan = «Сканер цели»: a red scanning HUD with the percentage; the runtime at 100%;
            docking = «Стыковка»: a craft docks with a spinning ring;
            claw_machine = «Кран-машина»: a claw picks the title's poster from a pile of toys (slips and retries when progress stalls);
            surprise = «Сюрприз»: a different one of the styles above for each load (random, never the same twice in a row; remembered per device), fixed for the whole load;
            match = «Под фильм»: the style that suits the title, from what the client already has (genres, kind, title and overview text): hackers / virtual reality → matrix, time travel → speed88, space → odyssey, cats / animals → paws, animation / family → balloons or aquarium, horror / thriller → minimal, comedy → popcorn, documentary / drama → film_reel or poster_reveal, else a stable pick per title; fixed for the whole load.
            A design with its own loader (matrix, constructivism) still shows that one for surprise and match.
        taste_note:
          type: string
          maxLength: 600
          default: ""
          description: |
            «О моих вкусах»: the viewer's own description of their tastes (trimmed, at most 600 characters; "" clears it).
            Sent to DeepSeek only as delimited data (`viewer_note`) in the AI collections and Ask AI prompts. A change
            marks the profile's AI collections stale and regenerates them in the background (at most once per 30 minutes).
        min_votes:
          type: integer
          enum: [0, 50, 100, 300, 1000, 5000]
          default: 100
          description: |
            «Минимум оценок у фильма»: TMDB vote-count floor for Explore tiles, Surprise Me's discover fallback and «Для вас»
            candidates. 100 keeps the tuned per-source floors; higher values raise every floor to at least this value;
            lower values scale them down proportionally. A change rebuilds the profile's rows.
        iptv_playlists:
          allOf: [{ $ref: "#/components/schemas/IptvPlaylistsSetting" }]
          description: 'Which IPTV playlists this profile shows («ТВ»). Default "all". Unknown ids → 422.'
        video_quality: { type: integer, enum: [480, 720, 1080], default: 720, description: "«Видео»: maximum YouTube playback height." }
        video_hide_shorts: { type: boolean, default: true, description: "«Видео»: hide YouTube Shorts (≤ 60 s or #shorts) from lists." }
        video_autoplay: { type: boolean, default: true, description: "«Видео»: when a video ends, play the next one after a 5 s card — the next part of its series («Часть 3» → «Часть 4», \"Episode 3\", \"#3\", S01E03…, same channel: related videos, then the channel's uploads), else a random related video (not a Short or live, unwatched first)." }
        seasonal_effects: { type: string, enum: ["on", calm, "off"], default: "off", description: "«Праздничные анимации»: seasonal/holiday decorations (snow at New Year, Maslenitsa suns…). on = animated; calm = still decorations; off = none (the default: users turn them on in Settings). The admin switch (GET /status seasonal_effects) turns them off for everyone." }
        hidden_tabs:
          type: array
          maxItems: 12
          items: { type: string, enum: [tv, video, explore, "new", history, ask, search, movies, series, surprise, mine, messages] }
          default: []
          description: "Navigation tabs this profile hides (Settings → «Вкладки меню»). Home and Settings are always shown. Unknown ids → 422."
        cozy_mode: { type: boolean, default: false, description: "«Уютный режим»: warm, dimmed colours everywhere plus the cozy_ambience on Home." }
        cozy_ambience: { type: string, enum: [rain, fireplace, "off"], default: fireplace, description: "«Уютный режим» ambience on Home: rain = soft rain on the glass; fireplace = ember glow with a few sparks; off = colours only. Hidden with prefers-reduced-motion (still glow) and while a video plays." }
        cozy_sound: { type: boolean, default: false, description: "«Уютный режим»: play the ambience quietly (synthesised in the browser with Web Audio; starts on the first click / key press, Home only, never during playback)." }
        poster_wobble: { type: boolean, default: true, description: "«Живые постеры»: posters tilt slightly toward the mouse cursor (web, fine pointers only) or bounce gently when focused (TV). prefers-reduced-motion turns it off." }
        share_with_family: { type: boolean, default: false, description: "«Делиться с семьёй» (opt-in): other profiles on this server see this profile's ratings, finished titles and favorites («Семья советует», family ratings on title pages). Never in-progress positions, the watchlist or notes." }
        show_family: { type: boolean, default: true, description: "«Показывать, что смотрят другие»: the «Семья советует» row on Home (GET /foryou/rows kind family) and family ratings on title pages." }
        show_curated: { type: boolean, default: true, description: "«Подборки» on Home: one curated list per day (GET /foryou/rows kind curated)." }
        film_theme: { type: boolean, default: false, description: "«Тема под фильм»: Details and the player's loading screen take a look matching the film (silent → black and white, Soviet animation → a soft painted palette, noir, 80s neon, anime…), classified on the client from MediaDetail. The menu and catalog keep the profile's design." }
    AdminAppearance:
      type: object
      required: [seasonal_effects]
      properties:
        seasonal_effects: { type: boolean }
    AdminPlayback:
      type: object
      required: [instant_play]
      properties:
        instant_play: { type: boolean, description: "«Мгновенный старт»: title pages warm the release Play would start (POST /playback/warm). Default true." }
    WarmResult:
      type: object
      required: [status, reason, expires_at]
      properties:
        status: { type: string, enum: [warming, skipped] }
        reason:
          type: [string, "null"]
          enum: [disabled, busy, limit, local, online, no_release, unavailable, null]
          description: "Skipped: switched off by the admin, the server is busy (streams / transcoding), the server's warm limit, already downloaded to the server, an online variant, an unknown release, no TorrServer / release search."
        expires_at: { type: [string, "null"], format: date-time, description: "Warming: Play takes the prepared source until then." }
    ImportJob:
      type: object
      required: [id, profile_id, source, status, overwrite, mark_watched, dry_run, total, processed, matched, rated, skipped, unmatched, error, created_at, started_at, finished_at]
      properties:
        id: { type: string, format: uuid }
        profile_id: { type: string, format: uuid }
        source: { type: string, enum: [kinopoisk] }
        status: { type: string, enum: [queued, running, done, failed] }
        overwrite: { type: boolean }
        mark_watched: { type: boolean }
        dry_run: { type: boolean }
        total: { type: integer, description: CSV lines. }
        processed: { type: integer, description: Lines handled so far (progress = processed / total). }
        matched: { type: integer, description: "Lines matched to a title (rated + skipped; in a dry run, every match)." }
        rated: { type: integer, description: Ratings written. }
        skipped: { type: integer, description: Matched but the profile already had a rating (overwrite off). }
        unmatched: { type: array, items: { $ref: "#/components/schemas/ImportUnmatched" } }
        error: { type: [string, "null"] }
        created_at: { type: string, format: date-time }
        started_at: { type: [string, "null"], format: date-time }
        finished_at: { type: [string, "null"], format: date-time }
    ImportUnmatched:
      type: object
      required: [kp_id, title, year, reason]
      properties:
        kp_id: { type: integer, description: 0 when the line had no valid id. }
        title: { type: string, description: Russian title, else the original one. }
        year: { type: [integer, "null"] }
        reason:
          type: string
          enum: [not_found, ambiguous, invalid_row, tmdb_error, kp_conflict]
          description: >-
            not_found = no TMDB title close enough in name and year; ambiguous = several equally good
            candidates; invalid_row = unusable CSV line; tmdb_error = TMDB kept failing;
            kp_conflict = the best title is already linked to another Kinopoisk id.
    MediaUserState:
      type: object
      required: [progress_percent, completed, in_watchlist, favorite, rating]
      properties:
        progress_percent: { type: [number, "null"], minimum: 0, maximum: 1, description: "Movie: resume progress. Series: share of aired episodes completed." }
        completed: { type: boolean }
        in_watchlist: { type: boolean }
        favorite: { type: boolean }
        rating: { type: [integer, "null"] }
        note:
          description: "The profile's private note on the title («Моя заметка»); null when none."
          oneOf: [{ $ref: "#/components/schemas/MediaNote" }, { type: "null" }]
    MediaNote:
      type: object
      required: [text, reasons]
      properties:
        text: { type: string, maxLength: 1000 }
        reasons: { type: array, items: { $ref: "#/components/schemas/NoteReason" } }
    NoteReason:
      type: string
      description: "Quick reason chips. Dislike: too_slow, too_scary, too_violent, boring_plot, bad_acting, not_my_genre, already_seen, bad_ending, too_long, childish. Like: loved_atmosphere, great_acting, smart_plot, funny, beautiful."
      enum: [too_slow, too_scary, too_violent, boring_plot, bad_acting, not_my_genre, already_seen, bad_ending, too_long, childish, loved_atmosphere, great_acting, smart_plot, funny, beautiful]
    MediaNoteInput:
      type: object
      required: [text, reasons]
      properties:
        text: { type: string, maxLength: 1000, description: "Trimmed. Empty text and no reasons deletes the note." }
        reasons: { type: array, maxItems: 15, items: { $ref: "#/components/schemas/NoteReason" } }
    MediaNoteSaved:
      type: object
      required: [media_id, text, reasons, updated_at]
      properties:
        media_id: { type: string, format: uuid }
        text: { type: string }
        reasons: { type: array, items: { $ref: "#/components/schemas/NoteReason" } }
        updated_at: { type: string, format: date-time }
    MediaNoteItem:
      type: object
      required: [media, text, reasons, updated_at]
      properties:
        media: { $ref: "#/components/schemas/MediaSummary" }
        text: { type: string }
        reasons: { type: array, items: { $ref: "#/components/schemas/NoteReason" } }
        updated_at: { type: string, format: date-time }
    TasteAdjustment:
      type: object
      required: [reason, titles, strength, penalty, genre_ids, genre_names, runtime_max]
      properties:
        reason: { type: string, enum: [too_scary, childish, too_long], description: "too_long also counts too_slow." }
        titles: { type: integer, description: "Notes with the reason (applies from 2)." }
        strength: { type: number, description: "0..1 = min(1, titles / 4)." }
        penalty: { type: number, description: "Score penalty for a matching title." }
        genre_ids: { type: array, items: { type: integer } }
        genre_names: { type: array, items: { type: string } }
        runtime_max: { type: [integer, "null"], description: "Titles longer than this (minutes) are penalized." }
    WatchProgress:
      type: object
      required: [media_id, episode_id, season_number, episode_number, position_seconds, duration_seconds, percent, completed, completed_at, updated_at, device_id, source_id]
      properties:
        media_id: { type: string, format: uuid }
        episode_id: { type: [string, "null"], format: uuid }
        season_number: { type: [integer, "null"] }
        episode_number: { type: [integer, "null"] }
        position_seconds: { type: number }
        duration_seconds: { type: [number, "null"] }
        percent: { type: number, minimum: 0, maximum: 1 }
        completed: { type: boolean, description: "≥ 90% watched or within the last 3 min (movies) / 90 s (episodes), or marked watched manually." }
        completed_at: { type: [string, "null"], format: date-time }
        updated_at: { type: string, format: date-time }
        device_id: { type: [string, "null"], format: uuid, description: "Device that last reported progress." }
        source_id: { type: [string, "null"], format: uuid, description: "Playback source of the session that saved this position (null when unknown). Continue plays it again." }
    NextUp:
      type: object
      required: [episode_id, season_number, episode_number, name, air_date]
      properties:
        episode_id: { type: string, format: uuid }
        season_number: { type: integer }
        episode_number: { type: integer }
        name: { type: string }
        air_date: { type: [string, "null"], format: date }
    MediaProgress:
      type: object
      required: [media_id, kind, movie, episodes, seasons, next_up]
      properties:
        media_id: { type: string, format: uuid }
        kind: { $ref: "#/components/schemas/MediaKind" }
        movie: { oneOf: [{ $ref: "#/components/schemas/WatchProgress" }, { type: "null" }] }
        episodes: { type: array, items: { $ref: "#/components/schemas/WatchProgress" }, description: "Series: every episode with any progress." }
        seasons:
          type: array
          items:
            type: object
            required: [season_number, completed, total]
            properties:
              season_number: { type: integer }
              completed: { type: integer }
              total: { type: integer, description: Aired episodes. }
        next_up: { oneOf: [{ $ref: "#/components/schemas/NextUp" }, { type: "null" }], description: "Series: first unwatched aired episode after the latest watched one (season progression), else the in-progress one." }
    ContinueItem:
      type: object
      required: [media, progress, next_up]
      properties:
        media: { $ref: "#/components/schemas/MediaSummary" }
        progress: { oneOf: [{ $ref: "#/components/schemas/WatchProgress" }, { type: "null" }], description: "The in-progress item (movie or episode), null when only next_up applies." }
        next_up: { oneOf: [{ $ref: "#/components/schemas/NextUp" }, { type: "null" }] }
    NewEpisodeItem:
      type: object
      required: [media, episode, detected_at, seen, source]
      properties:
        media: { $ref: "#/components/schemas/MediaSummary" }
        episode: { $ref: "#/components/schemas/Episode" }
        detected_at: { type: string, format: date-time }
        seen: { type: boolean }
        source: { type: [string, "null"], enum: [kinopoisk, null], description: "kinopoisk: the series is the profile's only through a Kinopoisk ratings import (counted while it's ongoing, episodes after the import)." }
    NewEpisodeList:
      type: object
      required: [items, unseen]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/NewEpisodeItem" } }
        unseen: { type: integer, description: All unseen items (also beyond the list's limit). }
    NewEpisodeRun:
      type: object
      required: [id, trigger, status, started_at, finished_at, series_checked, refresh_errors, found, error]
      properties:
        id: { type: integer }
        trigger: { type: string, enum: [schedule, startup, manual] }
        status: { type: string, enum: [running, completed, failed] }
        started_at: { type: string, format: date-time }
        finished_at: { type: [string, "null"], format: date-time }
        series_checked: { type: integer }
        refresh_errors: { type: integer }
        found: { type: integer }
        error: { type: [string, "null"] }
    NewEpisodesStatus:
      type: object
      required: [at, timezone, next_run_at, running, runs]
      properties:
        at: { type: string, description: "HH:MM or off." }
        timezone: { type: string }
        next_run_at: { type: [string, "null"], format: date-time }
        running: { type: boolean }
        runs: { type: array, items: { $ref: "#/components/schemas/NewEpisodeRun" } }
    HistoryItem:
      type: object
      required: [media, progress]
      properties:
        media: { $ref: "#/components/schemas/MediaSummary" }
        progress: { $ref: "#/components/schemas/WatchProgress" }

    # ------------------------------------------------------------ keepsakes: ticket stubs & stickers
    TicketStub:
      type: object
      description: >-
        A paper ticket stub for a finished film (issued once, the first time it counts as finished; kept when the
        film is marked unwatched). Hall/row/seat are a stable hash of (profile, film).
      required: [number, media, finished_at, date, time, hall, row, seat, rating]
      properties:
        number: { type: integer, minimum: 1, description: "The profile's running stub number." }
        media: { $ref: "#/components/schemas/MediaSummary" }
        finished_at: { type: string, format: date-time }
        date: { type: string, format: date, description: finished_at on the household clock. }
        time: { type: string, pattern: "^\\d{2}:\\d{2}$", description: "HH:MM on the household clock." }
        hall: { type: integer, minimum: 1, maximum: 9 }
        row: { type: integer, minimum: 1, maximum: 20 }
        seat: { type: integer, minimum: 1, maximum: 30 }
        rating: { type: [integer, "null"], minimum: 1, maximum: 10, description: "The profile's rating (punched holes)." }
    TicketPage:
      type: object
      required: [items, next_cursor, total, cinema, timezone]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/TicketStub" } }
        next_cursor: { type: [string, "null"] }
        total: { type: integer }
        cinema: { type: string, description: Name printed on the stubs («Cineko»). }
        timezone: { type: string, description: "The household's IANA timezone (TZ, else NEW_EPISODES_TZ, else Europe/Moscow)." }
    AchievementId:
      type: string
      description: Sticker id; clients ignore ids they don't know (new stickers may be added).
      examples: [marathon, archaeologist, polyglot, night_owl]
    Achievement:
      type: object
      required: [id, unlocked_at, date, media_id, media_title]
      properties:
        id: { $ref: "#/components/schemas/AchievementId" }
        unlocked_at: { type: string, format: date-time, description: When the history first met the rule. }
        date: { type: string, format: date, description: unlocked_at on the household clock. }
        media_id: { type: [string, "null"], format: uuid, description: The title that earned it. }
        media_title: { type: [string, "null"] }
    AchievementProgress:
      type: object
      required: [id, have, need]
      description: A locked counter sticker on its way (the next goal of a ladder such as films finished).
      properties:
        id: { $ref: "#/components/schemas/AchievementId" }
        have: { type: integer, minimum: 1 }
        need: { type: integer, minimum: 2 }
    AchievementList:
      type: object
      required: [items, progress, secret, total]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Achievement" }, description: "Unlocked only, oldest first." }
        progress: { type: array, items: { $ref: "#/components/schemas/AchievementProgress" }, description: "Locked counter stickers already started, in display order." }
        secret: { type: integer, description: Stickers neither unlocked nor in progress (never listed). }
        total: { type: integer }

    # ------------------------------------------------------------ admin activity & messages (Phase 5)
    ActivityItem:
      type: object
      required: [user, profile, device, media, episode_label, player, position_seconds, duration_seconds, state, started_at, updated_at]
      properties:
        user: { type: object, required: [id, username, display_name], properties: { id: { type: string, format: uuid }, username: { type: string }, display_name: { type: string } } }
        profile: { oneOf: [{ type: object, required: [id, name, color], properties: { id: { type: string, format: uuid }, name: { type: string }, color: { type: string } } }, { type: "null" }] }
        device: { oneOf: [{ type: object, required: [id, name, online], properties: { id: { type: string, format: uuid }, name: { type: string }, online: { type: boolean } } }, { type: "null" }] }
        media: { $ref: "#/components/schemas/MediaSummary" }
        episode_label: { type: [string, "null"] }
        player: { oneOf: [{ $ref: "#/components/schemas/PlayerKind" }, { type: "null" }] }
        position_seconds: { type: [number, "null"] }
        duration_seconds: { type: [number, "null"] }
        state: { type: string, enum: [playing, paused, buffering, preparing, unknown] }
        started_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    AdminHistoryItem:
      allOf:
        - $ref: "#/components/schemas/HistoryItem"
        - type: object
          required: [profile]
          properties:
            profile: { type: object, required: [id, name, color], properties: { id: { type: string, format: uuid }, name: { type: string }, color: { type: string } } }
            device_name: { type: [string, "null"] }
    Message:
      type: object
      required: [id, title, body, from_name, created_at, read_at]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        body: { type: string }
        from_name: { type: string }
        created_at: { type: string, format: date-time }
        read_at: { type: [string, "null"], format: date-time }
    SentMessage:
      type: object
      required: [id, title, body, created_at, recipients, read_count, show_on_tv]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        body: { type: string }
        created_at: { type: string, format: date-time }
        recipients: { type: integer }
        read_count: { type: integer }
        show_on_tv: { type: boolean }

    # ------------------------------------------------------------ admin system (server load)
    SystemStatus:
      type: object
      required: [scope, hostmon, collected_at, uptime_seconds, load_avg, cpu, memory, disks, network, processes, containers, app]
      properties:
        scope: { type: string, enum: [host, container], description: "host = martytv-hostmon; container = the API container's own /proc (fallback)." }
        hostmon: { type: string, enum: [ok, unavailable] }
        collected_at: { type: string, format: date-time }
        uptime_seconds: { type: number }
        load_avg: { type: array, items: { type: number }, minItems: 3, maxItems: 3, description: "1, 5 and 15 minutes." }
        cpu:
          type: object
          required: [cores, usage_percent, per_core_percent, steal_percent, iowait_percent]
          properties:
            cores: { type: integer }
            usage_percent: { type: number }
            per_core_percent: { type: array, items: { type: number } }
            steal_percent: { type: number }
            iowait_percent: { type: number }
        memory:
          type: object
          description: Bytes.
          required: [total, used, available, cached, swap_total, swap_used]
          properties:
            total: { type: integer, format: int64 }
            used: { type: integer, format: int64 }
            available: { type: integer, format: int64 }
            cached: { type: integer, format: int64 }
            swap_total: { type: integer, format: int64 }
            swap_used: { type: integer, format: int64 }
        disks:
          type: array
          description: The root filesystem and the image-cache volume (when it is a different filesystem).
          items:
            type: object
            required: [mount, total, used, free]
            properties:
              mount: { type: string }
              total: { type: integer, format: int64 }
              used: { type: integer, format: int64 }
              free: { type: integer, format: int64 }
        network:
          type: array
          description: Physical/VPN interfaces (lo, veth*, docker*, br-* are skipped). Rates in bytes per second.
          items:
            type: object
            required: [iface, rx_bps, tx_bps, rx_total, tx_total]
            properties:
              iface: { type: string }
              rx_bps: { type: number }
              tx_bps: { type: number }
              rx_total: { type: integer, format: int64 }
              tx_total: { type: integer, format: int64 }
        processes:
          type: array
          description: Top 12 by memory, grouped by friendly name per container (e.g. one container's postgres backends). Names only, never command lines.
          items:
            type: object
            required: [name, pid, count, rss_bytes, cpu_percent]
            properties:
              name: { type: string }
              container: { type: string, description: "Docker container name (hostmon only; absent for host processes)." }
              pid: { type: integer, description: "The group's biggest process." }
              count: { type: integer }
              rss_bytes: { type: integer, format: int64, description: "Resident memory with shared pages counted once per group: the members' private memory plus the largest member's shared part." }
              cpu_percent: { type: number, description: "100 = one full core." }
        containers:
          type: array
          description: Docker containers (hostmon only; empty in the fallback).
          items:
            type: object
            required: [name, state, cpu_percent, mem_bytes, mem_limit_bytes]
            properties:
              name: { type: string }
              state: { type: string, description: "running, exited, restarting…" }
              cpu_percent: { type: number, description: "100 = one full core." }
              mem_bytes: { type: integer, format: int64 }
              mem_limit_bytes: { type: integer, format: int64, description: "0 = no limit." }
        app:
          type: object
          required: [martytv_version, go_routines, go_heap_bytes, active_streams, ws_connections, db_size_bytes, image_cache_bytes, torrserver, integrations]
          properties:
            martytv_version: { type: string }
            go_routines: { type: integer }
            go_heap_bytes: { type: integer, format: int64 }
            active_streams: { type: integer, description: Video streams being proxied right now. }
            ws_connections:
              type: object
              required: [users, devices]
              properties:
                users: { type: integer, description: Distinct users with a live app socket. }
                devices: { type: integer, description: TVs online. }
            db_size_bytes: { type: [integer, "null"], format: int64 }
            image_cache_bytes: { type: [integer, "null"], format: int64 }
            torrserver:
              type: object
              required: [configured, ok, torrents, active, peers, download_speed_bps, upload_speed_bps]
              properties:
                configured: { type: boolean }
                ok: { type: boolean }
                version: { type: string }
                torrents: { type: integer }
                active: { type: integer, description: "Torrents loaded and working (getting info, preloading or streaming)." }
                peers: { type: integer }
                download_speed_bps: { type: number }
                upload_speed_bps: { type: number }
            integrations: { type: array, items: { $ref: "#/components/schemas/IntegrationStatus" } }
            transcoder:
              description: Browser compatibility transcoder; null when not configured. ok false = configured but not answering.
              oneOf:
                - type: object
                  required: [ok, active_jobs, active_subtitle_jobs, max_jobs, jobs_started, jobs_rejected, jobs_failed]
                  properties:
                    ok: { type: boolean }
                    active_jobs: { type: integer, description: Compat video streams converting now. }
                    active_subtitle_jobs: { type: integer }
                    max_jobs: { type: integer }
                    jobs_started: { type: integer, format: int64 }
                    jobs_rejected: { type: integer, format: int64, description: Refused because all slots were busy. }
                    jobs_failed: { type: integer, format: int64 }
                    video_encoder: { type: string, enum: [cpu, nvenc, vaapi, qsv], description: "What re-encoded video (XviD / MPEG-2 / VC-1 → H.264) runs on: detected at the transcoder's start (TRANSCODER_HWACCEL)." }
                    video_encoder_fallback: { type: boolean, description: The GPU failed recently; re-encoding uses the CPU for a while. }
                - type: "null"
    SystemSample:
      type: object
      required: [t, cpu_percent, mem_used, load1, rx_bps, tx_bps, active_streams]
      properties:
        t: { type: string, format: date-time }
        cpu_percent: { type: number }
        mem_used: { type: integer, format: int64 }
        load1: { type: number }
        rx_bps: { type: number }
        tx_bps: { type: number }
        active_streams: { type: [integer, "null"] }
    SystemHistory:
      type: object
      required: [scope, interval_seconds, mem_total, cores, samples]
      properties:
        scope: { type: string, enum: [host, container] }
        interval_seconds: { type: integer }
        mem_total: { type: integer, format: int64 }
        cores: { type: integer }
        samples: { type: array, items: { $ref: "#/components/schemas/SystemSample" } }

    # ------------------------------------------------------------ recommendations between people
    PersonRef:
      type: object
      required: [user_id, name, color, avatar]
      properties:
        user_id: { type: string, format: uuid }
        name: { type: string, description: "Sender/recipient display name (profile name when from_profile_id was given)." }
        color: { type: string }
        avatar: { type: string }
    Recommendation:
      type: object
      required: [id, media, from, to, note, created_at, seen_at, reaction, reply]
      properties:
        id: { type: string, format: uuid }
        media: { $ref: "#/components/schemas/MediaSummary" }
        from: { $ref: "#/components/schemas/PersonRef" }
        to: { $ref: "#/components/schemas/PersonRef" }
        note: { type: string }
        created_at: { type: string, format: date-time }
        seen_at: { type: [string, "null"], format: date-time }
        reaction: { type: [string, "null"], enum: [like, dislike, watched, null] }
        reply: { type: [string, "null"] }

    # ------------------------------------------------------------ client-errors (client error logging)
    ClientErrorApp: { type: string, enum: [web, tv, api] }
    ClientErrorKind: { type: string, enum: [error, unhandledrejection, react, api, player, console] }
    ClientErrorEvent:
      type: object
      description: |
        One client error. Oversized fields are truncated (message 1 KB,
        stack 8 KB, url/component 512 B); `extra` over 2 KB is dropped; the
        whole body is limited to 64 KB. `app: api` is reserved for the server.
      required: [app, kind, message]
      properties:
        app: { type: string, enum: [web, tv] }
        kind: { $ref: "#/components/schemas/ClientErrorKind" }
        message: { type: string }
        stack: { type: string }
        url: { type: string, description: "Route path (the query string is dropped)." }
        component: { type: string, description: "React component, player engine or API operation." }
        release: { type: string, description: App build id. }
        user_agent: { type: string }
        device_model: { type: string }
        profile_id: { type: string, format: uuid, description: "Active profile; ignored unless it belongs to the caller." }
        extra: { type: object, additionalProperties: true }
        occurred_at: { type: string, format: date-time }
        count: { type: integer, minimum: 1, maximum: 1000, description: Identical occurrences folded into this event. }
    ClientErrorGroup:
      type: object
      required: [id, app, kind, message, top_frame, component, count, users_affected, devices_affected, first_seen, last_seen, last_release, last_url, status, resolved_at, regressed]
      properties:
        id: { type: string, format: uuid }
        app: { $ref: "#/components/schemas/ClientErrorApp" }
        kind: { $ref: "#/components/schemas/ClientErrorKind" }
        message: { type: string }
        top_frame: { type: string }
        component: { type: string }
        count: { type: integer, format: int64 }
        users_affected: { type: integer }
        devices_affected: { type: integer }
        first_seen: { type: string, format: date-time }
        last_seen: { type: string, format: date-time }
        last_release: { type: string }
        last_url: { type: string }
        status: { type: string, enum: [unresolved, resolved] }
        resolved_at: { type: [string, "null"], format: date-time }
        regressed: { type: boolean, description: Recurred after it was resolved (cleared when resolved again). }
    ClientErrorSample:
      type: object
      required: [id, occurred_at, received_at, count, user, device, profile_name, message, stack, url, component, release, user_agent, device_model, extra, request_id]
      properties:
        id: { type: integer, format: int64 }
        occurred_at: { type: string, format: date-time }
        received_at: { type: string, format: date-time }
        count: { type: integer }
        user:
          type: [object, "null"]
          required: [id, username, display_name]
          properties:
            id: { type: string, format: uuid }
            username: { type: string }
            display_name: { type: string }
        device:
          type: [object, "null"]
          required: [id, name]
          properties:
            id: { type: string, format: uuid }
            name: { type: string }
        profile_name: { type: [string, "null"] }
        message: { type: string }
        stack: { type: string }
        url: { type: string }
        component: { type: string }
        release: { type: string }
        user_agent: { type: string }
        device_model: { type: string }
        extra: { type: [object, "null"], additionalProperties: true }
        request_id: { type: string, description: API request id (app api). }
    ClientErrorDetail:
      type: object
      required: [group, samples]
      properties:
        group: { $ref: "#/components/schemas/ClientErrorGroup" }
        samples: { type: array, items: { $ref: "#/components/schemas/ClientErrorSample" } }
    ClientErrorUser:
      type: object
      required: [id, username, display_name, groups, last_seen]
      properties:
        id: { type: string, format: uuid }
        username: { type: string }
        display_name: { type: string }
        groups: { type: integer, description: Stored groups the user hit. }
        last_seen: { type: string, format: date-time }
    ClientErrorNewEvent:
      type: object
      description: "Realtime `client_error.new` payload, sent to admins' browser sockets when a group is created or regresses."
      required: [id, app, kind, message, regressed]
      properties:
        id: { type: string, format: uuid }
        app: { $ref: "#/components/schemas/ClientErrorApp" }
        kind: { $ref: "#/components/schemas/ClientErrorKind" }
        message: { type: string }
        regressed: { type: boolean }
    # ---- foryou (Phase 6) schemas
    CuratedGroupId:
      type: string
      description: "thinkers (books by thinkers and critics), directors (directors' own lists), polls (polls and canons), ru (Russian/Soviet canon)."
      enum: [thinkers, directors, polls, modern, ru]
    CuratedGroup:
      type: object
      required: [id, title, lists]
      properties:
        id: { $ref: "#/components/schemas/CuratedGroupId" }
        title: { type: string, description: "Localized group title." }
        lists: { type: array, items: { $ref: "#/components/schemas/CuratedListSummary" } }
    CuratedListSummary:
      type: object
      required: [id, group, title, description, author, source, source_url, ordered, count, resolved, watched, covers]
      properties:
        id: { type: string, examples: [deleuze-cinema-2] }
        group: { $ref: "#/components/schemas/CuratedGroupId" }
        title: { type: string, description: "Localized title." }
        description: { type: string }
        author: { type: string }
        source: { type: string, description: "Book / poll / interview and year." }
        source_url: { type: [string, "null"] }
        ordered: { type: boolean, description: "A ranking: items carry rank." }
        count: { type: integer, description: "Items in the list." }
        resolved: { type: integer, description: "Items found in the catalog." }
        watched: { type: integer, description: "Items the profile finished or rated." }
        covers: { type: array, maxItems: 4, items: { type: string }, description: "Up to 4 TMDB poster paths (first resolved items)." }
    CuratedItem:
      type: object
      required: [position, rank, title, original_title, year, kind, note, watched, media]
      properties:
        position: { type: integer, description: "1-based position in the list." }
        rank: { type: [integer, "null"], description: "The published rank when the list file gives one (polls; ties share a rank), else the position for ordered lists, else null." }
        title: { type: string, description: "Title from the list file (used while media is null)." }
        original_title: { type: string }
        year: { type: integer }
        kind: { $ref: "#/components/schemas/MediaKind" }
        note: { type: [string, "null"], description: "Why the film is in the list (localized; our own words)." }
        watched: { type: boolean, description: "The profile finished or rated it." }
        media: { oneOf: [{ $ref: "#/components/schemas/MediaSummary" }, { type: "null" }], description: "null: not in the catalog («нет в каталоге»)." }
    CuratedList:
      allOf:
        - $ref: "#/components/schemas/CuratedListSummary"
        - type: object
          required: [items]
          properties:
            items: { type: array, items: { $ref: "#/components/schemas/CuratedItem" } }
    ForYouCuratedRow:
      type: object
      required: [list_id, title, author, count, watched]
      properties:
        list_id: { type: string }
        title: { type: string, description: "The list's own title (the row title adds «Подборка:» and progress)." }
        author: { type: string }
        count: { type: integer }
        watched: { type: integer }
    ForYouRowKind:
      type: string
      description: |
        top_picks «Подобрано для вас»; because_you_rated «Потому что вам понравился X»;
        director «Больше от режиссёра Y»; actor «С участием Z»; genre «Популярное в ваших жанрах»;
        hidden_gems «Скрытые жемчужины»; something_different «Что-то новенькое»;
        trending «В тренде для вас»; rewatch «Пересмотреть любимое»; ai_collection (an AI подборка);
        popular (cold start: the profile has no signals yet);
        family «Семья советует» (GET /profiles/{id}/family; computed per request, second row);
        curated «Подборка: …» (one curated list per profile per day, GET /curated/{list_id}; computed per request);
        theme «Вам нравятся фильмы про …» (TMDB discover by the profile's most liked keyword; reason.keyword_*).
        AI theme rubrics (the model grouping the scorer's own candidates) are ai_collection rows too.
      enum: [top_picks, because_you_rated, director, actor, genre, hidden_gems, something_different, trending, rewatch, ai_collection, popular, family, curated, theme]
    ForYouReasonType:
      type: string
      description: "theme: the title has a TMDB keyword the profile likes (keyword_id / keyword_name; genre_ids are the fallback)."
      enum: [because_you_rated, director, actor, genre, hidden_gem, something_different, trending_for_you, ai_collection, rewatch, popular, mood, family, curated, theme]
    ForYouReason:
      type: object
      description: |
        Why a title is recommended. `text` is localized by the server (lang);
        clients may instead build their own text from `type` + the typed
        fields (ids are always set for the types that use them).
      required: [type, text, media_id, media_title, person_tmdb_id, person_name, genre_ids, genre_names, collection_id, collection_title, mood]
      properties:
        type: { $ref: "#/components/schemas/ForYouReasonType" }
        text: { type: string, examples: ["Потому что вам понравился «Матрица»", "Режиссёр — Дени Вильнёв"] }
        media_id: { type: [string, "null"], format: uuid, description: "because_you_rated / rewatch: the source title." }
        media_title: { type: [string, "null"] }
        person_tmdb_id: { type: [integer, "null"], description: "director / actor." }
        person_name: { type: [string, "null"] }
        genre_ids: { type: array, items: { type: integer }, description: "genre / something_different." }
        genre_names: { type: array, items: { type: string } }
        collection_id: { type: [string, "null"], format: uuid, description: "ai_collection." }
        collection_title: { type: [string, "null"] }
        mood: { type: [string, "null"], description: "mood (Surprise): the SurpriseMood key." }
        keyword_id: { type: integer, description: "theme: the TMDB keyword id." }
        keyword_name:
          type: string
          description: "theme: the keyword's name in the response language when known (Russian names come from the AI themes call), else TMDB's English name. Absent when the keyword is unknown."
        keyword_localized: { type: boolean, description: "theme: keyword_name is in the response language (Russian reads after «фильмы про …»)." }
        ai_text:
          type: string
          maxLength: 140
          description: |
            The model's one-line personal reason from the daily AI re-ranking of «Подобрано для вас»
            («медленный, как любимый вами Тарковский, но с развязкой»), in the profile's language; only
            when the response language matches it. Clients show it instead of the typed reason.
        family: { $ref: "#/components/schemas/FamilyWhy", description: "family: who in the family liked the title and how (only on family items)." }
    ForYouItem:
      type: object
      required: [media, reason, score]
      properties:
        media: { $ref: "#/components/schemas/MediaSummary" }
        reason: { $ref: "#/components/schemas/ForYouReason" }
        score: { type: number, description: "Ranking score (higher = better fit); for debugging/ordering only." }
    ForYouRow:
      type: object
      required: [id, kind, title, reason, items]
      properties:
        id: { type: string, description: "Stable id for this row (e.g. byr:<media_id>, director:<tmdb_id>, hidden_gems). Send it as row_id in feedback.", examples: [top_picks, "byr:3f6c…", "director:137427"] }
        kind: { $ref: "#/components/schemas/ForYouRowKind" }
        title: { type: string, description: "Localized row title." }
        reason: { $ref: "#/components/schemas/ForYouReason" }
        items: { type: array, items: { $ref: "#/components/schemas/ForYouItem" } }
        family: { $ref: "#/components/schemas/ForYouFamilyRow", description: "kind family: the sharing members and their taste match." }
        curated: { $ref: "#/components/schemas/ForYouCuratedRow", description: "kind curated: the list and the profile's progress." }
    ForYouFamilyRow:
      type: object
      required: [members]
      properties:
        members: { type: array, items: { $ref: "#/components/schemas/FamilyMember" }, description: "Sharing profiles, best taste match first." }
    FamilyMember:
      type: object
      required: [profile_id, name, avatar, color, user_name, match, co_rated]
      properties:
        profile_id: { type: string, format: uuid }
        name: { type: string, description: Profile name. }
        avatar: { type: string }
        color: { type: string }
        user_name: { type: string, description: "The account's display name (profiles of different accounts may share a name)." }
        match: { type: [integer, "null"], minimum: 0, maximum: 100, description: "«Совпадение вкусов» in percent; null when there is nothing to compare yet." }
        co_rated: { type: integer, description: Titles both profiles rated. }
    FamilyEndorsement:
      type: object
      required: [profile_id, name, avatar, color, user_name, rating, completed, completed_at, favorite, liked]
      properties:
        profile_id: { type: string, format: uuid }
        name: { type: string }
        avatar: { type: string }
        color: { type: string }
        user_name: { type: string }
        rating: { type: [integer, "null"], minimum: 1, maximum: 10 }
        completed: { type: boolean, description: "Finished (a movie, a series marked watched or ≥ 3 episodes)." }
        completed_at: { type: [string, "null"], format: date-time }
        favorite: { type: boolean }
        liked: { type: boolean, description: "★8+, a favorite, or finished in the last 6 months without a low rating." }
    FamilyWhy:
      type: object
      required: [people, liked_by, text]
      properties:
        people: { type: array, items: { $ref: "#/components/schemas/FamilyEndorsement" }, description: "Members who liked it first (strongest first), then others with a rating or a finish." }
        liked_by: { type: integer, description: "Members who liked it («Понравилось двоим»)." }
        text: { type: string, description: "Server-localized line, e.g. «Анна ★9 · Олег: посмотрено вчера»." }
    FamilyItem:
      type: object
      required: [media, why, score]
      properties:
        media: { $ref: "#/components/schemas/MediaSummary" }
        why: { $ref: "#/components/schemas/FamilyWhy" }
        score: { type: number }
    FamilyBlock:
      type: object
      required: [profile_id, enabled, sharing, members, items]
      properties:
        profile_id: { type: string, format: uuid }
        enabled: { type: boolean, description: "The profile shows the family (show_family)." }
        sharing: { type: boolean, description: "The profile itself shares (share_with_family)." }
        members: { type: array, items: { $ref: "#/components/schemas/FamilyMember" } }
        items: { type: array, items: { $ref: "#/components/schemas/FamilyItem" } }
    MediaFamily:
      type: object
      required: [enabled, people]
      properties:
        enabled: { type: boolean }
        people: { type: array, items: { $ref: "#/components/schemas/FamilyEndorsement" } }
    ForYouRows:
      type: object
      required: [profile_id, generated_at, stale, cold_start, rows]
      properties:
        profile_id: { type: string, format: uuid }
        generated_at: { type: [string, "null"], format: date-time }
        stale: { type: boolean, description: "New ratings/dismissals arrived since generated_at; a rebuild is running and `foryou.updated` follows." }
        cold_start: { type: boolean, description: "The profile has too few signals: rows are popular/trending titles. Suggest rating a few titles." }
        rows: { type: array, items: { $ref: "#/components/schemas/ForYouRow" } }
    ForYouFeedbackAction:
      type: string
      enum: [impression, open, dismiss, undismiss, play, complete]
    ForYouFeedbackEvent:
      type: object
      required: [media_id, action]
      properties:
        media_id: { type: string, format: uuid }
        action: { $ref: "#/components/schemas/ForYouFeedbackAction" }
        row_id: { type: string, maxLength: 80 }
    SurpriseMood:
      type: string
      description: "уютное, напряжённое, смешное, задуматься, страшное, романтика, для всей семьи."
      enum: [cozy, tense, funny, thoughtful, scary, romantic, family]
    ForYouMoodOption:
      type: object
      required: [key, title, emoji, genre_ids]
      properties:
        key: { $ref: "#/components/schemas/SurpriseMood" }
        title: { type: string }
        emoji: { type: string }
        genre_ids: { type: array, items: { type: integer }, description: "TMDB movie genres the mood maps to (any of)." }
    SurpriseRequest:
      type: object
      required: [profile_id]
      properties:
        profile_id: { type: string, format: uuid }
        mood: { $ref: "#/components/schemas/SurpriseMood" }
        genres: { type: array, maxItems: 10, items: { type: integer }, description: "TMDB genre ids; any of them." }
        runtime_min: { type: integer, minimum: 0, maximum: 1000 }
        runtime_max: { type: integer, minimum: 0, maximum: 1000 }
        decade: { type: integer, minimum: 1900, maximum: 2090, description: "e.g. 1990 for the 90s." }
        min_rating: { type: number, minimum: 0, maximum: 10, description: "Kinopoisk rating when known, else TMDB." }
        include_watched: { type: boolean, default: false, description: "Also allow titles the profile completed/rated (favourites first)." }
        kind: { type: string, enum: [movie, series, any], default: movie }
        exclude_ids: { type: array, maxItems: 200, items: { type: string, format: uuid }, description: "Already shown picks (re-roll)." }
    SurpriseResult:
      type: object
      required: [media, reason, source, pool_size, reroll]
      properties:
        media: { oneOf: [{ $ref: "#/components/schemas/MediaSummary" }, { type: "null" }] }
        reason: { oneOf: [{ $ref: "#/components/schemas/ForYouReason" }, { type: "null" }] }
        source: { type: string, enum: [pool, discover, none] }
        pool_size: { type: integer, description: "How many titles matched the filters." }
        reroll:
          type: object
          required: [exclude_ids]
          properties:
            exclude_ids: { type: array, items: { type: string, format: uuid }, description: "Send back as exclude_ids to get a different pick." }
    ChannelItem:
      type: object
      required: [media, episode, runtime_minutes, runtime_known, resume_seconds, source, reason]
      properties:
        media: { $ref: "#/components/schemas/MediaSummary" }
        episode:
          oneOf:
            - type: "null"
            - type: object
              required: [id, season_number, episode_number, name]
              properties:
                id: { type: string, format: uuid }
                season_number: { type: integer }
                episode_number: { type: integer }
                name: { type: string }
        runtime_minutes: { type: integer, description: "Estimated when runtime_known is false." }
        runtime_known: { type: boolean }
        resume_seconds: { type: number, description: "An episode left mid-way starts here (0 = the beginning)." }
        source: { type: string, enum: [foryou, continue], description: "continue: the next episode of a series in progress." }
        reason: { oneOf: [{ $ref: "#/components/schemas/ForYouReason" }, { type: "null" }] }
    ChannelProgramme:
      type: object
      required: [items, pool_size]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/ChannelItem" } }
        pool_size: { type: integer, description: "Candidates left after the exclusions." }
    ExploreTile:
      type: object
      required: [id, kind, title, subtitle, emoji, image_path, collection_id, discover]
      properties:
        id: { type: string, description: "Pass as ?tile= to GET /foryou/browse.", examples: ["mood:cozy", "decade:1980", "lang:ko", "genre:18", "kw:4379"] }
        kind: { type: string, enum: [mood, decade, language, genre, keyword, collection, curated] }
        title: { type: string }
        subtitle: { type: [string, "null"] }
        emoji: { type: [string, "null"] }
        image_path: { type: [string, "null"], description: "TMDB backdrop/poster path when the tile has a representative image." }
        collection_id: { type: [string, "null"], format: uuid }
        curated_id: { type: [string, "null"], description: "kind curated: the list id (GET /curated/{list_id}); also tile ids curated:<id>." }
        progress: { type: [string, "null"], description: "kind curated: «12 / 48» (watched / count)." }
        discover:
          description: "Equivalent /catalog/discover query params when the tile can be expressed there (deep link into Browse)."
          oneOf:
            - type: "null"
            - type: object
              properties:
                kind: { $ref: "#/components/schemas/MediaKind" }
                genres: { type: string }
                year_from: { type: integer }
                year_to: { type: integer }
                original_language: { type: string }
                sort: { type: string }
                rating_min: { type: number }
    ExploreSection:
      type: object
      required: [id, kind, title, tiles]
      properties:
        id: { type: string }
        kind: { type: string, enum: [moods, decades, countries, genres, keywords, collections, curated] }
        title: { type: string }
        tiles: { type: array, items: { $ref: "#/components/schemas/ExploreTile" } }
    ForYouBrowsePage:
      allOf:
        - $ref: "#/components/schemas/MediaPage"
        - type: object
          required: [tile, title]
          properties:
            tile: { type: string }
            title: { type: string }
    ForYouCollection:
      type: object
      required: [id, scope, title, description, generated_at, model, items]
      properties:
        id: { type: string, format: uuid }
        scope: { type: string, enum: [profile, global] }
        title: { type: string }
        description: { type: string }
        generated_at: { type: string, format: date-time }
        model: { type: string, examples: [deepseek-chat] }
        items: { type: array, items: { $ref: "#/components/schemas/MediaSummary" } }
    ForYouRunError:
      type: object
      required: [profile_id, step, message]
      properties:
        profile_id: { type: [string, "null"], format: uuid }
        step: { type: string, enum: [credits, taste, rows, ai, global_ai, run] }
        message: { type: string }
    ForYouRun:
      type: object
      required: [id, scope, target_id, ai, trigger, status, requested_by, profiles_total, profiles_done, ai_calls, ai_tokens, collections_created, errors, started_at, finished_at, duration_ms]
      properties:
        id: { type: string, format: uuid }
        scope: { type: string, enum: [all, user, profile] }
        target_id: { type: [string, "null"], format: uuid }
        ai: { type: boolean }
        trigger: { type: string, enum: [schedule, admin, startup, taste_note, user, return], description: "return: an idle profile's first visit (the daily run skips profiles not seen for a day)." }
        status: { type: string, enum: [running, completed, failed] }
        requested_by:
          oneOf:
            - type: "null"
            - type: object
              required: [id, username]
              properties:
                id: { type: string, format: uuid }
                username: { type: string }
        profiles_total: { type: integer }
        profiles_done: { type: integer }
        ai_calls: { type: integer }
        ai_tokens: { type: integer }
        collections_created: { type: integer }
        errors: { type: array, items: { $ref: "#/components/schemas/ForYouRunError" }, description: "At most 50; the run continues past them." }
        started_at: { type: string, format: date-time }
        finished_at: { type: [string, "null"], format: date-time }
        duration_ms: { type: [integer, "null"] }
    ForYouSourceWeight:
      type: object
      required: [source, weight, prev_weight, target, impressions, opens, plays, completes, dismisses]
      properties:
        source: { type: string, description: "Learn key: trending, because_you_rated, director, actor, theme, genre, hidden_gem, something_different, ai_collection, ai_theme, ai_picks, rewatch, family, curated." }
        weight: { type: number, description: "Multiplier in use (0.5–2)." }
        prev_weight: { type: number, description: "Before the last nightly step." }
        target: { type: number, description: "Where the estimate points (the weight moves at most ±15 % a night)." }
        impressions: { type: number }
        opens: { type: number }
        plays: { type: number, description: "Plays of ≥ 10 min (or completions) after an open from the row." }
        completes: { type: number }
        dismisses: { type: number }
    ForYouProfileWeights:
      type: object
      required: [profile_id, name, owner, updated_at, items]
      properties:
        profile_id: { type: string, format: uuid }
        name: { type: string }
        owner: { type: string }
        updated_at: { type: string, format: date-time }
        items: { type: array, items: { $ref: "#/components/schemas/ForYouSourceWeight" } }
    ForYouWeights:
      type: object
      required: [enabled, sources, items]
      properties:
        enabled: { type: boolean, description: "The admin switch learn_weights." }
        sources: { type: array, items: { type: string }, description: "Every learn key, in display order." }
        items: { type: array, items: { $ref: "#/components/schemas/ForYouProfileWeights" } }
    ForYouRatingSummary:
      type: object
      required: [n, avg, liked, disliked]
      properties:
        n: { type: integer }
        avg: { type: [number, "null"] }
        liked: { type: [number, "null"], description: "Share rated ≥ 7." }
        disliked: { type: [number, "null"], description: "Share rated ≤ 4." }
    ForYouQualityStats:
      type: object
      required: [funnel, recommended, elsewhere, calibration, sources, precision_shown, precision_liked, hits, misses]
      properties:
        funnel:
          type: object
          required: [shown, played, finished, rated, liked, disliked]
          properties:
            shown: { type: integer }
            played: { type: integer }
            finished: { type: integer }
            rated: { type: integer }
            liked: { type: integer }
            disliked: { type: integer }
        recommended: { $ref: "#/components/schemas/ForYouRatingSummary" }
        elsewhere: { $ref: "#/components/schemas/ForYouRatingSummary" }
        calibration:
          type: array
          description: Tertiles of the shown titles by predicted score, low → high (empty under 3 scored titles).
          items:
            allOf:
              - { $ref: "#/components/schemas/ForYouRatingSummary" }
              - type: object
                required: [score_min, score_max, shown, played]
                properties:
                  score_min: { type: number }
                  score_max: { type: number }
                  shown: { type: integer }
                  played: { type: integer }
        sources:
          type: array
          items:
            type: object
            required: [source, shown, plays, rated, avg, liked]
            properties:
              source: { type: string }
              shown: { type: number }
              plays: { type: number }
              rated: { type: number }
              avg: { type: [number, "null"] }
              liked: { type: [number, "null"] }
        precision_shown: { type: integer, description: "Titles shown in the first 10 tiles of «Подобрано для вас»." }
        precision_liked: { type: integer, description: "Of those, rated ≥ 7." }
        hits: { type: array, items: { $ref: "#/components/schemas/ForYouQualityTitle" } }
        misses: { type: array, items: { $ref: "#/components/schemas/ForYouQualityTitle" } }
    ForYouQualityTitle:
      type: object
      required: [media_id, title, year, poster_path, rating]
      properties:
        media_id: { type: string, format: uuid }
        title: { type: string }
        year: { type: [integer, "null"] }
        poster_path: { type: [string, "null"] }
        rating: { type: integer }
    ForYouQuality:
      type: object
      required: [window, generated_at, household, profiles]
      properties:
        window: { type: string, enum: ["30", "90", "all"] }
        generated_at: { type: string, format: date-time }
        household: { $ref: "#/components/schemas/ForYouQualityStats" }
        profiles:
          type: array
          items:
            type: object
            required: [profile_id, name, owner, stats]
            properties:
              profile_id: { type: string, format: uuid }
              name: { type: string }
              owner: { type: string }
              stats: { $ref: "#/components/schemas/ForYouQualityStats" }
    ForYouAIStatus:
      type: object
      required: [enabled, model, tokens_today, daily_budget, run_budget, balance, temperature, facts_ai, companion_ai]
      properties:
        enabled: { type: boolean, description: "False without DEEPSEEK_API_KEY." }
        temperature: { $ref: "#/components/schemas/AITemperature" }
        facts_ai: { type: boolean, description: "DeepSeek may write «Факты» for titles Kinopoisk has none for (admin switch, default true)." }
        themes_ai: { type: boolean, description: "The daily run groups each profile's good unseen candidates into AI theme rubrics (admin switch, default true)." }
        picks_ai: { type: boolean, description: "The daily run re-ranks «Подобрано для вас» with a personal reason per title (admin switch, default true)." }
        companion_ai: { type: boolean, description: "«Ранее в сериале» / «После титров» allowed (admin switch, default true)." }
        learn_weights: { type: boolean, description: "The nightly run learns per-profile source weights from plays (admin switch, default true)." }
        model: { type: string }
        tokens_today: { type: integer, description: "Tokens used today (Moscow date)." }
        daily_budget: { type: integer }
        run_budget: { type: integer }
        balance:
          description: "DeepSeek account balance (GET /user/balance, cached 10 min, refreshed after each run); null without a key or when the call failed."
          oneOf: [{ $ref: "#/components/schemas/ForYouAIBalance" }, { type: "null" }]
    AITemperature:
      type: object
      description: "The admin's DeepSeek temperature per feature (0–1.5, default 1.0)."
      required: [collections, ask, music, facts, companion]
      properties:
        collections: { type: number, minimum: 0, maximum: 1.5, description: "AI collections (daily run)." }
        ask: { type: number, minimum: 0, maximum: 1.5, description: "«Спросить ИИ»." }
        music: { type: number, minimum: 0, maximum: 1.5, description: "Cineko Music AI playlists." }
        facts: { type: number, minimum: 0, maximum: 1.5, description: "AI-written «Факты» (default 0.7)." }
        companion: { type: number, minimum: 0, maximum: 1.5, description: "«Ранее в сериале» / «После титров» (default 0.3)." }
    AICreativity:
      type: string
      enum: [precise, normal, bold]
      default: normal
      description: "The viewer's nudge on the admin's temperature («Точнее / Обычно / Смелее»): −0.4 / 0 / +0.4, clamped to 0–1.5."
    ForYouAISettings:
      type: object
      required: [enabled, temperature, facts_ai, companion_ai, creativity, min, max]
      properties:
        enabled: { type: boolean, description: "False without DEEPSEEK_API_KEY." }
        temperature: { $ref: "#/components/schemas/AITemperature" }
        facts_ai: { type: boolean, description: "AI-written «Факты» allowed (admin switch)." }
        themes_ai: { type: boolean, description: "AI theme rubrics allowed (admin switch)." }
        picks_ai: { type: boolean, description: "AI re-ranking of «Подобрано для вас» allowed (admin switch)." }
        companion_ai: { type: boolean, description: "«Ранее в сериале» / «После титров» allowed (admin switch)." }
        creativity:
          type: object
          description: "Offset each creativity adds to the temperature."
          required: [precise, normal, bold]
          properties:
            precise: { type: number }
            normal: { type: number }
            bold: { type: number }
        min: { type: number }
        max: { type: number }
    ForYouRegenStatus:
      type: object
      required: [available, used_today, daily_limit, unlimited, next_available_at, running, run_id, ai_enabled]
      properties:
        available: { type: boolean, description: "A POST would start a regeneration now." }
        used_today: { type: integer, description: "Manual regenerations of this profile today (Moscow day)." }
        daily_limit: { type: integer, description: "1." }
        unlimited: { type: boolean, description: "True for admins." }
        next_available_at: { type: string, format: date-time, description: "Now when available, else the next Moscow midnight." }
        running: { type: boolean, description: "A regeneration (manual or after a taste-note change) is running for the profile." }
        run_id: { type: [string, "null"], format: uuid }
        ai_enabled: { type: boolean }
    ForYouAIBalance:
      type: object
      required: [available, currency, total, granted, topped_up, checked_at]
      properties:
        available: { type: boolean, description: "DeepSeek's is_available: false = the balance can't cover API calls." }
        currency: { type: string, description: "USD or CNY." }
        total: { type: number }
        granted: { type: number }
        topped_up: { type: number }
        checked_at: { type: string, format: date-time }
    ForYouUpdatedEvent:
      type: object
      description: "Realtime `foryou.updated` payload, sent to the owning users' browser sockets when rows or collections of their profiles changed. Refetch /foryou/rows (and collections)."
      required: [profile_ids, reason]
      properties:
        profile_ids: { type: array, items: { type: string, format: uuid } }
        reason: { type: string, enum: [run, signals, collections, settings] }
    ForYouAskRequest:
      type: object
      required: [profile_id, prompt]
      properties:
        profile_id: { type: string, format: uuid }
        prompt: { type: string, minLength: 3, maxLength: 500, description: "What the viewer wants, in their words. Sent to the model as data only." }
        lang: { type: string, enum: [en, ru], description: "Language of answer/why/followups and titles (else ?lang, else en)." }
        kind: { type: string, enum: [movie, series, any], default: any }
        include_watched: { type: boolean, default: false, description: "Allow titles the profile completed or rated." }
        device_id: { type: string, format: uuid, description: "Also deliver the answer to this TV (owned by the caller) as `foryou.ask`." }
        creativity: { $ref: "#/components/schemas/AICreativity" }
    ForYouAskItem:
      type: object
      required: [media, why]
      properties:
        media: { $ref: "#/components/schemas/MediaSummary" }
        why: { type: string, description: "One line: why this title fits the request." }
    ForYouAsk:
      type: object
      description: "One «Спросить ИИ» answer; also the realtime `foryou.ask` payload on a TV."
      required: [id, profile_id, prompt, kind, include_watched, answer, items, followups, refused, tokens, created_at]
      properties:
        id: { type: string, format: uuid }
        profile_id: { type: string, format: uuid }
        prompt: { type: string }
        kind: { type: string, enum: [movie, series, any] }
        include_watched: { type: boolean }
        answer: { type: string, description: "Short friendly plain text (no markdown)." }
        items: { type: array, items: { $ref: "#/components/schemas/ForYouAskItem" }, description: "At most 8, in the model's order; empty when refused." }
        followups: { type: array, items: { type: string }, description: "2–3 suggested refinements." }
        refused: { type: boolean, description: "Off-topic (not about films/series) or an attempt to override the rules." }
        tokens: { type: integer, description: "AI tokens this ask spent (0 when refused locally)." }
        created_at: { type: string, format: date-time }
        sent_to_device: { type: boolean, description: "Only with device_id: whether the TV was online and got `foryou.ask`." }
    DiaryEntry:
      type: object
      required: [media, watched, episodes, rating, rewatch, at]
      properties:
        media: { $ref: "#/components/schemas/MediaSummary" }
        watched: { type: boolean, description: "Completed this day (a movie, or ≥ 1 episode)." }
        episodes:
          type: array
          items:
            type: object
            required: [season_number, episode_number]
            properties:
              season_number: { type: integer }
              episode_number: { type: integer }
        rating: { type: [integer, "null"], description: "Rated (or re-rated) this day." }
        rewatch: { type: boolean }
        at: { type: string, format: date-time, description: "Latest activity of the entry that day." }
    DiaryCount:
      type: object
      required: [key, name, count]
      properties:
        key: { type: string, description: "Genre id, decade (\"1990\") or person TMDB id." }
        name: { type: string }
        count: { type: integer }
    Diary:
      type: object
      required: [month, days, stats]
      properties:
        month: { type: string, examples: ["2026-10"] }
        days:
          type: array
          description: Only days with entries, oldest first.
          items:
            type: object
            required: [date, entries]
            properties:
              date: { type: string, format: date }
              entries: { type: array, items: { $ref: "#/components/schemas/DiaryEntry" } }
        stats:
          type: object
          required: [movies_watched, episodes_watched, series_watched, hours_watched, ratings_count, average_rating, rewatches, favorite_genres, favorite_decades, top_directors, top_rated]
          properties:
            movies_watched: { type: integer }
            episodes_watched: { type: integer }
            series_watched: { type: integer }
            hours_watched: { type: number, description: "Completed runtime this month (one decimal)." }
            ratings_count: { type: integer }
            average_rating: { type: [number, "null"] }
            rewatches: { type: integer }
            favorite_genres: { type: array, items: { $ref: "#/components/schemas/DiaryCount" } }
            favorite_decades: { type: array, items: { $ref: "#/components/schemas/DiaryCount" } }
            top_directors: { type: array, items: { $ref: "#/components/schemas/DiaryCount" } }
            top_rated:
              type: array
              items:
                type: object
                required: [media, rating]
                properties:
                  media: { $ref: "#/components/schemas/MediaSummary" }
                  rating: { type: integer }
    TasteAffinity:
      type: object
      required: [key, name, score, count]
      properties:
        key: { type: string, description: "Genre id, decade (\"1990\"), ISO 639-1 language or ISO 3166-1 country." }
        name: { type: string }
        score: { type: number, description: "−1…1." }
        count: { type: integer, description: "Titles with a signal that carry this feature." }
    TastePerson:
      type: object
      required: [tmdb_id, name, profile_path, score, count]
      properties:
        tmdb_id: { type: integer }
        name: { type: string }
        profile_path: { type: [string, "null"] }
        score: { type: number }
        count: { type: integer }
    TasteTheme:
      type: object
      description: "A TMDB keyword («heist», «time loop») as a taste theme."
      required: [id, name, name_en, localized, score, count]
      properties:
        id: { type: integer, description: "TMDB keyword id." }
        name: { type: string, description: "In the response language when known, else TMDB's English name." }
        name_en: { type: string }
        localized: { type: boolean, description: "name is in the response language (Russian: accusative, reads after «фильмы про …»)." }
        score: { type: number, description: "−1…1 (damped for keywords common across the catalog)." }
        count: { type: integer }
    TasteDNA:
      type: object
      required: [profile_id, computed_at, signals, rating_histogram, kinds, genres, decades, languages, countries, directors, actors, credits_coverage]
      properties:
        profile_id: { type: string, format: uuid }
        computed_at: { type: string, format: date-time }
        signals:
          type: object
          required: [ratings, completed, favorites, watchlist, dismissed, abandoned, rewatches, average_rating]
          properties:
            ratings: { type: integer }
            completed: { type: integer }
            favorites: { type: integer }
            watchlist: { type: integer }
            dismissed: { type: integer }
            abandoned: { type: integer }
            rewatches: { type: integer }
            average_rating: { type: [number, "null"] }
        rating_histogram: { type: array, items: { type: integer }, minItems: 10, maxItems: 10, description: "Count of ratings 1…10." }
        kinds:
          type: object
          required: [movie, series]
          properties:
            movie: { type: integer }
            series: { type: integer }
        genres: { type: array, items: { $ref: "#/components/schemas/TasteAffinity" } }
        decades: { type: array, items: { $ref: "#/components/schemas/TasteAffinity" } }
        languages: { type: array, items: { $ref: "#/components/schemas/TasteAffinity" } }
        countries: { type: array, items: { $ref: "#/components/schemas/TasteAffinity" } }
        directors: { type: array, items: { $ref: "#/components/schemas/TastePerson" } }
        actors: { type: array, items: { $ref: "#/components/schemas/TastePerson" } }
        themes: { type: array, items: { $ref: "#/components/schemas/TasteTheme" }, description: "TMDB keywords (≥ 2 titles), strongest first, ≤ 20." }
        writers: { type: array, items: { $ref: "#/components/schemas/TastePerson" }, description: "Screenplay / Writer (≥ 2 titles)." }
        cinematographers: { type: array, items: { $ref: "#/components/schemas/TastePerson" }, description: "Director of Photography (≥ 2 titles)." }
        composers: { type: array, items: { $ref: "#/components/schemas/TastePerson" }, description: "Original Music Composer (≥ 2 titles)." }
        credits_coverage:
          type: object
          description: "How many signal titles have cast/crew loaded (filled lazily by the daily run)."
          required: [with_credits, total]
          properties:
            with_credits: { type: integer }
            total: { type: integer }
        adjustments:
          type: array
          description: "Reason-driven penalties from the profile's notes («Почему?»): too_scary → horror/thriller, childish → family/animation, too_slow/too_long → long runtimes."
          items: { $ref: "#/components/schemas/TasteAdjustment" }

    # ------------------------------------------------------------ server downloads
    DownloadStatus:
      type: string
      enum: [queued, downloading, paused, done, failed, waiting_space]
    DownloadBrief:
      type: object
      description: "The server download of a playback source's file (PlaybackSource.download)."
      required: [id, status, progress, bytes_done, size, rate_bps, eta_seconds, completed_at, keep_until, pinned, mine]
      properties:
        id: { type: string, format: uuid }
        status: { $ref: "#/components/schemas/DownloadStatus" }
        progress: { type: number, description: "0…1" }
        bytes_done: { type: integer }
        size: { type: integer }
        rate_bps: { type: [number, "null"], description: "Bytes per second while downloading." }
        eta_seconds: { type: [integer, "null"] }
        completed_at: { type: [string, "null"], format: date-time }
        keep_until: { type: [string, "null"], format: date-time, description: "Kept at least until then (max(completed, last watched) + keep_days); null while incomplete or pinned. After it, removed only when space is needed." }
        pinned: { type: boolean }
        mine: { type: boolean, description: "The caller requested it (may pin, pause, delete)." }
    Download:
      type: object
      required: [id, status, error, progress, bytes_done, size, rate_bps, eta_seconds, pinned, mine, info_hash, file_index, file_name, release_title,
        media_id, episode_id, season, episode, media, created_at, started_at, completed_at, last_watched_at, keep_until, space_needed_bytes]
      properties:
        id: { type: string, format: uuid }
        status: { $ref: "#/components/schemas/DownloadStatus" }
        error: { type: [string, "null"], description: "failed: size_mismatch, upstream_error, write_error. waiting_space: insufficient_space (see space_needed_bytes)." }
        progress: { type: number, description: "0…1" }
        bytes_done: { type: integer }
        size: { type: integer }
        rate_bps: { type: [number, "null"] }
        eta_seconds: { type: [integer, "null"] }
        pinned: { type: boolean }
        mine: { type: boolean }
        info_hash: { type: string }
        file_index: { type: integer }
        file_name: { type: string, description: "Base name of the torrent file." }
        release_title: { type: string }
        media_id: { type: [string, "null"], format: uuid }
        episode_id: { type: [string, "null"], format: uuid }
        season: { type: [integer, "null"] }
        episode: { type: [integer, "null"] }
        media: { oneOf: [{ $ref: "#/components/schemas/MediaSummary" }, { type: "null" }] }
        created_at: { type: string, format: date-time }
        started_at: { type: [string, "null"], format: date-time }
        completed_at: { type: [string, "null"], format: date-time }
        last_watched_at: { type: [string, "null"], format: date-time }
        keep_until: { type: [string, "null"], format: date-time }
        space_needed_bytes: { type: [integer, "null"], description: "waiting_space: how much more free space the rest of the file needs." }
        users:
          type: array
          description: "Admin list (all=true) only: who requested it."
          items:
            type: object
            required: [id, username, display_name]
            properties:
              id: { type: string, format: uuid }
              username: { type: string }
              display_name: { type: string }
    DownloadList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Download" } }
    DownloadUpdatedEvent:
      type: object
      description: "Realtime `download.updated` (payload: Download, to its requesters' browser sockets, throttled ~2 s) and `download.removed` (payload: {id})."
      required: [id]
      properties:
        id: { type: string, format: uuid }
    StorageSettings:
      type: object
      required: [reserve_gb, max_library_gb, keep_days]
      properties:
        reserve_gb: { type: number, description: "Free space always kept on the disk (the database lives there too). Default 15." }
        max_library_gb: { type: [number, "null"], description: "Library cap; null = limited by the disk only." }
        keep_days: { type: integer, description: "Completed downloads are never evicted younger than this (days since completed or last watched). Default 30." }
    StorageSettingsUpdate:
      type: object
      properties:
        reserve_gb: { type: number, minimum: 1, maximum: 10000 }
        max_library_gb: { type: [number, "null"], minimum: 1, maximum: 100000 }
        keep_days: { type: integer, minimum: 1, maximum: 3650 }
    StorageStatus:
      type: object
      required: [ok, disk_total_bytes, disk_free_bytes, library_used_bytes, reserve_bytes, available_bytes, settings, counts, max_jobs]
      properties:
        ok: { type: boolean, description: "The library directory exists and is writable." }
        disk_total_bytes: { type: integer }
        disk_free_bytes: { type: integer }
        library_used_bytes: { type: integer, description: "Bytes on disk of completed and partial downloads." }
        reserve_bytes: { type: integer }
        available_bytes: { type: integer, description: "Room for new downloads now: min(free − reserve, cap − used) minus what running downloads still need; ≥ 0." }
        settings: { $ref: "#/components/schemas/StorageSettings" }
        counts:
          type: object
          required: [queued, downloading, paused, done, failed, waiting_space]
          properties:
            queued: { type: integer }
            downloading: { type: integer }
            paused: { type: integer }
            done: { type: integer }
            failed: { type: integer }
            waiting_space: { type: integer }
        max_jobs: { type: integer, description: "Downloads that run at once (DOWNLOAD_MAX_JOBS)." }
    TorrServerTorrent:
      type: object
      required: [hash, title, size_bytes, stat, stat_string, idle, added_at, peers, download_speed_bps, martytv]
      properties:
        hash: { type: string }
        title: { type: string }
        size_bytes: { type: [integer, "null"] }
        stat: { type: integer, description: "TorrServer state: 0 added, 1 getting info, 2 preload, 3 working, 4 closed, 5 in db." }
        stat_string: { type: string }
        idle: { type: boolean, description: "Closed or only stored in TorrServer's DB (stat ≥ 4)." }
        added_at: { type: [string, "null"], format: date-time }
        peers: { type: integer }
        download_speed_bps: { type: number }
        martytv:
          type: object
          required: [sources, streaming, download, in_use]
          properties:
            sources: { type: integer, description: "Cineko playback sources on this torrent." }
            streaming: { type: boolean, description: "A Cineko stream or compat job is reading it now." }
            download: { oneOf: [{ type: object, required: [id, status], properties: { id: { type: string, format: uuid }, status: { $ref: "#/components/schemas/DownloadStatus" } } }, { type: "null" }] }
            in_use: { type: boolean, description: "streaming, or a download is queued/running/waiting on it: removal needs force." }

    # ------------------------------------------------------------ IPTV (Phase 7)
    IptvProgramme:
      type: object
      required: [start, stop, title, description, category]
      properties:
        start: { type: string, format: date-time }
        stop: { type: string, format: date-time }
        title: { type: string }
        description: { type: [string, "null"] }
        category: { type: [string, "null"] }
    IptvGroup:
      type: object
      required: [id, name, count]
      properties:
        id: { type: string, description: "Known categories use a fixed id (news, movies, sports, kids, music, entertainment, documentary, general, series, religious, …; clients localize them); other playlist groups get `g:<slug>`; `other` = no group." }
        name: { type: string, description: The group title as written in the playlist. }
        count: { type: integer }
    IptvChannel:
      type: object
      required: [id, number, name, logo_url, group_id, group, playlist_id, favorite, hidden, offline, format, has_epg, now, next]
      properties:
        id: { type: string, format: uuid }
        number: { type: integer, description: "The profile's number for the channel (custom, else sequential in list order)." }
        custom_number: { type: [integer, "null"] }
        name: { type: string }
        logo_url: { type: [string, "null"], description: "/api/v1/iptv/logos/{id}?v=… (server-proxied)." }
        group_id: { type: string }
        group: { type: string }
        playlist_id: { type: string, format: uuid }
        favorite: { type: boolean }
        hidden: { type: boolean }
        offline: { type: boolean, description: "The stream doesn't work (health dead/geo, or repeated failures): clients hide it behind «Нерабочие» (still playable; heals on the next success)." }
        health: { type: [string, "null"], enum: [ok, codec, geo, dead, timeout, null], description: "Last stream check (daily; at once when a start fails): codec = reachable but browsers may not decode it (HEVC, AC-3, MPEG-2); geo = 403/451; dead = DNS/404/refused/not a stream; null = not checked yet." }
        format: { type: [string, "null"], enum: [hls, ts, null], description: "Detected stream type (null until first played/probed). ts plays on TVs; browsers need HLS." }
        has_epg: { type: boolean }
        now: { oneOf: [{ $ref: "#/components/schemas/IptvProgramme" }, { type: "null" }] }
        next: { oneOf: [{ $ref: "#/components/schemas/IptvProgramme" }, { type: "null" }] }
    IptvChannelList:
      type: object
      required: [items, groups, last_channel_id, server_time]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/IptvChannel" } }
        groups: { type: array, items: { $ref: "#/components/schemas/IptvGroup" }, description: "Groups of the visible channels (before the group/q filters), in first-appearance order; `favorites` is not included (clients add it)." }
        favorites_count: { type: integer }
        last_channel_id: { type: [string, "null"], format: uuid }
        server_time: { type: string, format: date-time }
    IptvState:
      type: object
      required: [available, channel_count, last, playlists]
      properties:
        available: { type: boolean, description: "The profile has at least one channel." }
        channel_count: { type: integer }
        playlists:
          type: array
          description: Enabled playlists (for the profile's iptv_playlists picker).
          items:
            type: object
            required: [id, name, channel_count, selected]
            properties:
              id: { type: string, format: uuid }
              name: { type: string }
              channel_count: { type: integer }
              selected: { type: boolean, description: "Included by the profile's iptv_playlists setting." }
        last:
          oneOf:
            - type: object
              required: [channel, watched_at]
              properties:
                channel: { $ref: "#/components/schemas/IptvChannel" }
                watched_at: { type: string, format: date-time }
            - type: "null"
    IptvGuide:
      type: object
      required: [from, to, total, offset, items]
      properties:
        from: { type: string, format: date-time }
        to: { type: string, format: date-time }
        total: { type: integer, description: Channels matching the filters. }
        offset: { type: integer }
        items:
          type: array
          items:
            type: object
            required: [channel, programmes]
            properties:
              channel: { $ref: "#/components/schemas/IptvChannel" }
              programmes: { type: array, items: { $ref: "#/components/schemas/IptvProgramme" } }
    IptvPlaylistsSetting:
      description: '"all" (default: every enabled playlist, including ones added later) or a list of playlist ids.'
      oneOf:
        - { type: string, const: all }
        - { type: array, maxItems: 100, items: { type: string, format: uuid } }
    IptvPlayPayload:
      type: object
      description: "iptv.play — switch the TV to a live channel."
      required: [channel_id]
      properties:
        channel_id: { type: string, format: uuid }
        profile_id: { type: string, format: uuid, description: "The phone's profile (the TV keeps its own when omitted)." }
        force: { type: boolean }
    IptvStats:
      type: object
      required: [channels, offline, epg_matched, with_programmes]
      properties:
        channels: { type: integer, description: Active channels. }
        offline: { type: integer }
        epg_matched: { type: integer, description: Channels matched to an XMLTV channel. }
        with_programmes: { type: integer, description: "Channels with programmes now or later (EPG coverage)." }
    AdminIptvPlaylistInput:
      type: object
      properties:
        kind: { type: string, enum: [iptv_org_country, m3u_url, m3u_file], description: Required on create. }
        name: { type: string, minLength: 1, maxLength: 100, description: "Default: the country name / URL host / «Мой плейлист»." }
        url: { type: [string, "null"], maxLength: 2048, description: "m3u_url: http(s) playlist URL." }
        country: { type: [string, "null"], description: "iptv_org_country: a code from /admin/iptv/countries." }
        epg_url: { type: [string, "null"], maxLength: 4096, description: "XMLTV guides (.xml or .xml.gz), up to 5, separated by commas or new lines; merged in this order (first match wins per channel). Empty = the playlist's own x-tvg-url list, else the country preset's guides." }
        enabled: { type: boolean }
        user_agent: { type: [string, "null"], maxLength: 300, description: "Sent with stream requests (channel #EXTVLCOPT wins)." }
        referrer: { type: [string, "null"], maxLength: 2048 }
        via_proxy: { type: boolean, description: "Fetch the playlist, EPG and logos through IPTV_PROXY_URL. Off: direct first, the proxy only as a fallback when configured." }
        position: { type: integer, minimum: 0, maximum: 1000, description: "Order between playlists (channel numbering follows it)." }
    AdminIptvPlaylist:
      type: object
      required: [id, kind, name, url, country, epg_url, effective_epg_url, enabled, user_agent, referrer, via_proxy, position, has_content, refresh, epg, stats, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, enum: [iptv_org_country, m3u_url, m3u_file] }
        name: { type: string }
        url: { type: [string, "null"] }
        country: { type: [string, "null"] }
        epg_url: { type: [string, "null"] }
        effective_epg_url: { type: [string, "null"], description: "The first guide actually used (null = no guide)." }
        epg_urls: { type: array, items: { type: string }, description: "Every guide used, in merge priority." }
        enabled: { type: boolean }
        user_agent: { type: [string, "null"] }
        referrer: { type: [string, "null"] }
        via_proxy: { type: boolean }
        position: { type: integer }
        has_content: { type: boolean, description: "m3u_file: a file was uploaded." }
        refresh:
          type: object
          required: [status, error, refreshed_at, fetched_via]
          properties:
            status: { type: string, enum: [never, running, ok, error] }
            error: { type: [string, "null"] }
            refreshed_at: { type: [string, "null"], format: date-time }
            fetched_via: { type: [string, "null"], enum: [direct, proxy, upload, null] }
        epg:
          type: object
          required: [status, error, refreshed_at, xmltv_channels, programmes, guides]
          properties:
            status: { type: string, enum: [never, running, ok, error, none] }
            error: { type: [string, "null"] }
            refreshed_at: { type: [string, "null"], format: date-time }
            xmltv_channels: { type: integer, description: "Channels in the XMLTV files (sum over guides)." }
            programmes: { type: integer, description: "Programmes stored for matched channels (−1…+2 days, sum over guides)." }
            guides:
              type: array
              description: "The playlist's guides in merge priority. `error` is classified: download_timeout, stalled, truncated, http_status, too_large, fetch_failed, parse_error at byte N."
              items: { $ref: "#/components/schemas/IptvGuideState" }
        stats: { $ref: "#/components/schemas/IptvStats" }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    # ------------------------------------------------------------ video (YouTube via Invidious)
    VideoProgress:
      type: object
      required: [position_seconds, duration_seconds, finished, updated_at]
      properties:
        position_seconds: { type: number }
        duration_seconds: { type: number }
        finished: { type: boolean }
        updated_at: { type: string, format: date-time }
    VideoItem:
      type: object
      description: A video card. Images are same-origin (/api/v1/video/thumbs/…).
      required: [id, title, channel_id, channel_name, channel_verified, duration_seconds, views, published_at, published_text, thumbnail, thumbnail_hd, live, upcoming, short]
      properties:
        id: { type: string, pattern: "^[A-Za-z0-9_-]{11}$" }
        title: { type: string }
        channel_id: { type: string }
        channel_name: { type: string }
        channel_verified: { type: boolean }
        duration_seconds: { type: [integer, "null"], description: "null for live streams / unknown." }
        views: { type: [integer, "null"] }
        published_at: { type: [string, "null"], format: date-time, description: "Approximate (YouTube gives «2 days ago»)." }
        published_text: { type: [string, "null"], description: "Invidious' English relative text; clients format published_at themselves." }
        thumbnail: { type: string, description: "320×180 (mqdefault)." }
        thumbnail_hd: { type: string, description: "480×360 letterboxed (hqdefault): show with object-fit: cover." }
        live: { type: boolean, description: "A live stream: not playable yet (POST /playback/sources → 422 video_live_unsupported)." }
        upcoming: { type: boolean }
        short: { type: boolean, description: "A Short (≤ 60 s or #shorts)." }
        progress: { oneOf: [{ $ref: "#/components/schemas/VideoProgress" }, { type: "null" }], description: "With profile_id: the resume position. Omitted otherwise." }
    VideoList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/VideoItem" } }
    VideoPage:
      type: object
      required: [items, continuation]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/VideoItem" } }
        continuation: { type: [string, "null"] }
    VideoChannelRef:
      type: object
      required: [id, name, avatar, subscribers, video_count, verified, subscribed]
      properties:
        id: { type: string }
        name: { type: string }
        avatar: { type: [string, "null"], description: "176 px, same-origin." }
        subscribers: { type: [integer, "null"] }
        video_count: { type: [integer, "null"] }
        verified: { type: boolean }
        subscribed: { type: boolean, description: "With profile_id." }
    VideoSubscription:
      allOf:
        - { $ref: "#/components/schemas/VideoChannelRef" }
        - type: object
          required: [created_at]
          properties:
            created_at: { type: string, format: date-time }
    VideoPlaylistRef:
      type: object
      required: [id, title, channel_id, channel_name, video_count, thumbnail]
      properties:
        id: { type: string }
        title: { type: string }
        channel_id: { type: string }
        channel_name: { type: string }
        video_count: { type: integer }
        thumbnail: { type: [string, "null"] }
    VideoPlaylist:
      allOf:
        - { $ref: "#/components/schemas/VideoPlaylistRef" }
        - type: object
          required: [description, videos]
          properties:
            description: { type: string }
            videos: { type: array, items: { $ref: "#/components/schemas/VideoItem" } }
    VideoSearchResult:
      type: object
      required: [videos, channels, playlists, page]
      properties:
        videos: { type: array, items: { $ref: "#/components/schemas/VideoItem" } }
        channels: { type: array, items: { $ref: "#/components/schemas/VideoChannelRef" } }
        playlists: { type: array, items: { $ref: "#/components/schemas/VideoPlaylistRef" } }
        page: { type: integer }
    VideoDetail:
      allOf:
        - { $ref: "#/components/schemas/VideoItem" }
        - type: object
          required: [description, likes, genre, channel, related, in_watch_later, qualities, captions, playable]
          properties:
            description: { type: string, description: Plain text. }
            likes: { type: [integer, "null"] }
            genre: { type: [string, "null"] }
            channel: { $ref: "#/components/schemas/VideoChannelRef" }
            related: { type: array, items: { $ref: "#/components/schemas/VideoItem" } }
            in_watch_later: { type: boolean }
            qualities: { type: array, items: { type: integer }, description: "Playable heights ≤ 1080, descending (H.264; 360 is also the progressive fallback)." }
            captions:
              type: array
              items: { type: object, required: [label, language], properties: { label: { type: string }, language: { type: string } } }
            playable: { type: boolean, description: "false for live streams/premieres and videos without an H.264/AAC format." }
    VideoChannel:
      allOf:
        - { $ref: "#/components/schemas/VideoChannelRef" }
        - type: object
          required: [banner, description, videos, continuation]
          properties:
            banner: { type: [string, "null"] }
            description: { type: string }
            videos: { type: array, items: { $ref: "#/components/schemas/VideoItem" } }
            continuation: { type: [string, "null"] }
    VideoPlayPayload:
      type: object
      description: "video.play — play a YouTube video on the TV (the «Видео» tab). Busy TVs answer busy_playing unless force. With force, the video_id the TV already plays and a quality, the TV switches the quality in place (continuing from where it is)."
      required: [video_id]
      properties:
        video_id: { type: string, pattern: "^[A-Za-z0-9_-]{11}$" }
        profile_id: { type: string, format: uuid, description: "The phone's profile (the TV keeps its own when omitted)." }
        position_seconds: { type: number, minimum: 0, description: "Start here (the phone's current position)." }
        quality: { type: integer, enum: [480, 720, 1080], description: "Default: the profile's video_quality." }
        force: { type: boolean }
    Incident:
      type: object
      required: [id, kind, cause, detail, source, summary, notes, opened_at, closed_at, reminders]
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, enum: [tmdb, prowlarr, jackett, torrserver, invidious, proxy, disk, database, youtube, vpn, updater] }
        cause: { type: string, description: "e.g. unauthorized (tmdb), search / streams (youtube), rollback (updater)." }
        detail: { type: string, description: "Technical detail (error text, free space)." }
        source: { type: string, enum: [monitor, host] }
        summary: { type: string, description: "What broke, localized." }
        notes: { type: array, items: { type: string }, description: "Actions taken (restarts, rollback), localized." }
        opened_at: { type: string, format: date-time }
        closed_at: { type: [string, "null"], format: date-time }
        reminders: { type: integer }
    AdminVideoStatus:
      type: object
      required: [configured, reachable, version, latency_ms, checked_at, last_error, last_error_at, last_ok_at, subscriptions, channels, feed_videos, feed_refreshed_at]
      properties:
        configured: { type: boolean, description: "INVIDIOUS_URL is set." }
        reachable: { type: [boolean, "null"], description: "Last /api/v1/stats probe (null = not probed yet)." }
        version: { type: [string, "null"] }
        latency_ms: { type: [integer, "null"] }
        checked_at: { type: [string, "null"], format: date-time }
        last_error: { type: [string, "null"], description: "Last failed Invidious call (any endpoint)." }
        last_error_at: { type: [string, "null"], format: date-time }
        last_ok_at: { type: [string, "null"], format: date-time }
        subscriptions: { type: integer }
        channels: { type: integer, description: "Distinct subscribed channels in the feed cache." }
        feed_videos: { type: integer }
        feed_refreshed_at: { type: [string, "null"], format: date-time }
    IptvGuideState:
      type: object
      required: [url, status, error, fetched_at, bytes, took_ms, fetched_via, xmltv_channels, programmes, matched, progress]
      properties:
        url: { type: string }
        status: { type: string, enum: [never, running, ok, error] }
        error: { type: [string, "null"] }
        fetched_at: { type: [string, "null"], format: date-time }
        bytes: { type: integer, description: Last download size (compressed). }
        took_ms: { type: integer, description: Download + parse time. }
        fetched_via: { type: [string, "null"], enum: [direct, proxy, null] }
        xmltv_channels: { type: integer }
        programmes: { type: integer }
        matched: { type: integer, description: "Playlist channels this guide matched (with programmes), before the merge." }
        progress:
          oneOf:
            - type: object
              required: [phase, bytes, total]
              properties:
                phase: { type: string, enum: [download, parse, store] }
                bytes: { type: integer }
                total: { type: integer, description: "−1 = unknown." }
            - type: "null"
    Role:
      type: string
      enum: [user, admin, super_admin]
      description: "user < admin < super_admin. super_admin = admin + manages administrators + sees every device and pairing request."
    AdminDevice:
      type: object
      description: "A household TV as a super_admin sees it (metadata only)."
      required: [id, owner_user_id, owner_username, owner_display_name, name, platform, model, app_version, default_profile_id, default_profile_name, created_at, last_seen_at, credential_active, online, shares]
      properties:
        id: { type: string, format: uuid }
        owner_user_id: { type: string, format: uuid }
        owner_username: { type: string }
        owner_display_name: { type: string }
        name: { type: string }
        platform: { type: string }
        model: { type: string, description: "The TV's latest reported device model, else the User-Agent seen at pairing (may be empty)." }
        app_version: { type: [string, "null"], description: "Release from the TV's latest client report, when known." }
        default_profile_id: { type: [string, "null"], format: uuid }
        default_profile_name: { type: [string, "null"] }
        created_at: { type: string, format: date-time }
        last_seen_at: { type: [string, "null"], format: date-time }
