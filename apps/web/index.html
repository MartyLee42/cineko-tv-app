<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#08090c" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="icon" href="/favicon.png" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Cineko</title>
    <script>
      // Apply the cached design + theme before first paint (see src/watch/settings.ts).
      try {
        // The PWA's own key first (the shared one may hold the TV app's design: watch/settings.ts cachedDesign).
        var d = localStorage.getItem("martytv.web_design") || localStorage.getItem("martytv.design");
        if (!/^(kinozal|terminal|projector|wireframe|cyberpunk|deco|retro80|retro90|popart|constructivism|matrix|stickerbook|pocketpet|odyssey|mult|tarkovsky|silent|anderson|noir|vague|western|redroom)$/.test(d || "")) d = "kinozal";
        var t = localStorage.getItem("martytv.theme");
        var light = d === "kinozal" && (t === "light" || (t !== "dark" && window.matchMedia && matchMedia("(prefers-color-scheme: light)").matches));
        document.documentElement.classList.add("design-" + d, light ? "theme-light" : "theme-dark");
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
